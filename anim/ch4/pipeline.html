<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>请求生命周期 Pipeline</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: transparent;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  line-height: 1.6;
  padding: 4px;
}
.anim-container { background: #12122a; border: 1px solid #444; border-radius: 12px; padding: 20px; margin: 4px 0; position: relative; overflow: hidden; min-height: 200px; }
.anim-label { position: absolute; top: 10px; right: 15px; font-size: 0.75em; color: #666; text-transform: uppercase; letter-spacing: 1px; }
.pipeline-stages { display: flex; align-items: center; justify-content: space-around; padding: 30px 10px; flex-wrap: wrap; gap: 10px; }
.pipeline-stage { background: #2a2a4a; border: 2px solid #444; border-radius: 10px; padding: 15px 20px; text-align: center; min-width: 120px; transition: all 0.5s; position: relative; }
.pipeline-stage.active { border-color: #ff9800; background: #2a2a3a; box-shadow: 0 0 20px rgba(255, 152, 0, 0.3); }
.pipeline-arrow { color: #ff9800; font-size: 1.5em; }
.request-token { position: absolute; width: 12px; height: 12px; background: #ffd700; border-radius: 50%; top: -6px; left: 50%; transform: translateX(-50%); opacity: 0; transition: all 0.3s; }
.pipeline-stage.active .request-token { opacity: 1; transform: translateX(-50%) scale(1.3); box-shadow: 0 0 8px 2px rgba(255, 215, 0, 0.8); }
.btn { background: linear-gradient(135deg, #ff9800, #e68900); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 0.9em; transition: all 0.2s; margin: 5px; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(255, 152, 0, 0.4); }
.btn:active { transform: translateY(0); }
.btn.secondary { background: linear-gradient(135deg, #555, #444); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
.step-text { color: #ff9800; font-size: 0.9em; min-height: 40px; margin: 10px auto 0; padding: 10px; background: #1a1a2e; border-radius: 6px; max-width: 600px; text-align: center; }
.step-counter { color: #888; font-size: 0.8em; text-align: center; margin-top: 8px; letter-spacing: 1px; }
</style>
</head>
<body>

<div class="anim-container" id="pipeline-anim">
<span class="anim-label">Pipeline Animation</span>
<div class="pipeline-stages">
<div class="pipeline-stage" id="stage-tokenize">
<div class="request-token"></div>
<strong>Tokenize</strong>
<div style="font-size:0.75em; color:#aaa; margin-top:5px;">文本 → Token IDs</div>
</div>
<span class="pipeline-arrow">→</span>
<div class="pipeline-stage" id="stage-schedule">
<div class="request-token"></div>
<strong>Schedule</strong>
<div style="font-size:0.75em; color:#aaa; margin-top:5px;">Batch 组装</div>
</div>
<span class="pipeline-arrow">→</span>
<div class="pipeline-stage" id="stage-prefill">
<div class="request-token"></div>
<strong>Prefill</strong>
<div style="font-size:0.75em; color:#aaa; margin-top:5px;">并行处理 prompt</div>
</div>
<span class="pipeline-arrow">→</span>
<div class="pipeline-stage" id="stage-decode">
<div class="request-token"></div>
<strong>Decode</strong>
<div style="font-size:0.75em; color:#aaa; margin-top:5px;">逐 token 生成</div>
</div>
<span class="pipeline-arrow">→</span>
<div class="pipeline-stage" id="stage-detokenize">
<div class="request-token"></div>
<strong>Detokenize</strong>
<div style="font-size:0.75em; color:#aaa; margin-top:5px;">Token IDs → 文本</div>
</div>
</div>
<div class="step-text" id="pipeline-step-text"></div>
<div class="step-counter" id="pipeline-step-counter">Step 0 / 4</div>
<div style="text-align:center; margin-top:15px;">
<button class="btn secondary" id="pipeline-prev" onclick="prev()">&larr; 上一步</button>
<button class="btn secondary" id="pipeline-next" onclick="next()">下一步 &rarr;</button>
<button class="btn secondary" onclick="reset()">&#8634; 重置</button>
<button class="btn" id="pipeline-auto" onclick="auto()">&#9654; 自动播放</button>
</div>
</div>

<script>
// ==================== Pipeline Animation (step-through) ====================
const pipelineSteps = [
    { id: 'stage-tokenize',   desc: 'Step 1 - Tokenize: 输入文本被切分并映射为 Token IDs' },
    { id: 'stage-schedule',   desc: 'Step 2 - Schedule: 调度器将请求组装进 Batch, 等待执行' },
    { id: 'stage-prefill',    desc: 'Step 3 - Prefill: 并行处理整个 prompt, 填充 KV Cache' },
    { id: 'stage-decode',     desc: 'Step 4 - Decode: 自回归逐 token 生成, 复用 KV Cache' },
    { id: 'stage-detokenize', desc: 'Step 5 - Detokenize: 生成的 Token IDs 解码回可读文本' },
];
const N = pipelineSteps.length; // 5

let pipelineStep = 0;
let pipelineTimer = null;

function renderPipeline() {
    document.querySelectorAll('.pipeline-stage').forEach(s => s.classList.remove('active'));
    document.getElementById(pipelineSteps[pipelineStep].id).classList.add('active');
    document.getElementById('pipeline-step-text').textContent = pipelineSteps[pipelineStep].desc;
    document.getElementById('pipeline-step-counter').textContent = `Step ${pipelineStep} / ${N - 1}`;

    const atStart = pipelineStep === 0;
    const atEnd = pipelineStep === N - 1;
    document.getElementById('pipeline-prev').disabled = atStart;
    document.getElementById('pipeline-next').disabled = atEnd;
    // disabled at the last step, or while an auto-play run is in progress
    document.getElementById('pipeline-auto').disabled = atEnd || pipelineTimer !== null;
}

function stopAuto() {
    if (pipelineTimer) { clearTimeout(pipelineTimer); pipelineTimer = null; }
}

function prev() {
    stopAuto();
    pipelineStep = Math.max(0, pipelineStep - 1);
    renderPipeline();
}

function next() {
    stopAuto();
    pipelineStep = Math.min(N - 1, pipelineStep + 1);
    renderPipeline();
}

function reset() {
    stopAuto();
    pipelineStep = 0;
    renderPipeline();
}

function auto() {
    stopAuto();
    const tick = () => {
        if (pipelineStep >= N - 1) { pipelineTimer = null; renderPipeline(); return; }
        pipelineStep++;
        if (pipelineStep < N - 1) {
            pipelineTimer = setTimeout(tick, 900);
        } else {
            pipelineTimer = null;
        }
        renderPipeline();
    };
    // mark a run as active so renderPipeline keeps the auto button disabled
    pipelineTimer = setTimeout(tick, 900);
    renderPipeline();
}

// initial still frame
renderPipeline();

// ==================== Auto-start pipeline once on scroll ====================
let pipelineAutoTriggered = false;
const pipelineObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        // only auto-play once, and never override manual stepping
        if (entry.isIntersecting && !pipelineAutoTriggered && pipelineStep === 0 && pipelineTimer === null) {
            pipelineAutoTriggered = true;
            auto();
        }
    });
}, { threshold: 0.5 });

const pipelineEl = document.getElementById('pipeline-anim');
if (pipelineEl) pipelineObserver.observe(pipelineEl);
</script>

<script>
(function () {
  function reportHeight() { parent.postMessage({ type: 'tc-anim-height', height: document.documentElement.scrollHeight }, '*'); }
  window.addEventListener('load', reportHeight);
  if (window.ResizeObserver) { new ResizeObserver(reportHeight).observe(document.body); } else { setInterval(reportHeight, 500); }
})();
</script>
</body>
</html>
