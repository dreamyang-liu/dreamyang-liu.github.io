<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>动态规划动画</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: transparent;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  line-height: 1.7;
  padding: 4px;
}
code {
  background: #1a1a2e;
  padding: 2px 6px;
  border-radius: 4px;
  font-family: 'Fira Code', monospace;
  font-size: 0.9em;
  color: #76b900;
}
h3 { color: #76b900; margin: 20px 0 8px; font-size: 1.1em; }
.anim-container {
  background: #0a0a1a;
  border-radius: 12px;
  padding: 20px;
  margin: 16px 0;
  overflow-x: auto;
  border: 1px solid #333;
}
.anim-controls {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.anim-controls button {
  background: #76b900;
  color: #0f0f23;
  border: none;
  padding: 6px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
  font-size: 0.85em;
}
.anim-controls button:hover { opacity: 0.85; }
.anim-controls button.secondary { background: #00d4aa; }
/* DP Table */
.dp-table { border-collapse: collapse; margin: 8px auto; }
.dp-table td, .dp-table th {
  width: 40px; height: 40px;
  text-align: center;
  border: 1px solid #444;
  font-size: 0.85em;
  transition: all 0.3s;
}
.dp-table th { background: #252540; color: #00d4aa; }
.dp-table .current { background: #76b900; color: #0f0f23; font-weight: bold; }
.dp-table .dep { background: #00d4aa33; }
.dp-table .filled { background: #1a2a3a; }
/* Knapsack */
.knapsack-row {
  display: flex;
  gap: 4px;
  margin: 6px 0;
  flex-wrap: wrap;
}
.knapsack-cell {
  width: 44px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  background: #252540;
  border-radius: 4px;
  font-size: 0.8em;
  transition: all 0.3s;
}
.knapsack-cell.current { background: #76b900; color: #0f0f23; font-weight: bold; }
.knapsack-cell.ref { background: #00d4aa44; border: 1px solid #00d4aa; }
.knapsack-cell.updated { background: #3a3a1a; }
.dual-panel {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
@media (max-width: 700px) {
  .dual-panel { grid-template-columns: 1fr; }
}
.status-msg { color: #888; font-size: 0.85em; margin-left: 4px; }
.step-counter { color: #76b900; font-size: 0.85em; font-weight: bold; margin-left: 4px; }
.anim-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
.anim-controls button:disabled:hover { opacity: 0.4; }
</style>
</head>
<body>

<h3>LCS 填表动画</h3>
<div class="anim-container">
  <div class="anim-controls">
    <button id="lcs-prev" onclick="lcsPrev()">← 上一步</button>
    <button id="lcs-next" onclick="lcsNext()">下一步 →</button>
    <button class="secondary" id="lcs-auto" onclick="lcsAutoPlay()">▶ 自动播放</button>
    <button id="lcs-reset" onclick="lcsReset()">↺ 重置</button>
    <span class="step-counter" id="lcs-counter"></span>
    <span class="status-msg" id="lcs-status"></span>
  </div>
  <p style="margin-bottom:8px;font-size:0.9em;">字符串: <code>"ABCDE"</code> vs <code>"ACE"</code></p>
  <table class="dp-table" id="lcs-table"></table>
</div>

<h3>0/1 背包 vs 完全背包 动画</h3>
<div class="anim-container">
  <div class="anim-controls">
    <button id="knapsack-prev" onclick="knapsackPrev()">← 上一步</button>
    <button id="knapsack-next" onclick="knapsackNext()">下一步 →</button>
    <button class="secondary" id="knapsack-auto" onclick="knapsackAutoPlay()">▶ 自动播放</button>
    <button id="knapsack-reset" onclick="knapsackReset()">↺ 重置</button>
    <span class="step-counter" id="knapsack-counter"></span>
    <span class="status-msg" id="knapsack-status"></span>
  </div>
  <p style="margin-bottom:8px;font-size:0.9em;">物品: 重量=[2,3,4], 价值=[3,4,5], 容量W=7</p>
  <div class="dual-panel">
    <div>
      <h3 style="text-align:center;margin-bottom:8px;">0/1 背包 (倒序)</h3>
      <div id="knapsack01"></div>
    </div>
    <div>
      <h3 style="text-align:center;margin-bottom:8px;">完全背包 (正序)</h3>
      <div id="knapsack-full"></div>
    </div>
  </div>
</div>

<script>
// ========== LCS Animation ==========
const lcsStr1 = "ABCDE";
const lcsStr2 = "ACE";
const m = lcsStr1.length, n = lcsStr2.length;

// Precompute one snapshot per step. step 0 = empty table (no current cell),
// steps 1..m*n each fill exactly one cell (row-major i=1..m, j=1..n).
function computeLcsSteps() {
  const dp = Array.from({length: m+1}, () => Array(n+1).fill(0));
  const steps = [];
  // step 0: initial
  steps.push({
    grid: dp.map(r => r.slice()),
    cur: null,
    label: '初始化：第 0 行 / 第 0 列 = 0（空串的 LCS 长度为 0）',
    status: ''
  });
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      let label;
      if (lcsStr1[i-1] === lcsStr2[j-1]) {
        dp[i][j] = dp[i-1][j-1] + 1;
        label = `dp[${i}][${j}]：'${lcsStr1[i-1]}' == '${lcsStr2[j-1]}' → dp[${i-1}][${j-1}]+1 = ${dp[i][j]}`;
      } else {
        dp[i][j] = Math.max(dp[i-1][j], dp[i][j-1]);
        label = `dp[${i}][${j}]：'${lcsStr1[i-1]}' ≠ '${lcsStr2[j-1]}' → max(dp[${i-1}][${j}], dp[${i}][${j-1}]) = ${dp[i][j]}`;
      }
      const isLast = (i === m && j === n);
      steps.push({
        grid: dp.map(r => r.slice()),
        cur: {i, j},
        label,
        status: isLast ? `LCS 长度 = ${dp[m][n]}` : ''
      });
    }
  }
  return steps;
}

const lcsSteps = computeLcsSteps();
const lcsLast = lcsSteps.length - 1; // = m*n
let lcsStep = 0;
let lcsRunning = false;
let lcsTimer = null;

function renderLcs() {
  const s = lcsSteps[lcsStep];
  const grid = s.grid;
  const cur = s.cur;
  const table = document.getElementById('lcs-table');
  let html = '<tr><th></th><th></th>';
  for (let j = 0; j < n; j++) html += `<th>${lcsStr2[j]}</th>`;
  html += '</tr>';
  // determine flattened fill order index of (i,j): (i-1)*n + (j-1) + 1
  const curOrd = cur ? (cur.i-1)*n + (cur.j-1) + 1 : 0;
  for (let i = 0; i <= m; i++) {
    html += '<tr>';
    html += `<th>${i === 0 ? '' : lcsStr1[i-1]}</th>`;
    for (let j = 0; j <= n; j++) {
      let cls = '';
      if (cur && i === cur.i && j === cur.j) cls = 'current';
      else if (cur && i > 0 && j > 0 &&
        ((i === cur.i-1 && j === cur.j-1) || (i === cur.i-1 && j === cur.j) || (i === cur.i && j === cur.j-1))) cls = 'dep';
      else if (i > 0 && j > 0) {
        const ord = (i-1)*n + (j-1) + 1;
        if (ord < curOrd) cls = 'filled';
      }
      html += `<td class="${cls}">${grid[i][j]}</td>`;
    }
    html += '</tr>';
  }
  table.innerHTML = html;
  document.getElementById('lcs-status').textContent = s.status || s.label;
  document.getElementById('lcs-counter').textContent = `Step ${lcsStep} / ${lcsLast}`;
  updateLcsButtons();
}

function updateLcsButtons() {
  document.getElementById('lcs-prev').disabled = (lcsStep <= 0);
  const atEnd = (lcsStep >= lcsLast);
  document.getElementById('lcs-next').disabled = atEnd;
  document.getElementById('lcs-auto').disabled = atEnd && !lcsRunning;
}

function lcsNext() {
  if (lcsStep < lcsLast) { lcsStep++; renderLcs(); }
}

function lcsPrev() {
  if (lcsStep > 0) {
    if (lcsRunning) { clearInterval(lcsTimer); lcsRunning = false; document.getElementById('lcs-auto').textContent = '▶ 自动播放'; }
    lcsStep--; renderLcs();
  }
}

function lcsAutoPlay() {
  if (lcsRunning) {
    clearInterval(lcsTimer); lcsRunning = false;
    document.getElementById('lcs-auto').textContent = '▶ 自动播放';
    updateLcsButtons();
    return;
  }
  if (lcsStep >= lcsLast) return;
  lcsRunning = true;
  document.getElementById('lcs-auto').textContent = '⏸ 暂停';
  lcsTimer = setInterval(() => {
    if (lcsStep >= lcsLast) {
      clearInterval(lcsTimer); lcsRunning = false;
      document.getElementById('lcs-auto').textContent = '▶ 自动播放';
      updateLcsButtons();
      return;
    }
    lcsStep++; renderLcs();
  }, 400);
}

function lcsReset() {
  clearInterval(lcsTimer); lcsRunning = false;
  document.getElementById('lcs-auto').textContent = '▶ 自动播放';
  lcsStep = 0;
  renderLcs();
}

renderLcs();

// ========== Knapsack Animation ==========
const weights = [2, 3, 4];
const values = [3, 4, 5];
const W = 7;

// Precompute one snapshot per step. Each step advances both 0/1 (reverse j)
// and 完全背包 (forward j) by one cell, in lockstep (same cell count per item).
// step 0 = initial zeroed arrays, no highlight.
function computeKnapsackSteps() {
  const dp01 = Array(W+1).fill(0);
  const dpFull = Array(W+1).fill(0);
  const steps = [];
  steps.push({
    dp01: dp01.slice(),
    dpFull: dpFull.slice(),
    hi01: {current: -1, ref: -1},
    hiFull: {current: -1, ref: -1},
    label: `初始化：dp[] 全部为 0`,
    status: `物品 1: w=${weights[0]}, v=${values[0]}`
  });
  for (let item = 0; item < weights.length; item++) {
    const wi = weights[item], vi = values[item];
    let j01 = W;            // 0/1: from W down to wi
    let jFull = wi;         // full: from wi up to W
    while (j01 >= wi || jFull <= W) {
      let hi01 = {current: -1, ref: -1};
      let hiFull = {current: -1, ref: -1};
      let parts = [];
      if (j01 >= wi) {
        hi01 = {current: j01, ref: j01 - wi};
        dp01[j01] = Math.max(dp01[j01], dp01[j01 - wi] + vi);
        parts.push(`0/1: dp[${j01}]=max(dp[${j01}], dp[${j01-wi}]+${vi})=${dp01[j01]}`);
        j01--;
      }
      if (jFull <= W) {
        hiFull = {current: jFull, ref: jFull - wi};
        dpFull[jFull] = Math.max(dpFull[jFull], dpFull[jFull - wi] + vi);
        parts.push(`完全: dp[${jFull}]=max(dp[${jFull}], dp[${jFull-wi}]+${vi})=${dpFull[jFull]}`);
        jFull++;
      }
      steps.push({
        dp01: dp01.slice(),
        dpFull: dpFull.slice(),
        hi01, hiFull,
        label: `物品 ${item+1} (w=${wi}, v=${vi}) — ${parts.join(' ; ')}`,
        status: `物品 ${item+1}: w=${wi}, v=${vi}`
      });
    }
  }
  // mark final state on last step
  const lastSnap = steps[steps.length - 1];
  lastSnap.hi01 = {current: -1, ref: -1};
  lastSnap.hiFull = {current: -1, ref: -1};
  lastSnap.status = `完成! 0/1=${dp01[W]}, 完全=${dpFull[W]}`;
  return steps;
}

const kSteps = computeKnapsackSteps();
const kLast = kSteps.length - 1;
let kStep = 0;
let kRunning = false;
let kTimer = null;

function renderKnapsack() {
  const s = kSteps[kStep];
  // 0/1
  let html01 = '<div style="font-size:0.8em;color:#888;margin-bottom:4px;">idx: ';
  for (let j = 0; j <= W; j++) html01 += `<span style="display:inline-block;width:44px;text-align:center;">${j}</span>`;
  html01 += '</div><div class="knapsack-row">';
  for (let j = 0; j <= W; j++) {
    let cls = '';
    if (j === s.hi01.current) cls = 'current';
    else if (j === s.hi01.ref) cls = 'ref';
    html01 += `<div class="knapsack-cell ${cls}">${s.dp01[j]}</div>`;
  }
  html01 += '</div>';
  document.getElementById('knapsack01').innerHTML = html01;

  // Full
  let htmlF = '<div style="font-size:0.8em;color:#888;margin-bottom:4px;">idx: ';
  for (let j = 0; j <= W; j++) htmlF += `<span style="display:inline-block;width:44px;text-align:center;">${j}</span>`;
  htmlF += '</div><div class="knapsack-row">';
  for (let j = 0; j <= W; j++) {
    let cls = '';
    if (j === s.hiFull.current) cls = 'current';
    else if (j === s.hiFull.ref) cls = 'ref';
    htmlF += `<div class="knapsack-cell ${cls}">${s.dpFull[j]}</div>`;
  }
  htmlF += '</div>';
  document.getElementById('knapsack-full').innerHTML = htmlF;

  document.getElementById('knapsack-status').textContent = s.status;
  document.getElementById('knapsack-counter').textContent = `Step ${kStep} / ${kLast}`;
  updateKnapsackButtons();
}

function updateKnapsackButtons() {
  document.getElementById('knapsack-prev').disabled = (kStep <= 0);
  const atEnd = (kStep >= kLast);
  document.getElementById('knapsack-next').disabled = atEnd;
  document.getElementById('knapsack-auto').disabled = atEnd && !kRunning;
}

function knapsackNext() {
  if (kStep < kLast) { kStep++; renderKnapsack(); }
}

function knapsackPrev() {
  if (kStep > 0) {
    if (kRunning) { clearInterval(kTimer); kRunning = false; document.getElementById('knapsack-auto').textContent = '▶ 自动播放'; }
    kStep--; renderKnapsack();
  }
}

function knapsackAutoPlay() {
  if (kRunning) {
    clearInterval(kTimer); kRunning = false;
    document.getElementById('knapsack-auto').textContent = '▶ 自动播放';
    updateKnapsackButtons();
    return;
  }
  if (kStep >= kLast) return;
  kRunning = true;
  document.getElementById('knapsack-auto').textContent = '⏸ 暂停';
  kTimer = setInterval(() => {
    if (kStep >= kLast) {
      clearInterval(kTimer); kRunning = false;
      document.getElementById('knapsack-auto').textContent = '▶ 自动播放';
      updateKnapsackButtons();
      return;
    }
    kStep++; renderKnapsack();
  }, 350);
}

function knapsackReset() {
  clearInterval(kTimer); kRunning = false;
  document.getElementById('knapsack-auto').textContent = '▶ 自动播放';
  kStep = 0;
  renderKnapsack();
}

renderKnapsack();

// ========== 自动把高度汇报给父页面 ==========
(function () {
  function reportHeight() { parent.postMessage({ type: 'tc-anim-height', height: document.documentElement.scrollHeight }, '*'); }
  window.addEventListener('load', reportHeight);
  if (window.ResizeObserver) { new ResizeObserver(reportHeight).observe(document.body); } else { setInterval(reportHeight, 500); }
})();
</script>
</body>
</html>
