<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KV Cache 生成过程</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: transparent; color: #e0e0e0; font-family: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; line-height: 1.6; padding: 4px; }
.animation-container { background: #0a0a1a; border-radius: 12px; padding: 20px; border: 1px solid #333; position: relative; overflow: hidden; }
.btn { background: linear-gradient(135deg, #76b900, #00d4aa); color: #000; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.9rem; transition: transform 0.2s, opacity 0.2s; }
.btn:hover { transform: scale(1.05); opacity: 0.9; }
.btn:active { transform: scale(0.95); }
.btn-secondary { background: #333; color: #e0e0e0; border: 1px solid #555; }
.btn-secondary:hover { background: #444; }
.controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; align-items: center; }
.step-info { color: #76b900; font-size: 0.9rem; margin: 10px 0; min-height: 24px; }
.kv-token { display: inline-flex; align-items: center; justify-content: center; padding: 8px 12px; margin: 4px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; transition: all 0.3s ease; }
.kv-token.generated { background: #76b900; color: #000; }
.kv-token.cached { background: #1a1a2e; border: 2px solid #00d4aa; color: #00d4aa; }
.kv-token.computing { background: #ff6b6b; color: #000; animation: pulse 0.5s ease infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
</style>
</head>
<body>

<div class="animation-container" id="kvcache-animation">
  <div class="controls">
    <button class="btn" onclick="kvCacheDemo.generate()">生成下一个 Token</button>
    <button class="btn btn-secondary" onclick="kvCacheDemo.reset()">重置</button>
  </div>
  <div class="step-info" id="kvcache-step-info">点击 "生成下一个 Token" 观察 Attention 计算过程和 KV Cache 变化</div>

  <div style="margin-top: 15px; margin-bottom: 15px;">
    <strong style="color: #76b900;">已生成序列：</strong>
    <div id="kv-tokens" style="margin-top: 8px; min-height: 44px; display: flex; flex-wrap: wrap; gap: 4px;"></div>
  </div>

  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 15px;">
    <div>
      <strong style="color: #00d4aa; font-size: 0.9rem;">Attention 计算 (当前步):</strong>
      <div id="kv-attn-matrix" style="margin-top: 10px; background: #0a0a1a; border-radius: 8px; padding: 15px; border: 1px solid #333; min-height: 180px;"></div>
    </div>
    <div>
      <strong style="color: #ff9800; font-size: 0.9rem;">KV Cache 状态:</strong>
      <div id="kv-cache-visual" style="margin-top: 10px; background: #0a0a1a; border-radius: 8px; padding: 15px; border: 1px solid #333; min-height: 180px;"></div>
    </div>
  </div>

  <div id="kv-explanation" style="margin-top: 15px; background: #1a1a2e; border-radius: 8px; padding: 15px; border: 1px solid #333; font-size: 0.9rem; min-height: 80px;"></div>

  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px;">
    <div style="background: #76b90011; border: 1px solid #76b90044; border-radius: 8px; padding: 12px;">
      <div style="color: #76b900; font-weight: bold; font-size: 0.85rem;">有 KV Cache</div>
      <div id="kv-stats-cache" style="font-size: 0.8rem; color: #aaa; margin-top: 5px;"></div>
    </div>
    <div style="background: #ff444411; border: 1px solid #ff444444; border-radius: 8px; padding: 12px;">
      <div style="color: #ff6b6b; font-weight: bold; font-size: 0.85rem;">无 KV Cache</div>
      <div id="kv-stats-nocache" style="font-size: 0.8rem; color: #aaa; margin-top: 5px;"></div>
    </div>
  </div>
</div>

<script>
// ========== KV Cache (Enhanced)（从 ch1 原文件抽取）==========
const kvCacheDemo = (() => {
  const tokens = ['The', 'cat', 'sat', 'on', 'the', 'mat', '.', 'It'];
  let generated = [];
  let totalComputeCache = 0;
  let totalComputeNoCache = 0;

  function render() {
    const n = generated.length;

    const tokenDiv = document.getElementById('kv-tokens');
    tokenDiv.innerHTML = generated.map((t, i) => {
      const isNew = (i === n - 1);
      return `<span class="kv-token ${isNew ? 'computing' : 'generated'}">${t}${isNew ? ' (new)' : ''}</span>`;
    }).join('');

    const attnDiv = document.getElementById('kv-attn-matrix');
    if (n === 0) {
      attnDiv.innerHTML = '<div style="color:#666; text-align:center; padding-top:60px;">等待生成第一个 token...</div>';
    } else {
      let html = '<div style="font-size:0.75rem; color:#888; margin-bottom:8px;">Q (query) × K<sup>T</sup> (keys) → attention scores:</div>';
      html += '<div style="overflow-x:auto;">';
      html += '<table style="border-collapse:collapse; font-size:0.7rem; width:100%;">';
      html += '<tr><td style="padding:3px;"></td>';
      for (let j = 0; j < n; j++) {
        html += `<td style="padding:3px 5px; text-align:center; color:#4caf50; font-weight:bold; border-bottom:1px solid #333;">k<sub>${generated[j]}</sub></td>`;
      }
      html += '</tr>';
      for (let i = 0; i < n; i++) {
        const isNewRow = (i === n - 1);
        html += `<tr>`;
        html += `<td style="padding:3px 5px; color:${isNewRow ? '#2196f3' : '#555'}; font-weight:bold; white-space:nowrap;">q<sub>${generated[i]}</sub></td>`;
        for (let j = 0; j < n; j++) {
          const isComputed = isNewRow;
          const isCausal = j <= i;
          let bg = '#1a1a2e';
          let color = '#666';
          if (!isCausal) {
            bg = '#0a0a0a'; color = '#333';
          } else if (isComputed) {
            bg = '#76b90033'; color = '#76b900';
          } else {
            bg = '#ffffff08'; color = '#888';
          }
          const val = isCausal ? (isComputed ? '●' : '○') : '✕';
          html += `<td style="padding:3px 5px; text-align:center; background:${bg}; color:${color}; border:1px solid #222;">${val}</td>`;
        }
        html += '</tr>';
      }
      html += '</table></div>';
      html += `<div style="margin-top:8px; font-size:0.7rem; display:flex; gap:10px; flex-wrap:wrap;">
        <span><span style="color:#76b900;">●</span> 本步计算</span>
        <span><span style="color:#888;">○</span> 历史(已缓存结果)</span>
        <span><span style="color:#333;">✕</span> causal mask</span>
      </div>`;
      attnDiv.innerHTML = html;
    }

    const cacheDiv = document.getElementById('kv-cache-visual');
    if (n === 0) {
      cacheDiv.innerHTML = '<div style="color:#666; text-align:center; padding-top:60px;">KV Cache 为空</div>';
    } else {
      let html = '<div style="font-size:0.75rem; color:#888; margin-bottom:8px;">缓存的 K 和 V 向量 (每层每头):</div>';
      for (let i = 0; i < n; i++) {
        const isNew = (i === n - 1);
        const borderColor = isNew ? '#ff9800' : '#4caf50';
        const bg = isNew ? '#ff980022' : '#4caf5011';
        const label = isNew ? '← 新加入' : '';
        html += `<div style="display:flex; align-items:center; gap:6px; margin:3px 0;">
          <span style="font-size:0.7rem; color:#888; min-width:45px;">${generated[i]}</span>
          <div style="flex:1; display:flex; gap:3px;">
            <div style="flex:1; height:14px; background:${bg}; border:1px solid ${borderColor}; border-radius:3px; position:relative;">
              <span style="position:absolute; left:4px; top:0; font-size:0.6rem; color:${borderColor};">K</span>
            </div>
            <div style="flex:1; height:14px; background:${bg}; border:1px solid ${borderColor}; border-radius:3px; position:relative;">
              <span style="position:absolute; left:4px; top:0; font-size:0.6rem; color:${borderColor};">V</span>
            </div>
          </div>
          <span style="font-size:0.65rem; color:#ff9800;">${label}</span>
        </div>`;
      }
      html += `<div style="margin-top:8px; font-size:0.7rem; color:#888;">Cache 大小: ${n} 行 × d 维 × 2 (K+V)</div>`;
      cacheDiv.innerHTML = html;
    }

    const explDiv = document.getElementById('kv-explanation');
    if (n === 0) {
      explDiv.innerHTML = '<span style="color:#888;">点击按钮开始生成。每一步会展示 Attention 计算的输入、输出和 KV Cache 变化。</span>';
    } else if (n === 1) {
      explDiv.innerHTML = `
        <div style="color:#76b900; font-weight:bold; margin-bottom:5px;">Prefill 阶段 (第 1 个 token: "${generated[0]}")</div>
        <div style="color:#ccc;">
          <strong>计算:</strong> q<sub>${generated[0]}</sub> × k<sub>${generated[0]}</sub><sup>T</sup> → score → softmax → × v<sub>${generated[0]}</sub> → output<br>
          <strong>KV Cache:</strong> 将 k<sub>${generated[0]}</sub>, v<sub>${generated[0]}</sub> 存入 Cache (1 行)<br>
          <strong>本步 Attention 矩阵:</strong> 1×1 (只有 1 个 token 对 1 个 token)
        </div>`;
    } else {
      const newTok = generated[n-1];
      const prevToks = generated.slice(0, n-1).join(', ');
      explDiv.innerHTML = `
        <div style="color:#76b900; font-weight:bold; margin-bottom:5px;">Decode 阶段 (第 ${n} 步: 生成 "${newTok}")</div>
        <div style="color:#ccc;">
          <strong>Q 输入:</strong> 只有新 token 的 query → q<sub>${newTok}</sub> (1×d 向量)<br>
          <strong>K 来源:</strong> Cache 中已有 [${prevToks}] 的 K + 新的 k<sub>${newTok}</sub> → 共 ${n} 个 key 向量<br>
          <strong>V 来源:</strong> Cache 中已有 [${prevToks}] 的 V + 新的 v<sub>${newTok}</sub> → 共 ${n} 个 value 向量<br>
          <strong>Attention 计算:</strong> q<sub>${newTok}</sub> × [k<sub>${generated[0]}</sub>, ..., k<sub>${newTok}</sub>]<sup>T</sup> = <strong>1×${n} 的 score 向量</strong> → softmax → 加权求和 V → output<br>
          <span style="color:#76b900;">★ 只需计算 1 行 (1×${n})，而非重算整个 ${n}×${n} 矩阵!</span>
        </div>`;
    }

    const cacheStats = document.getElementById('kv-stats-cache');
    const noCacheStats = document.getElementById('kv-stats-nocache');
    if (n === 0) {
      cacheStats.innerHTML = '累计计算量: 0';
      noCacheStats.innerHTML = '累计计算量: 0';
    } else {
      cacheStats.innerHTML = `本步: 1×${n} = ${n} 次 dot product<br>累计: ${totalComputeCache} 次<br><span style="color:#76b900;">每步只算新 token 的一行</span>`;
      noCacheStats.innerHTML = `本步: ${n}×${n} = ${n*n} 次 dot product<br>累计: ${totalComputeNoCache} 次<br><span style="color:#ff6b6b;">每步重算完整 N×N 矩阵</span>`;
    }

    const info = document.getElementById('kvcache-step-info');
    if (n === 0) {
      info.textContent = '点击 "生成下一个 Token" 观察 Attention 计算过程和 KV Cache 变化';
    } else {
      const saving = n > 1 ? ` | 节省 ${((1 - totalComputeCache / totalComputeNoCache) * 100).toFixed(0)}% 计算` : '';
      info.textContent = `Step ${n}: q_"${generated[n-1]}" 与 ${n} 个 cached K 做 dot product${saving}`;
    }
  }

  return {
    generate() {
      if (generated.length >= tokens.length) return;
      generated.push(tokens[generated.length]);
      const n = generated.length;
      totalComputeCache += n;
      totalComputeNoCache += n * n;
      render();
    },
    reset() {
      generated = [];
      totalComputeCache = 0;
      totalComputeNoCache = 0;
      render();
    }
  };
})();
kvCacheDemo.reset();

// ========== 自动把高度汇报给父页面 ==========
(function () {
  function reportHeight() { parent.postMessage({ type: 'tc-anim-height', height: document.documentElement.scrollHeight }, '*'); }
  window.addEventListener('load', reportHeight);
  if (window.ResizeObserver) { new ResizeObserver(reportHeight).observe(document.body); } else { setInterval(reportHeight, 500); }
})();
</script>
</body>
</html>
