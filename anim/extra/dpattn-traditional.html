<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traditional TP+EP</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: transparent;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  padding: 4px;
  line-height: 1.6;
}
.section { max-width: 1000px; margin: 0 auto; }
.section-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #333; }
.canvas-wrap { text-align: center; margin: 16px 0; }
canvas { border-radius: 10px; background: #0d0d20; max-width: 100%; }
.controls { text-align: center; margin: 16px 0; }
button { background: linear-gradient(135deg, #00d2ff, #667eea); border: none; color: #fff; padding: 10px 22px; border-radius: 6px; font-size: 0.9rem; cursor: pointer; margin: 0 6px; font-weight: bold; }
button:hover { opacity: 0.9; }
button:disabled { opacity: 0.4; cursor: not-allowed; }
button.secondary { background: #333; border: 1px solid #555; color: #ccc; }
.step-label { color: #888; font-size: 0.85rem; margin: 0 12px; }
</style>
</head>
<body>

<div class="section">
  <div class="section-title" style="color:#ff6b6b;">传统方案: TP (Attention) + EP (Experts)</div>
  <div class="canvas-wrap">
    <canvas id="traditionalCanvas" width="950" height="520"></canvas>
  </div>
  <div class="controls">
    <button class="secondary" id="tradPrev" onclick="tradAnim.prev()">&larr; 上一步</button>
    <button id="tradNext" onclick="tradAnim.next()">下一步 &rarr;</button>
    <button class="secondary" onclick="tradAnim.reset()">↺ 重置</button>
    <button id="tradAuto" onclick="tradAnim.auto()">▶ 自动播放</button>
    <span class="step-label" id="tradStep"></span>
    <span class="step-label" id="tradCounter"></span>
  </div>
</div>

<script>
const tradAnim = (() => {
  const canvas = document.getElementById('traditionalCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  // HiDPI crisp rendering: scale the backing store by devicePixelRatio while
  // keeping the logical W/H coordinate system (CSS caps display width).
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = W + 'px';
  canvas.style.height = 'auto';
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  const gpuColors = ['#ff6b6b', '#4caf50', '#667eea', '#fbbf24'];
  const N = 4;
  let progress = 0, animId = null, startTime = null;
  const duration = 8000;

  const gpuW = 200, gpuH = 420, gpuGap = 20;
  const startX = (W - N * gpuW - (N-1) * gpuGap) / 2;
  const startY = 60;

  function gpuX(i) { return startX + i * (gpuW + gpuGap); }

  function drawGPU(i, phase) {
    const x = gpuX(i), y = startY;

    ctx.fillStyle = '#12122a';
    ctx.beginPath(); ctx.roundRect(x, y, gpuW, gpuH, 8); ctx.fill();
    ctx.strokeStyle = gpuColors[i];
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.lineWidth = 1;

    ctx.fillStyle = gpuColors[i];
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`GPU ${i}`, x + gpuW/2, y - 10);

    const kvY = y + 15;
    const kvH = 100;
    ctx.fillStyle = '#ff6b6b15';
    ctx.fillRect(x + 10, kvY, gpuW - 20, kvH);
    ctx.strokeStyle = '#ff6b6b60';
    ctx.setLineDash([3, 3]);
    ctx.strokeRect(x + 10, kvY, gpuW - 20, kvH);
    ctx.setLineDash([]);

    ctx.fillStyle = '#ff6b6b';
    ctx.font = 'bold 10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('KV Cache (完整副本!)', x + gpuW/2, kvY + 14);

    const reqColors = ['#ff6b6b50', '#4caf5050', '#667eea50', '#fbbf2450'];
    for (let r = 0; r < N; r++) {
      ctx.fillStyle = reqColors[r];
      ctx.fillRect(x + 15 + r * 42, kvY + 24, 38, 30);
      ctx.fillStyle = gpuColors[r];
      ctx.font = '9px monospace';
      ctx.fillText(`R${r}`, x + 15 + r * 42 + 19, kvY + 43);
    }
    ctx.fillStyle = '#888';
    ctx.font = '9px monospace';
    ctx.fillText('(所有 request 的 KV)', x + gpuW/2, kvY + 70);
    ctx.fillStyle = '#ff6b6b';
    ctx.font = 'bold 9px monospace';
    ctx.fillText('⚠ 4× 冗余!', x + gpuW/2, kvY + 85);

    const attnY = kvY + kvH + 15;
    const attnH = 70;
    const attnActive = phase >= 0.15 && phase < 0.35;
    ctx.fillStyle = attnActive ? '#667eea30' : '#1a1a2e';
    ctx.fillRect(x + 10, attnY, gpuW - 20, attnH);
    ctx.strokeStyle = attnActive ? '#667eea' : '#333';
    ctx.strokeRect(x + 10, attnY, gpuW - 20, attnH);
    ctx.fillStyle = '#667eea';
    ctx.font = 'bold 10px monospace';
    ctx.fillText(`Attention (heads ${i*2}-${i*2+1})`, x + gpuW/2, attnY + 15);
    ctx.fillStyle = '#888';
    ctx.font = '9px monospace';
    ctx.fillText(`TP 切分: 只有 1/${N} heads`, x + gpuW/2, attnY + 32);
    ctx.fillText('处理所有 request', x + gpuW/2, attnY + 48);
    if (attnActive) {
      ctx.fillStyle = '#667eea';
      ctx.fillText('⚡ 计算中...', x + gpuW/2, attnY + 62);
    }

    const expY = attnY + attnH + 15;
    const expH = 80;
    const expActive = phase >= 0.55 && phase < 0.75;
    ctx.fillStyle = expActive ? '#fbbf2430' : '#1a1a2e';
    ctx.fillRect(x + 10, expY, gpuW - 20, expH);
    ctx.strokeStyle = expActive ? '#fbbf24' : '#333';
    ctx.strokeRect(x + 10, expY, gpuW - 20, expH);
    ctx.fillStyle = '#fbbf24';
    ctx.font = 'bold 10px monospace';
    ctx.fillText(`Experts ${i*2}-${i*2+1}`, x + gpuW/2, expY + 15);
    ctx.fillStyle = '#888';
    ctx.font = '9px monospace';
    ctx.fillText(`EP 切分: 只有 2/${N*2} experts`, x + gpuW/2, expY + 32);
    if (expActive) {
      ctx.fillStyle = '#fbbf24';
      ctx.fillText('⚡ Expert 计算中...', x + gpuW/2, expY + 50);
    }

    const commY = expY + expH + 20;
    if (phase >= 0.15 && phase < 0.35) {
      ctx.fillStyle = '#ff6b6b';
      ctx.font = 'bold 10px monospace';
      ctx.fillText('↔ AllReduce', x + gpuW/2, commY);
      ctx.fillStyle = '#888';
      ctx.font = '9px monospace';
      ctx.fillText('(合并 partial heads)', x + gpuW/2, commY + 14);
    }
    if ((phase >= 0.35 && phase < 0.55) || (phase >= 0.75 && phase < 0.95)) {
      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 10px monospace';
      ctx.fillText('↔ All-to-All', x + gpuW/2, commY);
      ctx.fillStyle = '#888';
      ctx.font = '9px monospace';
      const label = phase < 0.55 ? '(dispatch tokens)' : '(combine results)';
      ctx.fillText(label, x + gpuW/2, commY + 14);
    }
  }

  function drawCommArrows(phase) {
    if (phase < 0.15 || phase > 0.95) return;

    let color, label;
    if (phase < 0.35) { color = '#ff6b6b'; label = 'AllReduce (TP)'; }
    else if (phase < 0.55) { color = '#fbbf24'; label = 'All-to-All (dispatch)'; }
    else if (phase < 0.75) return;
    else { color = '#fbbf24'; label = 'All-to-All (combine)'; }

    const y = startY + 230;
    ctx.strokeStyle = color + '60';
    ctx.lineWidth = 2;
    for (let i = 0; i < N - 1; i++) {
      const x1 = gpuX(i) + gpuW;
      const x2 = gpuX(i + 1);
      ctx.beginPath();
      ctx.moveTo(x1, y); ctx.lineTo(x2, y);
      ctx.stroke();
      ctx.fillStyle = color + '60';
      ctx.beginPath(); ctx.moveTo(x2 - 2, y); ctx.lineTo(x2 - 8, y - 4); ctx.lineTo(x2 - 8, y + 4); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x1 + 2, y); ctx.lineTo(x1 + 8, y - 4); ctx.lineTo(x1 + 8, y + 4); ctx.fill();
    }
    ctx.lineWidth = 1;

    ctx.fillStyle = color;
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(label, W/2, y - 12);
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    const p = progress;

    ctx.fillStyle = '#ff6b6b';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    let title = '';
    if (p < 0.15) title = '初始: 每 GPU 持有所有 request 的 KV Cache (冗余!)';
    else if (p < 0.35) title = 'Attention (TP): 计算 partial heads → AllReduce 合并';
    else if (p < 0.55) title = 'All-to-All: dispatch tokens → Expert GPU';
    else if (p < 0.75) title = 'Expert 本地计算';
    else if (p < 0.95) title = 'All-to-All: combine results → 返回原 GPU';
    else title = '完成一层 (每层都有 AllReduce + 2× All-to-All)';
    ctx.fillText(title, W/2, 30);

    for (let i = 0; i < N; i++) drawGPU(i, p);
    drawCommArrows(p);

    document.getElementById('tradStep').textContent =
      p < 0.15 ? 'KV Cache 状态' :
      p < 0.35 ? 'Step 1: Attention + AllReduce' :
      p < 0.55 ? 'Step 2: All-to-All dispatch' :
      p < 0.75 ? 'Step 3: Expert compute' :
      p < 0.95 ? 'Step 4: All-to-All combine' : '完成';
  }

  // Discrete steps: one per phase. Each maps to a representative `progress`
  // value inside that phase so the existing render()/phase logic is reused.
  const STEP_PROGRESS = [
    0.05,  // 0: KV Cache 冗余状态
    0.25,  // 1: Attention (TP) + AllReduce
    0.45,  // 2: All-to-All dispatch
    0.65,  // 3: Expert 本地计算
    0.85,  // 4: All-to-All combine
    1.0    // 5: 完成
  ];
  const STEPS = STEP_PROGRESS.length; // 6
  let step = 0;

  function updateControls() {
    document.getElementById('tradPrev').disabled = (step === 0);
    document.getElementById('tradNext').disabled = (step === STEPS - 1);
    document.getElementById('tradAuto').disabled = (step === STEPS - 1);
    document.getElementById('tradCounter').textContent = `Step ${step} / ${STEPS - 1}`;
  }

  function showStep(s) {
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    step = Math.max(0, Math.min(s, STEPS - 1));
    progress = STEP_PROGRESS[step];
    render();
    updateControls();
  }

  function prev() { showStep(step - 1); }
  function next() { showStep(step + 1); }
  function reset() { showStep(0); }

  // Auto-play: advance through the discrete steps over `duration`, ending on
  // the last step.
  function animate(ts) {
    if (!startTime) startTime = ts;
    progress = Math.min((ts - startTime) / duration, 1);
    // Derive the current discrete step from progress for bounds-disabling.
    let s = STEPS - 1;
    for (let i = 0; i < STEPS; i++) {
      if (progress < STEP_PROGRESS[i]) { s = i; break; }
    }
    step = Math.max(0, s);
    render();
    updateControls();
    if (progress < 1) { animId = requestAnimationFrame(animate); }
    else { step = STEPS - 1; updateControls(); }
  }
  function auto() {
    startTime = null;
    if (animId) cancelAnimationFrame(animId);
    progress = 0;
    animId = requestAnimationFrame(animate);
  }

  showStep(0);
  return { prev, next, reset, auto };
})();

(function () {
  function reportHeight() { parent.postMessage({ type: 'tc-anim-height', height: document.documentElement.scrollHeight }, '*'); }
  window.addEventListener('load', reportHeight);
  if (window.ResizeObserver) { new ResizeObserver(reportHeight).observe(document.body); } else { setInterval(reportHeight, 500); }
})();
</script>
</body>
</html>
