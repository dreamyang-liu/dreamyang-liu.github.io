<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CUDA Graph 时间线对比</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: transparent;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  line-height: 1.6;
  padding: 4px;
}
#timeline-demo { background: #0f0f23; border-radius: 8px; padding: 20px; margin: 0; border: 1px solid #333; }
button { font-family: inherit; }
</style>
</head>
<body>

<div id="timeline-demo">
<div style="margin-bottom:15px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
<button onclick="runWithoutGraph()" style="padding:8px 16px; background:#ff4444; border:none; color:white; border-radius:6px; cursor:pointer; font-size:14px;">不使用 Graph 运行</button>
<button onclick="runWithGraph()" style="padding:8px 16px; background:#76b900; border:none; color:white; border-radius:6px; cursor:pointer; font-size:14px;">使用 Graph 运行</button>
<button onclick="resetTimeline()" style="padding:8px 16px; background:#555; border:none; color:white; border-radius:6px; cursor:pointer; font-size:14px;">重置</button>
</div>

<div style="margin-bottom:8px; color:#888; font-size:12px;">CPU 时间线</div>
<div id="cpu-timeline" style="height:40px; background:#1a1a2e; border-radius:6px; position:relative; overflow:hidden; margin-bottom:10px; border:1px solid #333;"></div>

<div style="margin-bottom:8px; color:#888; font-size:12px;">GPU 时间线</div>
<div id="gpu-timeline" style="height:40px; background:#1a1a2e; border-radius:6px; position:relative; overflow:hidden; border:1px solid #333;"></div>

<div id="timeline-stats" style="margin-top:15px; font-size:14px; color:#aaa;"></div>
</div>

<div style="background:#16213e; padding:15px; border-radius:8px; margin-top:15px;">
<strong style="color:#ffd700;">核心洞察：</strong> 不使用 CUDA Graph 时，CPU 大部分时间花在 driver 开销上（红色间隙）。GPU 空闲等待下一条 launch 指令。使用 CUDA Graph 后，一次 launch 就能触发整个 kernel 序列。
</div>

<script>
// 时间线动画
function runWithoutGraph() {
    const cpu = document.getElementById('cpu-timeline');
    const gpu = document.getElementById('gpu-timeline');
    const stats = document.getElementById('timeline-stats');
    cpu.innerHTML = '';
    gpu.innerHTML = '';

    const kernels = 8;
    const kernelWidth = 8; // percent
    const gapWidth = 4; // percent - CPU 开销

    for (let i = 0; i < kernels; i++) {
        const offset = i * (kernelWidth + gapWidth);
        // CPU launch 开销（红色）
        const cpuBlock = document.createElement('div');
        cpuBlock.style.cssText = `position:absolute; left:${offset}%; width:${gapWidth}%; height:100%; background:#ff4444; border-radius:3px; opacity:0; transition: opacity 0.3s;`;
        cpuBlock.style.transitionDelay = (i * 150) + 'ms';
        cpu.appendChild(cpuBlock);

        // GPU kernel（绿色）
        const gpuBlock = document.createElement('div');
        gpuBlock.style.cssText = `position:absolute; left:${offset + gapWidth}%; width:${kernelWidth}%; height:100%; background:#76b900; border-radius:3px; opacity:0; transition: opacity 0.3s;`;
        gpuBlock.style.transitionDelay = (i * 150 + 80) + 'ms';
        gpu.appendChild(gpuBlock);

        setTimeout(() => { cpuBlock.style.opacity = '1'; }, 50);
        setTimeout(() => { gpuBlock.style.opacity = '1'; }, 50);
    }

    stats.innerHTML = '<span style="color:#ff4444;">&#9632;</span> CPU 开销（driver 调用） &nbsp;&nbsp; <span style="color:#76b900;">&#9632;</span> GPU 计算 &nbsp;&nbsp; | 总耗时: ~9.6ms | GPU 空闲: ~33%';
}

function runWithGraph() {
    const cpu = document.getElementById('cpu-timeline');
    const gpu = document.getElementById('gpu-timeline');
    const stats = document.getElementById('timeline-stats');
    cpu.innerHTML = '';
    gpu.innerHTML = '';

    // 单次 CPU launch
    const cpuBlock = document.createElement('div');
    cpuBlock.style.cssText = 'position:absolute; left:0%; width:4%; height:100%; background:#2196f3; border-radius:3px; opacity:0; transition: opacity 0.3s;';
    cpu.appendChild(cpuBlock);

    // 连续 GPU 执行
    const gpuBlock = document.createElement('div');
    gpuBlock.style.cssText = 'position:absolute; left:4%; width:64%; height:100%; background:linear-gradient(90deg, #76b900, #00d4aa); border-radius:3px; opacity:0; transition: opacity 0.5s; transition-delay: 0.1s;';
    gpu.appendChild(gpuBlock);

    setTimeout(() => { cpuBlock.style.opacity = '1'; gpuBlock.style.opacity = '1'; }, 50);

    stats.innerHTML = '<span style="color:#2196f3;">&#9632;</span> 单次 graph launch &nbsp;&nbsp; <span style="color:#76b900;">&#9632;</span> 连续 GPU 计算 &nbsp;&nbsp; | 总耗时: ~6.4ms | GPU 空闲: ~0% | <span style="color:#ffd700;">加速比: 1.5x</span>';
}

function resetTimeline() {
    document.getElementById('cpu-timeline').innerHTML = '';
    document.getElementById('gpu-timeline').innerHTML = '';
    document.getElementById('timeline-stats').innerHTML = '<span style="color:#888;">点击上方按钮查看差异</span>';
}

// 初始化
resetTimeline();
</script>

<script>
(function () {
  function reportHeight() { parent.postMessage({ type: 'tc-anim-height', height: document.documentElement.scrollHeight }, '*'); }
  window.addEventListener('load', reportHeight);
  if (window.ResizeObserver) { new ResizeObserver(reportHeight).observe(document.body); } else { setInterval(reportHeight, 500); }
})();
</script>
</body>
</html>
