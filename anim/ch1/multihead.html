<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Head 拆分与并行计算</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: transparent; color: #e0e0e0; font-family: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; line-height: 1.6; padding: 4px; }
.animation-container { background: #0a0a1a; border-radius: 12px; padding: 20px; border: 1px solid #333; position: relative; overflow: hidden; }
.btn { background: linear-gradient(135deg, #76b900, #00d4aa); color: #000; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.9rem; transition: transform 0.2s, opacity 0.2s; }
.btn:hover { transform: scale(1.05); opacity: 0.9; }
.btn:active { transform: scale(0.95); }
.btn-secondary { background: #333; color: #e0e0e0; border: 1px solid #555; }
.btn-secondary:hover { background: #444; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.btn:disabled:hover { transform: none; opacity: 0.4; }
.controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; align-items: center; }
.step-info { color: #76b900; font-size: 0.9rem; margin: 10px 0; min-height: 24px; }
.step-counter { color: #888; font-size: 0.9rem; margin: 6px 0; }
.head-block { display: inline-block; padding: 10px 15px; margin: 5px; border-radius: 8px; font-size: 0.8rem; font-weight: bold; text-align: center; transition: all 0.5s ease; }
.tensor-full { background: linear-gradient(135deg, #76b900, #00d4aa); color: #000; min-width: 200px; }
.tensor-head { min-width: 60px; color: #000; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
@keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
@keyframes fadeScale { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
</style>
</head>
<body>

<div class="animation-container" id="multihead-animation">
  <div class="controls">
    <button class="btn btn-secondary" id="mh-prev" onclick="multiHeadDemo.prev()">&larr; 上一步</button>
    <button class="btn btn-secondary" id="mh-next" onclick="multiHeadDemo.next()">下一步 &rarr;</button>
    <button class="btn" id="mh-auto" onclick="multiHeadDemo.auto()">&#9654; 自动播放</button>
    <button class="btn btn-secondary" id="mh-reset" onclick="multiHeadDemo.reset()">&#8634; 重置</button>
  </div>
  <div class="step-info" id="multihead-step-info">展示 tensor 如何被拆分成多个 head 并行处理</div>
  <div class="step-counter" id="multihead-step-counter">Step 0 / 3</div>
  <div id="multihead-visual" style="text-align: center; padding: 20px;">
    <div id="mh-input" style="margin-bottom: 20px;"></div>
    <div id="mh-heads" style="margin-bottom: 20px; min-height: 80px;"></div>
    <div id="mh-output" style="margin-bottom: 10px;"></div>
  </div>
</div>

<script>
// ========== Multi-Head Split Animation（从 ch1 原文件抽取）==========
const multiHeadDemo = (() => {
  const N = 4;            // 4 个阶段: 输入 → 拆分 8 head → 并行 Attention → Concat+W_O
  let step = 0;
  let autoTimer = null;

  function render(phase) {
    const input = document.getElementById('mh-input');
    const heads = document.getElementById('mh-heads');
    const output = document.getElementById('mh-output');
    const info = document.getElementById('multihead-step-info');

    if (phase === 0) {
      info.textContent = '输入 tensor: shape (batch, seq_len, d_model=512)';
      input.innerHTML = `<div class="head-block tensor-full" style="animation: fadeScale 0.5s ease;">Input: (B, N, 512)</div>`;
      heads.innerHTML = '';
      output.innerHTML = '';
    } else if (phase === 1) {
      info.textContent = 'Step 1: 线性投影后拆分为 8 个 head，每个 head 维度 = 64';
      input.innerHTML = `<div class="head-block tensor-full">Input: (B, N, 512)</div>`;
      const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#54a0ff', '#5f27cd', '#01a3a4', '#f368e0'];
      let headHtml = '';
      for (let i = 0; i < 8; i++) {
        headHtml += `<div class="head-block tensor-head" style="background:${colors[i]}; animation: slideIn 0.3s ease ${i * 0.1}s both;">Head ${i}<br><span style="font-size:0.7rem;">(B,N,64)</span></div>`;
      }
      heads.innerHTML = headHtml;
      output.innerHTML = '';
    } else if (phase === 2) {
      info.textContent = 'Step 2: 每个 head 独立计算 Attention（可并行）';
      input.innerHTML = `<div class="head-block tensor-full">Input: (B, N, 512)</div>`;
      const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#54a0ff', '#5f27cd', '#01a3a4', '#f368e0'];
      let headHtml = '';
      for (let i = 0; i < 8; i++) {
        headHtml += `<div class="head-block tensor-head" style="background:${colors[i]}; border: 2px solid #fff; animation: pulse 0.5s ease infinite ${i * 0.1}s;">Attn ${i}<br><span style="font-size:0.7rem;">QK<sup>T</sup>V</span></div>`;
      }
      heads.innerHTML = headHtml;
      output.innerHTML = '';
    } else if (phase === 3) {
      info.textContent = 'Step 3: Concat 所有 head 输出，通过 W_O 投影回 d_model 维度';
      input.innerHTML = `<div class="head-block tensor-full">Input: (B, N, 512)</div>`;
      heads.innerHTML = `<div style="display:flex; align-items:center; justify-content:center; gap:5px; flex-wrap:wrap;">
        <span style="color:#888;">Concat →</span>
        <div class="head-block" style="background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3, #54a0ff, #5f27cd, #01a3a4, #f368e0); color:#000; min-width:200px; animation: fadeScale 0.5s ease;">(B, N, 512)</div>
        <span style="color:#888;">→ W<sup>O</sup></span>
      </div>`;
      output.innerHTML = `<div class="head-block tensor-full" style="animation: fadeScale 0.5s ease 0.3s both;">Output: (B, N, 512)</div>`;
    }
  }

  function update() {
    if (step < 0) step = 0;
    if (step > N - 1) step = N - 1;
    render(step);
    document.getElementById('multihead-step-counter').textContent = `Step ${step} / ${N - 1}`;
    const prevBtn = document.getElementById('mh-prev');
    const nextBtn = document.getElementById('mh-next');
    const autoBtn = document.getElementById('mh-auto');
    if (prevBtn) prevBtn.disabled = (step === 0);
    if (nextBtn) nextBtn.disabled = (step === N - 1);
    if (autoBtn) autoBtn.disabled = (step === N - 1);
  }

  function stopAuto() {
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  }

  return {
    next() { stopAuto(); if (step < N - 1) { step++; update(); } },
    prev() { stopAuto(); if (step > 0) { step--; update(); } },
    reset() { stopAuto(); step = 0; update(); },
    auto() {
      stopAuto();
      if (step >= N - 1) { step = 0; update(); }
      autoTimer = setInterval(() => {
        if (step >= N - 1) { stopAuto(); update(); return; }
        step++;
        update();
      }, 1500);
    }
  };
})();
multiHeadDemo.reset();

// ========== 自动把高度汇报给父页面 ==========
(function () {
  function reportHeight() { parent.postMessage({ type: 'tc-anim-height', height: document.documentElement.scrollHeight }, '*'); }
  window.addEventListener('load', reportHeight);
  if (window.ResizeObserver) { new ResizeObserver(reportHeight).observe(document.body); } else { setInterval(reportHeight, 500); }
})();
</script>
</body>
</html>
