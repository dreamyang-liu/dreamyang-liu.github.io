<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantization 精度对比</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: transparent;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  line-height: 1.6;
  padding: 4px;
}
.anim-container { background: #12122a; border: 1px solid #444; border-radius: 12px; padding: 20px; margin: 4px 0; position: relative; overflow: hidden; min-height: 200px; }
.anim-label { position: absolute; top: 10px; right: 15px; font-size: 0.75em; color: #666; text-transform: uppercase; letter-spacing: 1px; }
.quant-container { text-align: center; padding: 20px; }
.quant-slider { width: 80%; max-width: 400px; margin: 20px auto; -webkit-appearance: none; appearance: none; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #ff4444, #ff9800, #ffd700, #44ff44); outline: none; }
.quant-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: #fff; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
.quant-display { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 20px; }
.quant-card { background: #2a2a4a; border-radius: 8px; padding: 15px; text-align: center; border: 2px solid transparent; transition: all 0.3s; }
.quant-card.selected { border-color: #ff9800; box-shadow: 0 0 15px rgba(255, 152, 0, 0.3); }
.quant-card .precision { font-size: 1.4em; font-weight: bold; color: #ffd700; }
.quant-card .memory { font-size: 0.9em; color: #aaa; margin-top: 5px; }
.memory-bar { height: 20px; background: #333; border-radius: 10px; margin-top: 8px; overflow: hidden; }
.memory-bar .fill { height: 100%; border-radius: 10px; transition: width 0.5s; background: linear-gradient(90deg, #ff9800, #ffd700); }
</style>
</head>
<body>

<div class="anim-container" id="quant-anim">
<span class="anim-label">Precision Comparison</span>
<div class="quant-container">
<p style="margin-bottom:10px;">拖动滑块切换精度级别：</p>
<input type="range" min="0" max="3" value="1" class="quant-slider" id="quant-slider" oninput="updateQuantDisplay(this.value)">
<div class="quant-display" id="quant-display">
<div class="quant-card" id="qcard-0">
<div class="precision">FP32</div>
<div class="memory">32 bits/param</div>
<div class="memory-bar"><div class="fill" style="width:100%"></div></div>
<div class="memory" style="margin-top:5px;">70B → 280 GB</div>
</div>
<div class="quant-card selected" id="qcard-1">
<div class="precision">FP16/BF16</div>
<div class="memory">16 bits/param</div>
<div class="memory-bar"><div class="fill" style="width:50%"></div></div>
<div class="memory" style="margin-top:5px;">70B → 140 GB</div>
</div>
<div class="quant-card" id="qcard-2">
<div class="precision">FP8</div>
<div class="memory">8 bits/param</div>
<div class="memory-bar"><div class="fill" style="width:25%"></div></div>
<div class="memory" style="margin-top:5px;">70B → 70 GB</div>
</div>
<div class="quant-card" id="qcard-3">
<div class="precision">INT4</div>
<div class="memory">4 bits/param</div>
<div class="memory-bar"><div class="fill" style="width:12.5%"></div></div>
<div class="memory" style="margin-top:5px;">70B → 35 GB</div>
</div>
</div>
</div>
</div>

<script>
// ==================== Quantization Slider ====================
function updateQuantDisplay(value) {
    const idx = parseInt(value);
    document.querySelectorAll('.quant-card').forEach((card, i) => {
        card.classList.toggle('selected', i === idx);
    });
}
</script>

<script>
(function () {
  function reportHeight() { parent.postMessage({ type: 'tc-anim-height', height: document.documentElement.scrollHeight }, '*'); }
  window.addEventListener('load', reportHeight);
  if (window.ResizeObserver) { new ResizeObserver(reportHeight).observe(document.body); } else { setInterval(reportHeight, 500); }
})();
</script>
</body>
</html>
