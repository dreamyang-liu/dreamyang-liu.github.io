<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DP Attention</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: transparent;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  padding: 4px;
  line-height: 1.6;
}
.section { max-width: 1000px; margin: 0 auto; }
.section-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #333; }
.canvas-wrap { text-align: center; margin: 16px 0; }
canvas { border-radius: 10px; background: #0d0d20; max-width: 100%; }
.controls { text-align: center; margin: 16px 0; }
button { background: linear-gradient(135deg, #00d2ff, #667eea); border: none; color: #fff; padding: 10px 22px; border-radius: 6px; font-size: 0.9rem; cursor: pointer; margin: 0 6px; font-weight: bold; }
button:hover { opacity: 0.9; }
button.secondary { background: #333; border: 1px solid #555; color: #ccc; }
.step-label { color: #888; font-size: 0.85rem; margin: 0 12px; }
</style>
</head>
<body>

<div class="section">
  <div class="section-title" style="color:#4caf50;">DP Attention 方案: DP (Attention) + EP (Experts)</div>
  <div class="canvas-wrap">
    <canvas id="dpAttnCanvas" width="950" height="520"></canvas>
  </div>
  <div class="controls">
    <button class="secondary" onclick="dpAnim.reset()">↺ 重置</button>
    <button onclick="dpAnim.reset();dpAnim.play();">▶ 播放</button>
    <span class="step-label" id="dpStep"></span>
  </div>
</div>

<script>
const dpAnim = (() => {
  const canvas = document.getElementById('dpAttnCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const gpuColors = ['#ff6b6b', '#4caf50', '#667eea', '#fbbf24'];
  const N = 4;
  let progress = 0, animId = null, startTime = null;
  const duration = 8000;

  const gpuW = 200, gpuH = 420, gpuGap = 20;
  const startX = (W - N * gpuW - (N-1) * gpuGap) / 2;
  const startY = 60;

  function gpuX(i) { return startX + i * (gpuW + gpuGap); }

  function drawGPU(i, phase) {
    const x = gpuX(i), y = startY;

    ctx.fillStyle = '#12122a';
    ctx.beginPath(); ctx.roundRect(x, y, gpuW, gpuH, 8); ctx.fill();
    ctx.strokeStyle = gpuColors[i];
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.lineWidth = 1;

    ctx.fillStyle = gpuColors[i];
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`GPU ${i}`, x + gpuW/2, y - 10);

    const kvY = y + 15;
    const kvH = 80;
    ctx.fillStyle = '#4caf5015';
    ctx.fillRect(x + 10, kvY, gpuW - 20, kvH);
    ctx.strokeStyle = '#4caf5060';
    ctx.strokeRect(x + 10, kvY, gpuW - 20, kvH);

    ctx.fillStyle = '#4caf50';
    ctx.font = 'bold 10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('KV Cache (仅本地 request)', x + gpuW/2, kvY + 14);

    ctx.fillStyle = gpuColors[i] + '60';
    ctx.fillRect(x + 30, kvY + 24, gpuW - 60, 30);
    ctx.fillStyle = gpuColors[i];
    ctx.font = '10px monospace';
    ctx.fillText(`Request ${i} 的 KV`, x + gpuW/2, kvY + 43);
    ctx.fillStyle = '#4caf50';
    ctx.font = 'bold 9px monospace';
    ctx.fillText('✓ 零冗余!', x + gpuW/2, kvY + 68);

    const attnY = kvY + kvH + 15;
    const attnH = 80;
    const attnActive = phase >= 0.15 && phase < 0.40;
    ctx.fillStyle = attnActive ? '#4caf5030' : '#1a1a2e';
    ctx.fillRect(x + 10, attnY, gpuW - 20, attnH);
    ctx.strokeStyle = attnActive ? '#4caf50' : '#333';
    ctx.strokeRect(x + 10, attnY, gpuW - 20, attnH);
    ctx.fillStyle = '#4caf50';
    ctx.font = 'bold 10px monospace';
    ctx.fillText('Attention (完整, 所有 heads)', x + gpuW/2, attnY + 15);
    ctx.fillStyle = '#888';
    ctx.font = '9px monospace';
    ctx.fillText('参数复制 (很小, ~1%)', x + gpuW/2, attnY + 32);
    ctx.fillText(`只处理 Request ${i}`, x + gpuW/2, attnY + 48);
    if (attnActive) {
      ctx.fillStyle = '#4caf50';
      ctx.font = 'bold 10px monospace';
      ctx.fillText('⚡ 独立计算, 无通信!', x + gpuW/2, attnY + 66);
    }

    const expY = attnY + attnH + 15;
    const expH = 80;
    const expActive = phase >= 0.60 && phase < 0.80;
    ctx.fillStyle = expActive ? '#fbbf2430' : '#1a1a2e';
    ctx.fillRect(x + 10, expY, gpuW - 20, expH);
    ctx.strokeStyle = expActive ? '#fbbf24' : '#333';
    ctx.strokeRect(x + 10, expY, gpuW - 20, expH);
    ctx.fillStyle = '#fbbf24';
    ctx.font = 'bold 10px monospace';
    ctx.fillText(`Experts ${i*2}-${i*2+1}`, x + gpuW/2, expY + 15);
    ctx.fillStyle = '#888';
    ctx.font = '9px monospace';
    ctx.fillText(`EP 切分: 只有 2/${N*2} experts`, x + gpuW/2, expY + 32);
    if (expActive) {
      ctx.fillStyle = '#fbbf24';
      ctx.fillText('⚡ Expert 计算中...', x + gpuW/2, expY + 50);
    }

    const commY = expY + expH + 20;
    if (phase >= 0.15 && phase < 0.40) {
      ctx.fillStyle = '#4caf50';
      ctx.font = 'bold 10px monospace';
      ctx.fillText('🚫 无通信!', x + gpuW/2, commY);
      ctx.fillStyle = '#4caf50';
      ctx.font = '9px monospace';
      ctx.fillText('(DP: 各 GPU 独立)', x + gpuW/2, commY + 14);
    }
    if ((phase >= 0.40 && phase < 0.60) || (phase >= 0.80 && phase < 0.95)) {
      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 10px monospace';
      ctx.fillText('↔ All-to-All', x + gpuW/2, commY);
      ctx.fillStyle = '#888';
      ctx.font = '9px monospace';
      const label = phase < 0.60 ? '(dispatch tokens)' : '(combine results)';
      ctx.fillText(label, x + gpuW/2, commY + 14);
    }
  }

  function drawCommArrows(phase) {
    if (phase >= 0.15 && phase < 0.40) {
      for (let i = 0; i < N - 1; i++) {
        const x1 = gpuX(i) + gpuW + 2;
        const x2 = gpuX(i + 1) - 2;
        const midX = (x1 + x2) / 2;
        const y = startY + 180;
        ctx.strokeStyle = '#4caf5060';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y); ctx.stroke();
        ctx.setLineDash([]);
        ctx.lineWidth = 1;
        ctx.fillStyle = '#4caf50';
        ctx.font = 'bold 14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('✗', midX, y + 5);
      }
      ctx.fillStyle = '#4caf50';
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('零通信! (各 GPU 独立计算自己的 request)', W/2, startY + 160);
      return;
    }

    if ((phase >= 0.40 && phase < 0.60) || (phase >= 0.80 && phase < 0.95)) {
      const color = '#fbbf24';
      const label = phase < 0.60 ? 'All-to-All (dispatch tokens to experts)' : 'All-to-All (combine results back)';
      const y = startY + 290;
      ctx.strokeStyle = color + '60';
      ctx.lineWidth = 2;
      for (let i = 0; i < N - 1; i++) {
        const x1 = gpuX(i) + gpuW;
        const x2 = gpuX(i + 1);
        ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y); ctx.stroke();
        ctx.fillStyle = color + '60';
        ctx.beginPath(); ctx.moveTo(x2 - 2, y); ctx.lineTo(x2 - 8, y - 4); ctx.lineTo(x2 - 8, y + 4); ctx.fill();
        ctx.beginPath(); ctx.moveTo(x1 + 2, y); ctx.lineTo(x1 + 8, y - 4); ctx.lineTo(x1 + 8, y + 4); ctx.fill();
      }
      ctx.lineWidth = 1;
      ctx.fillStyle = color;
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(label, W/2, y - 12);
    }
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    const p = progress;

    ctx.fillStyle = '#4caf50';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    let title = '';
    if (p < 0.15) title = '初始: 每 GPU 只存自己 request 的 KV Cache (零冗余!)';
    else if (p < 0.40) title = 'Attention (DP): 每 GPU 独立计算自己的 request, 无需通信!';
    else if (p < 0.60) title = 'All-to-All: dispatch tokens → Expert GPU';
    else if (p < 0.80) title = 'Expert 本地计算';
    else if (p < 0.95) title = 'All-to-All: combine results → 返回原 GPU';
    else title = '完成一层 (只有 Expert 的 2× All-to-All, 无 AllReduce!)';
    ctx.fillText(title, W/2, 30);

    for (let i = 0; i < N; i++) drawGPU(i, p);
    drawCommArrows(p);

    document.getElementById('dpStep').textContent =
      p < 0.15 ? 'KV Cache 状态' :
      p < 0.40 ? 'Step 1: Attention (零通信!)' :
      p < 0.60 ? 'Step 2: All-to-All dispatch' :
      p < 0.80 ? 'Step 3: Expert compute' :
      p < 0.95 ? 'Step 4: All-to-All combine' : '完成';
  }

  function animate(ts) {
    if (!startTime) startTime = ts;
    progress = Math.min((ts - startTime) / duration, 1);
    render();
    if (progress < 1) animId = requestAnimationFrame(animate);
  }
  function play() { startTime = null; if (animId) cancelAnimationFrame(animId); animId = requestAnimationFrame(animate); }
  function reset() { if (animId) cancelAnimationFrame(animId); animId = null; progress = 0; render(); }

  progress = 0; render();
  return { play, reset };
})();

(function () {
  function reportHeight() { parent.postMessage({ type: 'tc-anim-height', height: document.documentElement.scrollHeight }, '*'); }
  window.addEventListener('load', reportHeight);
  if (window.ResizeObserver) { new ResizeObserver(reportHeight).observe(document.body); } else { setInterval(reportHeight, 500); }
})();
</script>
</body>
</html>
