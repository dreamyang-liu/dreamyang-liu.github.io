<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radix Cache 前缀共享树</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: transparent;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  line-height: 1.6;
  padding: 4px;
}
.anim-container { background: #12122a; border: 1px solid #444; border-radius: 12px; padding: 20px; margin: 4px 0; position: relative; overflow: hidden; min-height: 200px; }
.anim-label { position: absolute; top: 10px; right: 15px; font-size: 0.75em; color: #666; text-transform: uppercase; letter-spacing: 1px; }
.radix-container { min-height: 350px; position: relative; }
.radix-controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
.radix-controls button { background: linear-gradient(135deg, #ff9800, #e68900); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.85em; transition: all 0.2s; }
.radix-controls button:hover { transform: scale(1.05); box-shadow: 0 4px 12px rgba(255, 152, 0, 0.3); }
.radix-info { background: #1e1e3f; border-radius: 6px; padding: 10px; margin-top: 10px; font-size: 0.85em; color: #aaa; min-height: 40px; }
.svg-canvas { width: 100%; min-height: 300px; }
.svg-canvas line, .svg-canvas path { stroke: #ff9800; stroke-width: 2; fill: none; }
.svg-canvas text { fill: #e0e0e0; font-size: 12px; }
.svg-canvas rect { fill: #2a2a4a; stroke: #ff9800; stroke-width: 1.5; rx: 6; }
</style>
</head>
<body>

<div class="anim-container" id="radix-anim">
<span class="anim-label">Interactive Radix Tree</span>
<div class="radix-controls">
<button onclick="addRadixRequest('system_prompt + user: hello')">添加 "system + hello"</button>
<button onclick="addRadixRequest('system_prompt + user: world')">添加 "system + world"</button>
<button onclick="addRadixRequest('system_prompt + user: hello + how are you')">添加 "system + hello + how are you"</button>
<button onclick="addRadixRequest('different_prefix + query')">添加 "different + query"</button>
<button onclick="resetRadixTree()" class="secondary" style="background:linear-gradient(135deg,#555,#444);">重置</button>
</div>
<div class="radix-container" id="radix-tree">
<svg class="svg-canvas" id="radix-svg" width="100%" height="320"></svg>
</div>
<div class="radix-info" id="radix-info">点击上方按钮添加请求，观察前缀共享如何工作。</div>
</div>

<script>
// ==================== Radix Tree Visualization ====================
let radixState = { nodes: [], edges: [] };

function resetRadixTree() {
    radixState = { nodes: [{ id: 'root', label: 'ROOT', x: 350, y: 30, children: [] }], edges: [] };
    renderRadixTree();
    document.getElementById('radix-info').textContent = '树已重置。点击按钮添加请求。';
}

function addRadixRequest(requestStr) {
    const parts = requestStr.split(' + ');
    let currentParent = radixState.nodes[0];
    let matched = 0;
    let info = '';

    for (let i = 0; i < parts.length; i++) {
        const part = parts[i].trim();
        let found = false;

        // Check if this part already exists as a child
        for (const childId of currentParent.children) {
            const childNode = radixState.nodes.find(n => n.id === childId);
            if (childNode && childNode.label === part) {
                found = true;
                currentParent = childNode;
                childNode.highlight = true;
                matched++;
                break;
            }
        }

        if (!found) {
            // Create new node
            const newId = 'node_' + Date.now() + '_' + i;
            const parentNode = currentParent;
            const childCount = parentNode.children.length;
            const spreadX = 160;
            const newX = parentNode.x + (childCount - 0.5) * spreadX;
            const newY = parentNode.y + 80;

            const newNode = { id: newId, label: part, x: newX, y: newY, children: [], highlight: false };
            radixState.nodes.push(newNode);
            radixState.edges.push({ from: parentNode.id, to: newId });
            parentNode.children.push(newId);
            currentParent = newNode;
        }
    }

    info = `请求 "${requestStr}": 前缀匹配 ${matched}/${parts.length} 段`;
    if (matched > 0) {
        info += ` (复用 ${matched} 段已缓存的 KV Cache)`;
    }
    if (matched < parts.length) {
        info += `，新增 ${parts.length - matched} 个节点`;
    }
    document.getElementById('radix-info').textContent = info;
    reLayoutTree();
    renderRadixTree();

    // Clear highlights after a moment
    setTimeout(() => {
        radixState.nodes.forEach(n => n.highlight = false);
        renderRadixTree();
    }, 2000);
}

function reLayoutTree() {
    // Simple tree layout
    const root = radixState.nodes[0];
    const containerWidth = 700;
    layoutSubtree(root, 0, containerWidth, 30);
}

function layoutSubtree(node, left, right, y) {
    node.x = (left + right) / 2;
    node.y = y;
    const children = node.children.map(id => radixState.nodes.find(n => n.id === id)).filter(Boolean);
    if (children.length > 0) {
        const width = (right - left) / children.length;
        children.forEach((child, i) => {
            layoutSubtree(child, left + i * width, left + (i + 1) * width, y + 75);
        });
    }
}

function renderRadixTree() {
    const svg = document.getElementById('radix-svg');
    let html = '';

    // Draw edges
    for (const edge of radixState.edges) {
        const fromNode = radixState.nodes.find(n => n.id === edge.from);
        const toNode = radixState.nodes.find(n => n.id === edge.to);
        if (fromNode && toNode) {
            html += `<line x1="${fromNode.x}" y1="${fromNode.y + 20}" x2="${toNode.x}" y2="${toNode.y}" stroke="#ff9800" stroke-width="2" opacity="0.7"/>`;
        }
    }

    // Draw nodes
    for (const node of radixState.nodes) {
        const textLen = node.label.length * 7 + 20;
        const rx = textLen / 2;
        const highlightStroke = node.highlight ? '#ffd700' : '#ff9800';
        const highlightWidth = node.highlight ? '3' : '1.5';
        const glow = node.highlight ? `<rect x="${node.x - rx}" y="${node.y - 12}" width="${textLen}" height="28" rx="6" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.5"/>` : '';
        html += `${glow}<rect x="${node.x - rx}" y="${node.y - 12}" width="${textLen}" height="28" rx="6" fill="#2a2a4a" stroke="${highlightStroke}" stroke-width="${highlightWidth}"/>`;
        html += `<text x="${node.x}" y="${node.y + 5}" text-anchor="middle" fill="#e0e0e0" font-size="11">${node.label}</text>`;
    }

    svg.innerHTML = html;
}

resetRadixTree();
</script>

<script>
(function () {
  function reportHeight() { parent.postMessage({ type: 'tc-anim-height', height: document.documentElement.scrollHeight }, '*'); }
  window.addEventListener('load', reportHeight);
  if (window.ResizeObserver) { new ResizeObserver(reportHeight).observe(document.body); } else { setInterval(reportHeight, 500); }
})();
</script>
</body>
</html>
