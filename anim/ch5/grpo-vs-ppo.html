<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRPO vs PPO 对比</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: transparent;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  line-height: 1.6;
  padding: 4px;
}
.card { background: #1a1a2e; border-radius: 12px; border: 1px solid #333; padding: 24px; margin: 8px 0; }
h3 { font-size: 1.4em; color: #ff9800; margin: 0 0 15px; }
h4 { font-size: 1.1em; color: #ffcc80; margin: 0; text-align: center; }
.comparison { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
.compare-panel { background: #1a1a2e; border-radius: 12px; border: 1px solid #333; padding: 20px; }
@media (max-width: 768px) { .comparison { grid-template-columns: 1fr; } }
.btn { display: inline-block; padding: 8px 20px; background: linear-gradient(135deg, #ff4444, #ff9800); border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; font-size: 0.9em; margin: 5px; }
.btn:hover { opacity: 0.85; }
</style>
</head>
<body>

<div class="card">
<h3>交互式：GRPO vs PPO 对比</h3>
<button class="btn" id="btn-compare-play">▶ 开始对比动画</button>
<div class="comparison" id="grpo-ppo-compare">
<div class="compare-panel">
<h4 style="color:#ff4444;">PPO (with Critic)</h4>
<div id="ppo-panel" style="height:250px; position:relative; overflow:hidden;">
<div style="position:absolute; top:10px; left:50%; transform:translateX(-50%); font-size:0.8em; color:#aaa;">需要训练 Critic V(s)</div>
<canvas id="ppo-compare-canvas" width="400" height="220" style="width:100%; height:200px;"></canvas>
</div>
</div>
<div class="compare-panel">
<h4 style="color:#50fa7b;">GRPO (Group-based)</h4>
<div id="grpo-panel" style="height:250px; position:relative; overflow:hidden;">
<div style="position:absolute; top:10px; left:50%; transform:translateX(-50%); font-size:0.8em; color:#aaa;">Group 内相对比较</div>
<canvas id="grpo-compare-canvas" width="400" height="220" style="width:100%; height:200px;"></canvas>
</div>
</div>
</div>
</div>

<script>
// === GRPO vs PPO Comparison Animation ===
(function() {
    const playBtn = document.getElementById('btn-compare-play');
    const ppoCanvas = document.getElementById('ppo-compare-canvas');
    const grpoCanvas = document.getElementById('grpo-compare-canvas');
    let animRunning = false;

    function drawPPOComparison() {
        const ctx = ppoCanvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        const W = ppoCanvas.width = ppoCanvas.clientWidth * dpr;
        const H = ppoCanvas.height = ppoCanvas.clientHeight * dpr;
        ctx.scale(dpr, dpr);
        const w = W / dpr, h = H / dpr;
        ctx.clearRect(0, 0, w, h);

        // Draw critic network
        ctx.fillStyle = '#2a2a4e';
        ctx.fillRect(20, 30, 80, 40);
        ctx.strokeStyle = '#ff4444';
        ctx.strokeRect(20, 30, 80, 40);
        ctx.fillStyle = '#e0e0e0';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Critic V(s)', 60, 55);

        // Draw policy
        ctx.fillStyle = '#2a2a4e';
        ctx.fillRect(20, 90, 80, 40);
        ctx.strokeStyle = '#ff9800';
        ctx.strokeRect(20, 90, 80, 40);
        ctx.fillText('Policy π(a|s)', 60, 115);

        // Arrow from critic to advantage
        ctx.strokeStyle = '#888';
        ctx.beginPath();
        ctx.moveTo(100, 50);
        ctx.lineTo(130, 75);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(100, 110);
        ctx.lineTo(130, 85);
        ctx.stroke();

        // Advantage box
        ctx.fillStyle = '#1a3a1a';
        ctx.fillRect(130, 65, 60, 25);
        ctx.strokeStyle = '#50fa7b';
        ctx.strokeRect(130, 65, 60, 25);
        ctx.fillStyle = '#50fa7b';
        ctx.fillText('A = Q - V', 160, 82);
    }

    function drawGRPOComparison() {
        const ctx = grpoCanvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        const W = grpoCanvas.width = grpoCanvas.clientWidth * dpr;
        const H = grpoCanvas.height = grpoCanvas.clientHeight * dpr;
        ctx.scale(dpr, dpr);
        const w = W / dpr, h = H / dpr;
        ctx.clearRect(0, 0, w, h);

        // Draw group of responses
        const colors = ['#ff4444', '#ff9800', '#50fa7b', '#4488ff', '#a569bd'];
        const rewards = [0.3, 0.7, 0.9, 0.5, 0.2];
        const mean = rewards.reduce((a, b) => a + b, 0) / rewards.length;

        ctx.fillStyle = '#e0e0e0';
        ctx.font = '9px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('Group (G=5):', 10, 20);

        for (let i = 0; i < 5; i++) {
            const y = 30 + i * 22;
            const barW = rewards[i] * 100;
            ctx.fillStyle = colors[i];
            ctx.globalAlpha = 0.7;
            ctx.fillRect(10, y, barW, 14);
            ctx.globalAlpha = 1;
            ctx.fillStyle = '#e0e0e0';
            ctx.font = '9px sans-serif';
            ctx.fillText(`r=${rewards[i].toFixed(1)}`, barW + 15, y + 11);
        }

        // Mean line
        const meanX = 10 + mean * 100;
        ctx.strokeStyle = '#ffcc80';
        ctx.setLineDash([3, 3]);
        ctx.beginPath();
        ctx.moveTo(meanX, 28);
        ctx.lineTo(meanX, 140);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = '#ffcc80';
        ctx.font = '9px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`mean=${mean.toFixed(2)}`, meanX, 150);

        // Advantage label
        ctx.fillStyle = '#50fa7b';
        ctx.textAlign = 'left';
        ctx.fillText('A = (r - mean) / std', 10, 170);
        ctx.fillText('No critic needed!', 10, 185);
    }

    playBtn.addEventListener('click', () => {
        drawPPOComparison();
        drawGRPOComparison();
    });

    // Initial draw
    setTimeout(() => { drawPPOComparison(); drawGRPOComparison(); }, 200);
})();

// === 自动把高度汇报给父页面（让 iframe 自适应高度）===
(function () {
  function reportHeight() {
    var h = document.documentElement.scrollHeight;
    parent.postMessage({ type: 'tc-anim-height', height: h }, '*');
  }
  window.addEventListener('load', reportHeight);
  if (window.ResizeObserver) {
    new ResizeObserver(reportHeight).observe(document.body);
  } else {
    setInterval(reportHeight, 500);
  }
})();
</script>
</body>
</html>
