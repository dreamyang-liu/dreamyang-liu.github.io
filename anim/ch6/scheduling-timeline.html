<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zero-Overhead Scheduling Timeline</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: transparent;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  line-height: 1.6;
  padding: 4px;
}
.interactive-container { background: #1a1a2e; border-radius: 12px; border: 1px solid #444; padding: 24px; margin: 0; position: relative; overflow: hidden; }
.interactive-container::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #00d4aa, #0088ff); }
.interactive-title { font-size: 1.1rem; color: #00d4aa; margin-bottom: 15px; font-weight: 600; }
.timeline-canvas { width: 100%; height: 200px; border-radius: 8px; background: #0f0f23; border: 1px solid #333; }
.anim-btn {
  padding: 8px 16px;
  background: linear-gradient(135deg, #00d4aa, #0088ff);
  border: none;
  border-radius: 6px;
  color: #fff;
  cursor: pointer;
  font-size: 0.9em;
  font-weight: 600;
  transition: transform 0.2s, box-shadow 0.2s;
}
.anim-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0, 212, 170, 0.4); }
.anim-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
.anim-btn.secondary { background: #16213e; border: 1px solid #444; color: #ccc; }
.step-label { color: #ffcc00; font-size: 0.9rem; margin-top: 12px; min-height: 1.4em; text-align: center; }
.step-count { color: #888; font-size: 0.8rem; margin-top: 4px; text-align: center; }
</style>
</head>
<body>

<div class="interactive-container">
<div class="interactive-title">Interactive: Zero-Overhead Scheduling Timeline</div>
<p style="font-size:0.85rem; color:#888; margin-bottom:10px;">观察 CPU-S、CPU-L 与 GPU 的流水线重叠。点击 "下一步" 单步推进，或 "自动播放" 连续演示。</p>
<canvas id="timelineCanvas" class="timeline-canvas"></canvas>
<div style="display:flex; gap:10px; margin-top:12px; justify-content:center; flex-wrap:wrap;">
  <button class="anim-btn secondary" id="tlReset" onclick="timeline.reset()">↺ 重置</button>
  <button class="anim-btn" id="tlPrev" onclick="timeline.prev()">← 上一步</button>
  <button class="anim-btn" id="tlNext" onclick="timeline.next()">下一步 →</button>
  <button class="anim-btn" id="tlAuto" onclick="timeline.auto()">▶ 自动播放</button>
</div>
<div class="step-label" id="tlStepLabel"></div>
<div class="step-count" id="tlStepCount"></div>
<div style="display:flex; gap:20px; margin-top:10px; justify-content:center; font-size:0.8rem; flex-wrap:wrap;">
  <span><span style="color:#ff6b6b;">■</span> GPU Forward</span>
  <span><span style="color:#00d4aa;">■</span> CPU-S (Short)</span>
  <span><span style="color:#0088ff;">■</span> CPU-L (Long)</span>
  <span><span style="color:#666;">■</span> Idle Bubble</span>
</div>
</div>

<script>
// ==================== Timeline Step-Through ====================
const timeline = (() => {
  const canvas = document.getElementById('timelineCanvas');
  const ctx = canvas.getContext('2d');

  // HiDPI crisp rendering: scale the backing store by devicePixelRatio while
  // keeping the logical W/H coordinate system. The canvas is sized via CSS
  // (width:100%, height:200px) so we measure the rendered box, then upscale
  // the backing store. All drawing below uses the logical W/H.
  let W = 0, H = 0;
  function setupCanvas() {
    const dpr = window.devicePixelRatio || 1;
    W = canvas.offsetWidth;
    H = canvas.offsetHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);
  }

  const TOTAL_STEPS = 4; // steps 0..3

  const STEP_TEXT = [
    'Step 0 — 串行执行 (Without Overlap)：GPU Forward → CPU-S 采样 → CPU-L 调度，依次进行，存在 idle bubble。',
    'Step 1 — 流水线重叠 (Pipelined)：第二个 batch 的 Schedule 与第一个 batch 的 Forward 并行展开。',
    'Step 2 — 重叠区域：CPU-L 的调度时间被 GPU 的 Forward 计算所掩盖（overlap）。',
    'Step 3 — 收益总结：通过 compute / communication 重叠，每个 step 约快 ~27%。'
  ];

  // Each discrete step maps to a settled (still) frame. We branch the draw
  // by step rather than a single progress timeline, so each phase renders
  // its own fully-settled visual: `seqP` controls the sequential bars (0..1),
  // `pipP` controls the pipelined bars (0..1), `showOverlap` draws the arrow,
  // `showSavings` draws the time-savings annotation.
  function frameFor(step) {
    switch (step) {
      case 0: return { seqP: 1, pipP: 0, showOverlap: false, showSavings: false };
      case 1: return { seqP: 1, pipP: 1, showOverlap: false, showSavings: false };
      case 2: return { seqP: 1, pipP: 1, showOverlap: true,  showSavings: false };
      case 3: return { seqP: 1, pipP: 1, showOverlap: true,  showSavings: true  };
      default: return { seqP: 1, pipP: 1, showOverlap: true, showSavings: true };
    }
  }

  function drawTimeline(seqP, pipP, showOverlap, showSavings) {
    ctx.clearRect(0, 0, W, H);

    const rowHeight = 40;
    const topMargin = 25;
    const leftMargin = 70;
    const barWidth = (W - leftMargin - 30);

    // Labels
    ctx.fillStyle = '#888';
    ctx.font = '12px -apple-system, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('GPU', leftMargin - 10, topMargin + rowHeight * 0.5 + 4);
    ctx.fillText('CPU-S', leftMargin - 10, topMargin + rowHeight * 1.5 + 4);
    ctx.fillText('CPU-L', leftMargin - 10, topMargin + rowHeight * 2.5 + 4);

    // Section header
    ctx.textAlign = 'left';
    ctx.fillStyle = '#555';
    ctx.font = '10px -apple-system, sans-serif';
    ctx.fillText('Without Overlap', leftMargin, topMargin - 8);
    ctx.fillText('With Overlap (Pipelined)', leftMargin + barWidth * 0.5, topMargin - 8);

    // Draw bars for "without overlap" (sequential)
    const seqStart = leftMargin;
    const seqWidth = barWidth * 0.42;
    const unitW = seqWidth / 3.5;

    // Sequential: GPU → CPU-S → CPU-L → GPU → ...
    const seqBars = [
        { row: 0, start: 0, width: 2.0, color: '#ff6b6b', label: 'Forward' },
        { row: 1, start: 2.0, width: 0.3, color: '#00d4aa', label: 'Sample' },
        { row: 2, start: 2.3, width: 1.0, color: '#0088ff', label: 'Schedule' },
        { row: 0, start: 3.3, width: 0.15, color: '#444', label: '' },  // idle gap
    ];

    for (const bar of seqBars) {
        const x = seqStart + bar.start * unitW;
        const w = bar.width * unitW * seqP;
        const y = topMargin + bar.row * rowHeight + 8;
        ctx.fillStyle = bar.color;
        ctx.beginPath();
        ctx.roundRect(x, y, Math.max(w, 0), 24, 4);
        ctx.fill();
        if (bar.label && w > 30) {
            ctx.fillStyle = '#fff';
            ctx.font = '10px -apple-system, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(bar.label, x + w / 2, y + 15);
        }
    }

    // Draw bars for "with overlap" (pipelined)
    const pipStart = leftMargin + barWidth * 0.52;
    const pipWidth = barWidth * 0.45;
    const pUnitW = pipWidth / 4.5;

    const pipBars = [
        // Batch 1
        { row: 0, start: 0, width: 2.0, color: '#ff6b6b', label: 'Forward₁' },
        { row: 1, start: 2.0, width: 0.3, color: '#00d4aa', label: 'S₁' },
        { row: 2, start: 0.3, width: 1.0, color: '#0088ff', label: 'Schedule₂' },
        // Batch 2
        { row: 0, start: 2.3, width: 2.0, color: '#ff6b6b', label: 'Forward₂' },
        { row: 1, start: 4.3, width: 0.15, color: '#00d4aa', label: '' },
        { row: 2, start: 2.6, width: 1.0, color: '#0088ff', label: 'Schedule₃' },
    ];

    for (const bar of pipBars) {
        const x = pipStart + bar.start * pUnitW;
        const w = bar.width * pUnitW * pipP;
        const y = topMargin + bar.row * rowHeight + 8;
        ctx.fillStyle = bar.color;
        ctx.beginPath();
        ctx.roundRect(x, y, Math.max(w, 0), 24, 4);
        ctx.fill();
        if (bar.label && w > 25) {
            ctx.fillStyle = '#fff';
            ctx.font = '10px -apple-system, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(bar.label, x + w / 2, y + 15);
        }
    }

    // Overlap indication arrow
    if (showOverlap) {
        ctx.strokeStyle = '#ffcc00';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 3]);
        const overlapX1 = pipStart + 0.3 * pUnitW;
        const overlapX2 = pipStart + 1.3 * pUnitW;
        ctx.beginPath();
        ctx.moveTo(overlapX1, topMargin + 2 * rowHeight + 5);
        ctx.lineTo(overlapX2, topMargin + 2 * rowHeight + 5);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = '#ffcc00';
        ctx.font = '9px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('overlap', (overlapX1 + overlapX2) / 2, topMargin + 2 * rowHeight);
    }

    // Time savings annotation
    if (showSavings) {
        ctx.fillStyle = '#00d4aa';
        ctx.font = '11px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('~27% faster per step', pipStart + pipWidth * 0.5, H - 10);
    }
  }

  let step = 0;

  function render() {
    setupCanvas();
    const f = frameFor(step);
    drawTimeline(f.seqP, f.pipP, f.showOverlap, f.showSavings);

    document.getElementById('tlStepLabel').textContent = STEP_TEXT[step];
    document.getElementById('tlStepCount').textContent = 'Step ' + step + ' / ' + (TOTAL_STEPS - 1);
    document.getElementById('tlPrev').disabled = (step === 0);
    document.getElementById('tlNext').disabled = (step === TOTAL_STEPS - 1);
    document.getElementById('tlAuto').disabled = (step === TOTAL_STEPS - 1);
  }

  // ---- controls ----
  let autoTimer = null, autoOn = false;
  function stopAuto() {
    autoOn = false;
    if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
  }
  function goNext() {
    if (step >= TOTAL_STEPS - 1) { stopAuto(); return; }
    step++;
    render();
    if (autoOn && step < TOTAL_STEPS - 1) {
      autoTimer = setTimeout(goNext, 900);
    } else {
      stopAuto();
    }
  }
  function next() { stopAuto(); if (step < TOTAL_STEPS - 1) { step++; render(); } }
  function prev() { stopAuto(); if (step > 0) { step--; render(); } }
  function reset() { stopAuto(); step = 0; render(); }
  function auto() {
    if (autoOn) return;
    if (step >= TOTAL_STEPS - 1) { step = 0; render(); }
    autoOn = true;
    autoTimer = setTimeout(goNext, 600);
  }

  render();
  return { next, prev, reset, auto, redraw: render };
})();

window.addEventListener('DOMContentLoaded', () => { timeline.redraw(); });
window.addEventListener('resize', () => { timeline.redraw(); });
</script>

<script>
(function () {
  function reportHeight() { parent.postMessage({ type: 'tc-anim-height', height: document.documentElement.scrollHeight }, '*'); }
  window.addEventListener('load', reportHeight);
  if (window.ResizeObserver) { new ResizeObserver(reportHeight).observe(document.body); } else { setInterval(reportHeight, 500); }
})();
</script>
</body>
</html>
