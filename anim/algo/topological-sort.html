<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拓扑排序 动画</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: transparent; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; line-height: 1.6; padding: 4px; }
.animation-container { background: #0a0a1a; border-radius: 12px; padding: 20px; margin: 0.5rem 0; border: 1px solid #333; min-height: 380px; position: relative; }
.btn { background: linear-gradient(135deg, #76b900, #00d4aa); color: #000; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.9rem; transition: transform 0.2s, opacity 0.2s; }
.btn:hover { transform: scale(1.05); opacity: 0.9; }
.btn:active { transform: scale(0.95); }
.btn-secondary { background: #333; color: #e0e0e0; border: 1px solid #555; }
.btn-secondary:hover { background: #444; }
.controls { display: flex; gap: 10px; margin: 15px 0; flex-wrap: wrap; align-items: center; }
.step-info { color: #76b900; font-size: 0.9rem; margin: 10px 0; min-height: 24px; }
.order-display { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; min-height: 36px; }
.order-item { background: #76b900; color: #000; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.9rem; animation: popIn 0.3s ease; }
@keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
svg text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
@media (max-width: 600px) {
  .animation-container { padding: 12px; min-height: 320px; }
  .controls { gap: 6px; }
  .btn { padding: 8px 14px; font-size: 0.8rem; }
}
</style>
</head>
<body>

<div class="animation-container">
<div class="controls">
  <button class="btn" id="btn-step">下一步</button>
  <button class="btn btn-secondary" id="btn-auto">自动播放</button>
  <button class="btn btn-secondary" id="btn-reset">重置</button>
</div>
<div class="step-info" id="step-info">DAG: 0→2, 0→3, 1→3, 2→4, 3→4, 3→5。点击"下一步"开始</div>
<svg id="topo-svg" width="100%" height="220" viewBox="0 0 600 220"></svg>
<div style="margin-top:8px; color:#888; font-size:0.85rem;">入度: <span id="indeg-display"></span></div>
<div style="margin-top:4px; color:#888; font-size:0.85rem;">输出序列:</div>
<div class="order-display" id="order-display"></div>
</div>

<script>
(function() {
  // DAG: 6 nodes, edges as specified
  const N = 6;
  const edges = [[0,2],[0,3],[1,3],[2,4],[3,4],[3,5]];
  const nodePositions = [
    {x:80, y:60},   // 0
    {x:80, y:160},  // 1
    {x:250, y:40},  // 2
    {x:250, y:140}, // 3
    {x:430, y:60},  // 4
    {x:430, y:160}  // 5
  ];

  let g, indeg, queue, order, nodeState, animInterval;
  // nodeState: 0=white, 1=inQueue, 2=processing, 3=done

  function reset() {
    g = Array.from({length:N}, ()=>[]);
    indeg = new Array(N).fill(0);
    for (const [u,v] of edges) { g[u].push(v); indeg[v]++; }
    queue = [];
    for (let i = 0; i < N; i++) if (indeg[i] === 0) queue.push(i);
    order = [];
    nodeState = new Array(N).fill(0);
    for (const i of queue) nodeState[i] = 1;
    if (animInterval) { clearInterval(animInterval); animInterval = null; }
    document.getElementById('step-info').textContent = `初始入度为0的节点: [${queue.join(', ')}] 入队`;
    draw();
  }

  function step() {
    if (queue.length === 0) {
      const msg = order.length === N ? '完成！拓扑序: ' + order.join(' → ') + '（无环）' : '队列空但未输出所有节点 → 有环！';
      document.getElementById('step-info').textContent = msg;
      if (animInterval) { clearInterval(animInterval); animInterval = null; }
      return;
    }
    const u = queue.shift();
    nodeState[u] = 3;
    order.push(u);
    for (const v of g[u]) {
      indeg[v]--;
      if (indeg[v] === 0) {
        queue.push(v);
        nodeState[v] = 1;
      }
    }
    document.getElementById('step-info').textContent = `取出节点 ${u}，更新邻居入度。队列: [${queue.join(', ')}]`;
    draw();
  }

  function draw() {
    const svg = document.getElementById('topo-svg');
    let html = '<defs><marker id="arrowT" viewBox="0 0 10 10" refX="18" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker></defs>';

    // edges
    for (const [u,v] of edges) {
      const from = nodePositions[u], to = nodePositions[v];
      const done = nodeState[u] === 3;
      const color = done ? '#333' : '#555';
      html += `<line x1="${from.x}" y1="${from.y}" x2="${to.x}" y2="${to.y}" stroke="${color}" stroke-width="2" marker-end="url(#arrowT)"/>`;
    }

    // nodes
    const stateColors = ['#1a1a2e', '#d19a66', '#61afef', '#76b900'];
    const stateStrokes = ['#555', '#d19a66', '#61afef', '#76b900'];
    const textColors = ['#e0e0e0', '#000', '#000', '#000'];
    for (let i = 0; i < N; i++) {
      const {x,y} = nodePositions[i];
      const s = nodeState[i];
      html += `<circle cx="${x}" cy="${y}" r="20" fill="${stateColors[s]}" stroke="${stateStrokes[s]}" stroke-width="2.5"/>`;
      html += `<text x="${x}" y="${y+5}" text-anchor="middle" fill="${textColors[s]}" font-size="14" font-weight="bold">${i}</text>`;
    }

    // legend
    html += `<text x="540" y="200" text-anchor="end" fill="#555" font-size="11">白=未处理 橙=队列中 绿=完成</text>`;
    svg.innerHTML = html;

    // indeg display
    document.getElementById('indeg-display').textContent = `[${indeg.join(', ')}]`;

    // order display
    const orderDiv = document.getElementById('order-display');
    orderDiv.innerHTML = order.map(n => `<div class="order-item">${n}</div>`).join('');
  }

  document.getElementById('btn-step').onclick = step;
  document.getElementById('btn-reset').onclick = reset;
  document.getElementById('btn-auto').onclick = function() {
    if (animInterval) { clearInterval(animInterval); animInterval = null; return; }
    animInterval = setInterval(() => {
      if (queue.length === 0) { clearInterval(animInterval); animInterval = null; step(); return; }
      step();
    }, 1000);
  };

  reset();
})();
</script>

<script>
(function () {
  function reportHeight() { parent.postMessage({ type: 'tc-anim-height', height: document.documentElement.scrollHeight }, '*'); }
  window.addEventListener('load', reportHeight);
  if (window.ResizeObserver) { new ResizeObserver(reportHeight).observe(document.body); } else { setInterval(reportHeight, 500); }
})();
</script>
</body>
</html>
