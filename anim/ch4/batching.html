<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Continuous vs Static Batching</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: transparent;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  line-height: 1.6;
  padding: 4px;
}
.anim-container { background: #12122a; border: 1px solid #444; border-radius: 12px; padding: 20px; margin: 4px 0; position: relative; overflow: hidden; min-height: 200px; }
.anim-label { position: absolute; top: 10px; right: 15px; font-size: 0.75em; color: #666; text-transform: uppercase; letter-spacing: 1px; }
.batch-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 768px) { .batch-compare { grid-template-columns: 1fr; } }
.batch-panel { background: #1e1e3f; border-radius: 8px; padding: 15px; border: 1px solid #444; }
.batch-panel h4 { text-align: center; margin-bottom: 10px; font-size: 1.1em; }
.batch-slot { height: 24px; margin: 3px 0; border-radius: 4px; position: relative; overflow: hidden; background: #333; }
.batch-slot .fill { height: 100%; border-radius: 4px; transition: width 0.5s; }
.batch-slot .fill.active { background: linear-gradient(90deg, #ff9800, #ffd700); }
.batch-slot .fill.idle { background: #555; }
.batch-slot .fill.wasted { background: #ff4444; opacity: 0.5; }
.utilization-bar { margin-top: 10px; text-align: center; font-size: 0.85em; color: #aaa; }
.btn { background: linear-gradient(135deg, #ff9800, #e68900); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 0.9em; transition: all 0.2s; margin: 5px; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(255, 152, 0, 0.4); }
.btn:active { transform: translateY(0); }
.btn.secondary { background: linear-gradient(135deg, #555, #444); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
.step-indicator { color: #888; margin: 10px 0 0; font-size: 0.9em; }
.step-info { color: #ffd54f; font-size: 0.9em; min-height: 22px; margin: 10px 0 0; }
</style>
</head>
<body>

<div class="anim-container" id="batching-anim">
<span class="anim-label">Batching Comparison</span>
<div class="batch-compare">
<div class="batch-panel">
<h4 style="color:#ff4444;">Static Batching</h4>
<div id="static-slots"></div>
<div class="utilization-bar" id="static-util">利用率: <span>0%</span></div>
</div>
<div class="batch-panel">
<h4 style="color:#44ff44;">Continuous Batching</h4>
<div id="continuous-slots"></div>
<div class="utilization-bar" id="continuous-util">利用率: <span>0%</span></div>
</div>
</div>
<div class="step-info" id="batch-step-info"></div>
<div style="text-align:center; margin-top:15px;">
<button class="btn secondary" id="batch-prev" onclick="prev()">&larr; 上一步</button>
<button class="btn secondary" id="batch-next" onclick="next()">下一步 &rarr;</button>
<button class="btn" id="batch-auto" onclick="auto()">&#9654; 自动播放</button>
<button class="btn secondary" onclick="reset()">&#8634; 重置</button>
</div>
<div class="step-indicator" id="batch-step-counter">Step 0 / 0</div>
</div>

<script>
// ==================== Batching Animation (step-driven) ====================
const BATCH_SIZE = 6;

function createBatchSlots() {
    const staticContainer = document.getElementById('static-slots');
    const contContainer = document.getElementById('continuous-slots');
    staticContainer.innerHTML = '';
    contContainer.innerHTML = '';
    for (let i = 0; i < BATCH_SIZE; i++) {
        staticContainer.innerHTML += `<div class="batch-slot"><div class="fill idle" id="static-fill-${i}" style="width:0%"></div></div>`;
        contContainer.innerHTML += `<div class="batch-slot"><div class="fill idle" id="cont-fill-${i}" style="width:0%"></div></div>`;
    }
}
createBatchSlots();

// --- Precompute the deterministic simulation into per-tick frames ---
// Each frame = { static:[{w,cls}], cont:[{w,cls}], staticUtil, contUtil }
// This mirrors the original setInterval logic exactly, but with the
// queue-refill (originally a ~1-tick setTimeout) applied at the next tick.
function buildFrames() {
    const initialLengths = [80, 50, 95, 30, 70, 60]; // percent of max
    const initialQueue = [40, 90, 55, 75];           // additional requests

    const reqLen = initialLengths.slice();
    const staticProgress = [0, 0, 0, 0, 0, 0];
    const contProgress = [0, 0, 0, 0, 0, 0];
    const contFinished = [false, false, false, false, false, false];
    const queue = initialQueue.slice();
    // pendingRefill[i] = true means slot i finished last tick and a queued
    // request should be loaded at the start of this tick (the original
    // setTimeout(...,200) ~= one tick delay).
    const pendingRefill = [false, false, false, false, false, false];

    const frames = [];

    // Frame 0: settled initial state (everything idle, 0% util).
    frames.push({
        static: Array.from({ length: BATCH_SIZE }, () => ({ w: 0, cls: 'idle' })),
        cont:   Array.from({ length: BATCH_SIZE }, () => ({ w: 0, cls: 'idle' })),
        staticUtil: 0,
        contUtil: 0,
    });

    const MAX_TICKS = 60; // matches the original step cap
    for (let tick = 1; tick <= MAX_TICKS; tick++) {
        // Apply queued refills scheduled by the previous tick.
        for (let i = 0; i < BATCH_SIZE; i++) {
            if (pendingRefill[i]) {
                pendingRefill[i] = false;
                if (queue.length > 0) {
                    reqLen[i] = queue.shift();
                    contProgress[i] = 0;
                    contFinished[i] = false;
                }
            }
        }

        let staticActive = 0;
        let contActive = 0;
        const staticFrame = [];
        const contFrame = [];

        // Static batching: all slots advance together, wait for the longest.
        const allDoneStatic = staticProgress.every((p, i) => p >= initialLengths[i]);
        for (let i = 0; i < BATCH_SIZE; i++) {
            if (!allDoneStatic && staticProgress[i] < initialLengths[i]) {
                staticProgress[i] = Math.min(staticProgress[i] + 5, initialLengths[i]);
                staticFrame.push({ w: staticProgress[i], cls: 'active' });
                staticActive++;
            } else {
                // Finished (or whole batch done): slot is wasted capacity.
                staticFrame.push({ w: initialLengths[i], cls: 'wasted' });
            }
        }

        // Continuous batching: finished slots free up and pull from the queue.
        for (let i = 0; i < BATCH_SIZE; i++) {
            if (!contFinished[i]) {
                contProgress[i] = Math.min(contProgress[i] + 5, reqLen[i]);
                contFrame.push({ w: contProgress[i], cls: 'active' });
                contActive++;
                if (contProgress[i] >= reqLen[i]) {
                    contFinished[i] = true;
                    if (queue.length > 0) pendingRefill[i] = true;
                }
            } else {
                contFrame.push({ w: 0, cls: 'idle' });
            }
        }

        frames.push({
            static: staticFrame,
            cont: contFrame,
            staticUtil: Math.round(staticActive / BATCH_SIZE * 100),
            contUtil: Math.round(contActive / BATCH_SIZE * 100),
        });

        // Stop once both panels are fully settled (nothing active, queue drained).
        const staticSettled = staticProgress.every((p, i) => p >= initialLengths[i]);
        const contSettled = contFinished.every(Boolean) && queue.length === 0 &&
            !pendingRefill.some(Boolean);
        if (staticSettled && contSettled) break;
    }

    return frames;
}

const FRAMES = buildFrames();
const N = FRAMES.length - 1; // last step index

let currentStep = 0;
let autoTimer = null;

function renderTick(step) {
    const f = FRAMES[step];
    for (let i = 0; i < BATCH_SIZE; i++) {
        const sFill = document.getElementById(`static-fill-${i}`);
        sFill.className = 'fill ' + f.static[i].cls;
        sFill.style.width = f.static[i].w + '%';
        const cFill = document.getElementById(`cont-fill-${i}`);
        cFill.className = 'fill ' + f.cont[i].cls;
        cFill.style.width = f.cont[i].w + '%';
    }
    document.getElementById('static-util').querySelector('span').textContent = f.staticUtil + '%';
    document.getElementById('continuous-util').querySelector('span').textContent = f.contUtil + '%';

    document.getElementById('batch-step-info').textContent =
        `Tick ${step} — Static 利用率 ${f.staticUtil}% (整批等待最长请求)，Continuous 利用率 ${f.contUtil}% (空槽即时补入新请求)`;
    document.getElementById('batch-step-counter').textContent = `Step ${step} / ${N}`;
    document.getElementById('batch-prev').disabled = (step === 0);
    document.getElementById('batch-next').disabled = (step === N);
    document.getElementById('batch-auto').disabled = (step === N);
}

function stopAuto() {
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
    const btn = document.getElementById('batch-auto');
    btn.innerHTML = '&#9654; 自动播放';
}

function prev() {
    stopAuto();
    if (currentStep > 0) { currentStep--; renderTick(currentStep); }
}

function next() {
    stopAuto();
    if (currentStep < N) { currentStep++; renderTick(currentStep); }
}

function reset() {
    stopAuto();
    currentStep = 0;
    renderTick(currentStep);
}

function auto() {
    if (autoTimer) { stopAuto(); return; }
    if (currentStep >= N) return;
    document.getElementById('batch-auto').innerHTML = '&#10074;&#10074; 暂停';
    autoTimer = setInterval(() => {
        if (currentStep >= N) { stopAuto(); return; }
        currentStep++;
        renderTick(currentStep);
        if (currentStep >= N) stopAuto();
    }, 200);
}

reset();
</script>

<script>
(function () {
  function reportHeight() { parent.postMessage({ type: 'tc-anim-height', height: document.documentElement.scrollHeight }, '*'); }
  window.addEventListener('load', reportHeight);
  if (window.ResizeObserver) { new ResizeObserver(reportHeight).observe(document.body); } else { setInterval(reportHeight, 500); }
})();
</script>
</body>
</html>
