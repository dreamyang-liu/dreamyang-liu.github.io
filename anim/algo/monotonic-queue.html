<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单调队列动画</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: transparent;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  line-height: 1.7;
  padding: 4px;
}
h3 { color: #76b900; margin: 12px 0 4px; font-size: 0.9em; }
code { background: #1a1a2e; padding: 2px 6px; border-radius: 4px; font-family: 'Fira Code', monospace; font-size: 0.9em; }
.anim-container {
  background: #1a1a2e;
  border-radius: 12px;
  padding: 20px;
  margin: 20px 0;
}
.anim-controls {
  display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center;
}
.anim-controls button {
  background: #76b900;
  color: #0f0f23;
  border: none;
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
  font-size: 0.9em;
  transition: all 0.2s;
}
.anim-controls button:hover { background: #8ed000; }
.anim-controls button:disabled { background: #555; color: #999; cursor: not-allowed; }
.speed-label { color: #aaa; font-size: 0.85em; }
.array-vis {
  display: flex; gap: 4px; margin: 12px 0; flex-wrap: wrap; align-items: flex-end;
}
.arr-item {
  display: flex; flex-direction: column; align-items: center; transition: all 0.3s;
}
.arr-bar {
  width: 44px; min-height: 30px;
  background: #333;
  border-radius: 4px 4px 0 0;
  display: flex; align-items: flex-end; justify-content: center;
  padding-bottom: 4px;
  color: #e0e0e0;
  font-weight: bold;
  font-size: 0.85em;
  transition: all 0.3s;
}
.arr-bar.in-window { background: #444; border: 2px solid #76b900; }
.arr-bar.current { background: #76b900; color: #0f0f23; }
.arr-bar.in-queue { background: #00d4aa; color: #0f0f23; }
.arr-bar.expired { background: #ff6b6b; color: #fff; }
.arr-bar.cleaned { background: #ff9f43; color: #0f0f23; }
.arr-idx { font-size: 0.75em; color: #888; margin-top: 4px; }
.queue-vis {
  display: flex; align-items: center; gap: 4px; margin: 12px 0; min-height: 50px;
  border: 2px solid #555; border-radius: 8px; padding: 8px 12px;
  position: relative;
}
.queue-vis::before {
  content: '队头';
  position: absolute; top: -18px; left: 8px;
  font-size: 0.7em; color: #888;
}
.queue-vis::after {
  content: '队尾';
  position: absolute; top: -18px; right: 8px;
  font-size: 0.7em; color: #888;
}
.queue-item {
  min-width: 40px; background: #00d4aa; color: #0f0f23; text-align: center;
  padding: 6px 8px; border-radius: 4px; font-weight: bold; font-size: 0.85em;
  transition: all 0.3s;
}
.queue-item.head { border: 2px solid #76b900; }
.step-info {
  color: #aaa; font-size: 0.9em; margin: 8px 0; min-height: 24px;
}
.step-info .hl { color: #76b900; font-weight: bold; }
.step-info .hl2 { color: #00d4aa; font-weight: bold; }
.ans-row {
  margin: 12px 0; font-size: 0.9em;
}
.ans-row span { color: #76b900; font-weight: bold; }

@media (max-width: 600px) {
  .arr-bar { width: 36px; }
  .queue-item { min-width: 34px; }
  .anim-controls { gap: 6px; }
}
</style>
</head>
<body>

<p>数组 <code>[1, 3, -1, -3, 5, 3, 6, 7]</code>, k=3 的滑动窗口最大值：</p>

<div class="anim-container">
  <div class="anim-controls">
    <button id="btn-reset">重置</button>
    <button id="btn-step">下一步</button>
    <button id="btn-play">自动播放</button>
    <span class="speed-label">速度：</span>
    <input type="range" id="speed-slider" min="400" max="2500" value="1200" style="width:100px;">
  </div>
  <div class="step-info" id="step-info">点击"下一步"开始</div>
  <h3 style="margin:12px 0 4px; font-size:0.9em;">数组（高亮=当前窗口）：</h3>
  <div class="array-vis" id="array-vis"></div>
  <h3 style="margin:12px 0 4px; font-size:0.9em;">双端队列（存储下标对应的值）：</h3>
  <div class="queue-vis" id="queue-vis"></div>
  <div class="ans-row" id="ans-row">答案: <span>[]</span></div>
</div>

<script>
const nums = [1, 3, -1, -3, 5, 3, 6, 7];
const K = 3;
const n = nums.length;
const minVal = Math.min(...nums);
const maxVal = Math.max(...nums);

// Animation logic
let steps = [];
let currentStep = -1;
let playing = false;
let playTimer = null;

function generateSteps() {
  steps = [];
  let q = []; // deque of indices
  let ans = [];

  steps.push({ type: 'init', queue: [], ans: [], current: -1, windowStart: 0, expired: -1, cleaned: [], info: '初始状态：队列为空，开始遍历' });

  for (let i = 0; i < n; i++) {
    let x = nums[i];
    let ws = Math.max(0, i - K + 1);

    steps.push({ type: 'visit', queue: [...q], ans: [...ans], current: i, windowStart: ws, expired: -1, cleaned: [], info: `访问 nums[${i}] = <span class="hl">${x}</span>` });

    // Step 1: clean tail
    let cleaned = [];
    while (q.length && nums[q[q.length-1]] <= x) {
      cleaned.push(q.pop());
    }
    if (cleaned.length > 0) {
      steps.push({ type: 'clean-tail', queue: [...q], ans: [...ans], current: i, windowStart: ws, expired: -1, cleaned: cleaned, info: `① 队尾清理：${cleaned.map(c => nums[c]).join(',')} 被 <span class="hl">${x}</span> 打败，弹出` });
    }

    // Step 2: push
    q.push(i);
    steps.push({ type: 'push', queue: [...q], ans: [...ans], current: i, windowStart: ws, expired: -1, cleaned: [], info: `② 入队：${x}（下标${i}）加入队尾` });

    // Step 3: expire head
    let expired = -1;
    if (q[0] <= i - K) {
      expired = q.shift();
      steps.push({ type: 'expire', queue: [...q], ans: [...ans], current: i, windowStart: ws, expired: expired, cleaned: [], info: `③ 队头过期：nums[${expired}]=${nums[expired]} 已不在窗口内，弹出队头` });
    }

    // Step 4: collect answer
    if (i >= K - 1) {
      ans.push(nums[q[0]]);
      steps.push({ type: 'answer', queue: [...q], ans: [...ans], current: i, windowStart: ws, expired: -1, cleaned: [], info: `④ 取答案：窗口[${ws}..${i}]的最大值 = <span class="hl2">${nums[q[0]]}</span>（队头）` });
    }
  }
  steps.push({ type: 'done', queue: [...q], ans: [...ans], current: -1, windowStart: n-K, expired: -1, cleaned: [], info: '遍历结束！最终答案: [' + ans.join(', ') + ']' });
}
generateSteps();

function barHeight(val) {
  // Normalize to range 30-100px, handle negatives
  return ((val - minVal) / (maxVal - minVal)) * 70 + 30;
}

function renderState(step) {
  const arrayVis = document.getElementById('array-vis');
  const queueVis = document.getElementById('queue-vis');
  const stepInfo = document.getElementById('step-info');
  const ansRow = document.getElementById('ans-row');

  stepInfo.innerHTML = step.info;
  ansRow.innerHTML = '答案: <span>[' + step.ans.join(', ') + ']</span>';

  arrayVis.innerHTML = '';
  for (let i = 0; i < n; i++) {
    const item = document.createElement('div');
    item.className = 'arr-item';
    const bar = document.createElement('div');
    bar.className = 'arr-bar';
    bar.style.height = barHeight(nums[i]) + 'px';

    if (i === step.current) bar.classList.add('current');
    else if (i === step.expired) bar.classList.add('expired');
    else if (step.cleaned.includes(i)) bar.classList.add('cleaned');
    else if (step.queue.includes(i)) bar.classList.add('in-queue');
    else if (step.current >= 0 && i >= step.windowStart && i <= step.current) bar.classList.add('in-window');

    bar.textContent = nums[i];
    const idx = document.createElement('div');
    idx.className = 'arr-idx';
    idx.textContent = `i=${i}`;
    item.appendChild(bar);
    item.appendChild(idx);
    arrayVis.appendChild(item);
  }

  queueVis.innerHTML = '';
  if (step.queue.length === 0) {
    queueVis.innerHTML = '<span style="color:#666;font-size:0.85em;">（空）</span>';
  } else {
    step.queue.forEach((qi, idx) => {
      const el = document.createElement('div');
      el.className = 'queue-item';
      if (idx === 0) el.classList.add('head');
      el.textContent = `${nums[qi]}`;
      el.title = `下标 ${qi}`;
      queueVis.appendChild(el);
    });
  }
}

function doStep() {
  if (currentStep < steps.length - 1) {
    currentStep++;
    renderState(steps[currentStep]);
  } else {
    stopPlay();
  }
  updateButtons();
}

function reset() {
  stopPlay();
  currentStep = 0;
  renderState(steps[0]);
  updateButtons();
}

function stopPlay() { playing = false; clearInterval(playTimer); updateButtons(); }

function togglePlay() {
  if (playing) { stopPlay(); return; }
  playing = true;
  updateButtons();
  const speed = document.getElementById('speed-slider').value;
  playTimer = setInterval(() => {
    if (currentStep >= steps.length - 1) { stopPlay(); return; }
    doStep();
  }, speed);
}

function updateButtons() {
  document.getElementById('btn-step').disabled = currentStep >= steps.length - 1;
  document.getElementById('btn-play').textContent = playing ? '暂停' : '自动播放';
}

document.getElementById('btn-reset').onclick = reset;
document.getElementById('btn-step').onclick = doStep;
document.getElementById('btn-play').onclick = togglePlay;
document.getElementById('speed-slider').onchange = () => { if (playing) { stopPlay(); togglePlay(); } };

// Init
reset();
</script>

<script>
(function () {
  function reportHeight() { parent.postMessage({ type: 'tc-anim-height', height: document.documentElement.scrollHeight }, '*'); }
  window.addEventListener('load', reportHeight);
  if (window.ResizeObserver) { new ResizeObserver(reportHeight).observe(document.body); } else { setInterval(reportHeight, 500); }
})();
</script>
</body>
</html>
