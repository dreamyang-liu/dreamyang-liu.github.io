<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>链表反转演示</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: transparent;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  line-height: 1.6;
  padding: 4px;
}
.btn { background: linear-gradient(135deg, #76b900, #00d4aa); color: #000; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.9rem; transition: transform 0.2s, opacity 0.2s; }
.btn:hover { transform: scale(1.05); opacity: 0.9; }
.btn:active { transform: scale(0.95); }
.btn-secondary { background: #333; color: #e0e0e0; border: 1px solid #555; }
.btn-secondary:hover { background: #444; }
.controls { display: flex; gap: 10px; margin: 15px 0; flex-wrap: wrap; align-items: center; }
.animation-container { background: #0a0a1a; border-radius: 12px; padding: 20px; margin: 0; border: 1px solid #333; position: relative; overflow: hidden; }
.step-info { color: #76b900; font-size: 0.9rem; margin: 10px 0; min-height: 24px; }
svg text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
@media (max-width: 768px) {
  .btn { padding: 8px 14px; font-size: 0.82rem; }
}
</style>
</head>
<body>

<div class="animation-container" id="anim-container">
  <svg id="ll-svg" width="100%" height="200" viewBox="0 0 600 200"></svg>
  <div class="step-info" id="step-info">点击"下一步"观看 5 个节点链表的反转过程</div>
  <div class="controls">
    <button class="btn" id="btn-next">下一步</button>
    <button class="btn btn-secondary" id="btn-reset">重置</button>
  </div>
</div>

<script>
// --- Linked List Reversal Animation ---
const svg = document.getElementById('ll-svg');
const stepInfo = document.getElementById('step-info');
const values = [1, 2, 3, 4, 5];
const nodeSpacing = 110;
const startX = 50;
const nodeY = 80;
const ptrY = 160;

// Animation state
let animStep = 0;
// Steps: initial, then for each node: show pointers, store nxt, reverse link, advance
// We'll model: prev=None, cur=0 initially. Each iteration: store, turn, move.
const animSteps = [];

// Build steps
// State: which links are reversed, where prev/cur/nxt point
// prev index (-1 = None), cur index (-1 = None), nxt index (-1 = None)
// reversed[i] = true means node i points left instead of right
function buildSteps() {
  animSteps.length = 0;
  animSteps.push({prev:-1, cur:0, nxt:-1, reversed:[], msg:'初始状态：prev=None, cur=节点1'});
  let prev=-1, cur=0;
  for(let i=0; i<5; i++) {
    const nxt = (i<4) ? i+1 : -1;
    animSteps.push({prev, cur:i, nxt, reversed:animSteps[animSteps.length-1].reversed.slice(), msg:`存：nxt = cur.next = ${nxt>=0?'节点'+(nxt+1):'None'}`});
    const newReversed = animSteps[animSteps.length-1].reversed.slice();
    newReversed.push(i);
    animSteps.push({prev, cur:i, nxt, reversed:newReversed, msg:`转：cur.next = prev = ${prev>=0?'节点'+(prev+1):'None'}`});
    animSteps.push({prev:i, cur:nxt, nxt:-1, reversed:newReversed, msg:`移：prev=节点${i+1}, cur=${nxt>=0?'节点'+(nxt+1):'None'}`});
  }
  animSteps.push({prev:4, cur:-1, nxt:-1, reversed:[0,1,2,3,4], msg:'完成！prev 就是新的头节点（节点5）'});
}
buildSteps();

function renderState(state) {
  let html = '';
  // Draw nodes
  for(let i=0; i<5; i++) {
    const x = startX + i * nodeSpacing;
    const isReversed = state.reversed.includes(i);
    const fillColor = state.cur===i ? '#f0c800' : (isReversed ? '#76b900' : '#333');
    const strokeColor = state.prev===i ? '#00d4aa' : (state.nxt===i ? '#ff6b6b' : '#666');
    html += `<rect x="${x-20}" y="${nodeY-20}" width="40" height="40" rx="8" fill="${fillColor}" stroke="${strokeColor}" stroke-width="${(state.prev===i||state.cur===i||state.nxt===i)?3:1.5}"/>`;
    html += `<text x="${x}" y="${nodeY+6}" fill="${fillColor==='#333'?'#e0e0e0':'#000'}" font-size="16" text-anchor="middle" font-weight="bold">${values[i]}</text>`;
  }
  // Draw arrows
  for(let i=0; i<4; i++) {
    const x1 = startX + i * nodeSpacing + 20;
    const x2 = startX + (i+1) * nodeSpacing - 20;
    const midX = (x1+x2)/2;
    if(state.reversed.includes(i)) {
      // reversed arrow (points left)
      html += `<line x1="${x2}" y1="${nodeY}" x2="${x1}" y2="${nodeY}" stroke="#76b900" stroke-width="2" marker-end="url(#arrowGreen)"/>`;
    } else {
      // normal arrow (points right)
      html += `<line x1="${x1}" y1="${nodeY}" x2="${x2}" y2="${nodeY}" stroke="#666" stroke-width="2" marker-end="url(#arrowGray)"/>`;
    }
  }
  // Pointer labels
  const pointers = [];
  if(state.prev >= 0) pointers.push({idx:state.prev, label:'prev', color:'#00d4aa'});
  if(state.cur >= 0) pointers.push({idx:state.cur, label:'cur', color:'#f0c800'});
  if(state.nxt >= 0) pointers.push({idx:state.nxt, label:'nxt', color:'#ff6b6b'});
  pointers.forEach((p, pi) => {
    const x = startX + p.idx * nodeSpacing;
    const y = ptrY + pi * 18;
    html += `<text x="${x}" y="${y}" fill="${p.color}" font-size="13" text-anchor="middle" font-weight="bold">${p.label}</text>`;
  });
  // Defs for arrows
  const defs = `<defs>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#666"/></marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#76b900"/></marker>
  </defs>`;
  svg.innerHTML = defs + html;
  stepInfo.textContent = state.msg;
}

function resetAnim() {
  animStep = 0;
  renderState(animSteps[0]);
}
resetAnim();

document.getElementById('btn-next').addEventListener('click', () => {
  if(animStep < animSteps.length - 1) {
    animStep++;
    renderState(animSteps[animStep]);
  }
});
document.getElementById('btn-reset').addEventListener('click', resetAnim);

// 自动把高度汇报给父页面
(function () {
  function reportHeight() { parent.postMessage({ type: 'tc-anim-height', height: document.documentElement.scrollHeight }, '*'); }
  window.addEventListener('load', reportHeight);
  if (window.ResizeObserver) { new ResizeObserver(reportHeight).observe(document.body); } else { setInterval(reportHeight, 500); }
})();
</script>
</body>
</html>
