<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Continuous vs Static Batching</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: transparent;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  line-height: 1.6;
  padding: 4px;
}
.anim-container { background: #12122a; border: 1px solid #444; border-radius: 12px; padding: 20px; margin: 4px 0; position: relative; overflow: hidden; min-height: 200px; }
.anim-label { position: absolute; top: 10px; right: 15px; font-size: 0.75em; color: #666; text-transform: uppercase; letter-spacing: 1px; }
.batch-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 768px) { .batch-compare { grid-template-columns: 1fr; } }
.batch-panel { background: #1e1e3f; border-radius: 8px; padding: 15px; border: 1px solid #444; }
.batch-panel h4 { text-align: center; margin-bottom: 10px; font-size: 1.1em; }
.batch-slot { height: 24px; margin: 3px 0; border-radius: 4px; position: relative; overflow: hidden; background: #333; }
.batch-slot .fill { height: 100%; border-radius: 4px; transition: width 0.5s; }
.batch-slot .fill.active { background: linear-gradient(90deg, #ff9800, #ffd700); }
.batch-slot .fill.idle { background: #555; }
.batch-slot .fill.wasted { background: #ff4444; opacity: 0.5; }
.utilization-bar { margin-top: 10px; text-align: center; font-size: 0.85em; color: #aaa; }
.btn { background: linear-gradient(135deg, #ff9800, #e68900); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 0.9em; transition: all 0.2s; margin: 5px; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(255, 152, 0, 0.4); }
.btn:active { transform: translateY(0); }
.btn.secondary { background: linear-gradient(135deg, #555, #444); }
</style>
</head>
<body>

<div class="anim-container" id="batching-anim">
<span class="anim-label">Batching Comparison</span>
<div class="batch-compare">
<div class="batch-panel">
<h4 style="color:#ff4444;">Static Batching</h4>
<div id="static-slots"></div>
<div class="utilization-bar" id="static-util">利用率: <span>0%</span></div>
</div>
<div class="batch-panel">
<h4 style="color:#44ff44;">Continuous Batching</h4>
<div id="continuous-slots"></div>
<div class="utilization-bar" id="continuous-util">利用率: <span>0%</span></div>
</div>
</div>
<div style="text-align:center; margin-top:15px;">
<button class="btn" onclick="startBatchingAnim()">开始对比</button>
<button class="btn secondary" onclick="resetBatchingAnim()">重置</button>
</div>
</div>

<script>
// ==================== Batching Animation ====================
let batchingInterval = null;
const BATCH_SIZE = 6;

function createBatchSlots() {
    const staticContainer = document.getElementById('static-slots');
    const contContainer = document.getElementById('continuous-slots');
    staticContainer.innerHTML = '';
    contContainer.innerHTML = '';
    for (let i = 0; i < BATCH_SIZE; i++) {
        staticContainer.innerHTML += `<div class="batch-slot"><div class="fill idle" id="static-fill-${i}" style="width:0%"></div></div>`;
        contContainer.innerHTML += `<div class="batch-slot"><div class="fill idle" id="cont-fill-${i}" style="width:0%"></div></div>`;
    }
}
createBatchSlots();

function startBatchingAnim() {
    resetBatchingAnim();
    createBatchSlots();

    // Simulate different request lengths
    const requestLengths = [80, 50, 95, 30, 70, 60]; // percent of max
    let staticProgress = [0, 0, 0, 0, 0, 0];
    let contProgress = [0, 0, 0, 0, 0, 0];
    let contFinished = [false, false, false, false, false, false];
    let contQueue = [40, 90, 55, 75]; // additional requests
    let step = 0;

    batchingInterval = setInterval(() => {
        step++;
        let staticActive = 0;
        let contActive = 0;

        // Static batching: all slots advance together, wait for longest
        const allDoneStatic = staticProgress.every((p, i) => p >= requestLengths[i]);
        if (!allDoneStatic) {
            for (let i = 0; i < BATCH_SIZE; i++) {
                if (staticProgress[i] < requestLengths[i]) {
                    staticProgress[i] = Math.min(staticProgress[i] + 5, requestLengths[i]);
                    const fill = document.getElementById(`static-fill-${i}`);
                    fill.style.width = staticProgress[i] + '%';
                    fill.className = 'fill active';
                    staticActive++;
                } else {
                    const fill = document.getElementById(`static-fill-${i}`);
                    fill.className = 'fill wasted';
                    fill.style.width = requestLengths[i] + '%';
                }
            }
        }

        // Continuous batching: finished slots get new requests
        for (let i = 0; i < BATCH_SIZE; i++) {
            if (!contFinished[i]) {
                contProgress[i] = Math.min(contProgress[i] + 5, requestLengths[i]);
                const fill = document.getElementById(`cont-fill-${i}`);
                fill.style.width = contProgress[i] + '%';
                fill.className = 'fill active';
                contActive++;

                if (contProgress[i] >= requestLengths[i]) {
                    contFinished[i] = true;
                    // Immediately assign new request from queue
                    if (contQueue.length > 0) {
                        setTimeout(() => {
                            requestLengths[i] = contQueue.shift();
                            contProgress[i] = 0;
                            contFinished[i] = false;
                        }, 200);
                    }
                }
            } else {
                const fill = document.getElementById(`cont-fill-${i}`);
                fill.className = 'fill idle';
                fill.style.width = '0%';
            }
        }

        // Update utilization
        document.getElementById('static-util').querySelector('span').textContent =
            Math.round(staticActive / BATCH_SIZE * 100) + '%';
        document.getElementById('continuous-util').querySelector('span').textContent =
            Math.round(contActive / BATCH_SIZE * 100) + '%';

        if (step > 60) clearInterval(batchingInterval);
    }, 200);
}

function resetBatchingAnim() {
    if (batchingInterval) clearInterval(batchingInterval);
    batchingInterval = null;
    createBatchSlots();
    document.getElementById('static-util').querySelector('span').textContent = '0%';
    document.getElementById('continuous-util').querySelector('span').textContent = '0%';
}
</script>

<script>
(function () {
  function reportHeight() { parent.postMessage({ type: 'tc-anim-height', height: document.documentElement.scrollHeight }, '*'); }
  window.addEventListener('load', reportHeight);
  if (window.ResizeObserver) { new ResizeObserver(reportHeight).observe(document.body); } else { setInterval(reportHeight, 500); }
})();
</script>
</body>
</html>
