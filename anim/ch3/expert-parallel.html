<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expert Parallelism: Token Routing & All-to-All</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: transparent;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  line-height: 1.6;
  padding: 4px;
}
.diagram { background:#12121f; border:1px solid #333; border-radius:8px; padding:20px; margin:15px 0; }
</style>
</head>
<body>

<div class="diagram" style="margin-bottom:20px;">
  <div style="text-align:center;padding:10px;">
    <div style="margin-bottom:10px;color:#fbbf24;font-weight:bold;">Expert Parallelism: Token Routing &amp; All-to-All (4 GPUs, 8 Experts, top-1)</div>
    <canvas id="epCanvas" width="860" height="460" style="width:100%;max-width:860px;border-radius:8px;background:#0a0a1a;"></canvas>
    <div style="margin-top:10px;">
      <button onclick="epAnim.reset();epAnim.play();" style="background:linear-gradient(135deg,#fbbf24,#ff6b6b);border:none;color:#000;padding:8px 18px;border-radius:6px;cursor:pointer;font-size:0.85rem;font-weight:bold;">&#9654; 播放</button>
      <button onclick="epAnim.reset();" style="background:#333;border:1px solid #555;color:#ccc;padding:8px 18px;border-radius:6px;cursor:pointer;font-size:0.85rem;margin-left:8px;">&#8635; 重置</button>
    </div>
  </div>
</div>

<script>
const epAnim = (() => {
  const canvas = document.getElementById('epCanvas');
  if (!canvas) return { play(){}, reset(){} };
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  // HiDPI crisp rendering: scale the backing store by devicePixelRatio while
  // keeping the logical W/H coordinate system (CSS caps display width).
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = W + 'px';
  canvas.style.height = 'auto';
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  const N = 4; // GPUs
  const gpuColors = ['#ff6b6b', '#4caf50', '#667eea', '#fbbf24'];
  const expertColors = ['#ff6b6b', '#ff8e8e', '#4caf50', '#81c784', '#667eea', '#8e99f3', '#fbbf24', '#fdd835'];

  // 8 tokens, each routed to one expert (top-1 for simplicity)
  const tokens = [
    { id: 0, src: 0, expert: 5, label: 't0' }, // GPU0 → Expert5 (on GPU2)
    { id: 1, src: 0, expert: 7, label: 't1' }, // GPU0 → Expert7 (on GPU3)
    { id: 2, src: 1, expert: 0, label: 't2' }, // GPU1 → Expert0 (on GPU0)
    { id: 3, src: 1, expert: 2, label: 't3' }, // GPU1 → Expert2 (on GPU1, local!)
    { id: 4, src: 2, expert: 1, label: 't4' }, // GPU2 → Expert1 (on GPU0)
    { id: 5, src: 2, expert: 4, label: 't5' }, // GPU2 → Expert4 (on GPU2, local!)
    { id: 6, src: 3, expert: 3, label: 't6' }, // GPU3 → Expert3 (on GPU1)
    { id: 7, src: 3, expert: 6, label: 't7' }, // GPU3 → Expert6 (on GPU3, local!)
  ];
  // Expert i is on GPU floor(i/2)
  const expertGPU = (e) => Math.floor(e / 2);

  let progress = 0, animId = null, startTime = null;
  const duration = 8000;

  function ease(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }
  function lerp(a,b,t) { return a+(b-a)*t; }

  // Layout: 4 GPUs as columns, tokens as circles
  const colW = 180, colStart = 70;
  const gpuX = (g) => colStart + g * colW;
  const headerY = 60;
  const tokenStartY = 120;
  const expertY = 310;

  function drawGPUColumn(g, highlightTop, highlightBot) {
    const x = gpuX(g);
    // Top zone: token source
    ctx.fillStyle = highlightTop ? gpuColors[g] + '15' : '#0d0d1a';
    ctx.beginPath();
    ctx.roundRect(x, headerY, colW - 20, 160, 8);
    ctx.fill();
    ctx.strokeStyle = highlightTop ? gpuColors[g] + '80' : '#2a2a3a';
    ctx.stroke();

    // Bottom zone: experts
    ctx.fillStyle = highlightBot ? gpuColors[g] + '15' : '#0d0d1a';
    ctx.beginPath();
    ctx.roundRect(x, expertY, colW - 20, 100, 8);
    ctx.fill();
    ctx.strokeStyle = highlightBot ? gpuColors[g] + '80' : '#2a2a3a';
    ctx.stroke();

    // GPU header
    ctx.fillStyle = gpuColors[g];
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`GPU ${g}`, x + (colW-20)/2, headerY - 10);

    // Expert labels inside bottom zone
    ctx.font = '11px monospace';
    ctx.fillStyle = '#aaa';
    const e0 = g * 2, e1 = g * 2 + 1;
    ctx.fillText(`E${e0}  E${e1}`, x + (colW-20)/2, expertY + 20);
  }

  function tokenPos(tok, phase) {
    // Returns {x, y} for a token based on animation phase
    const srcCol = gpuX(tok.src);
    const dstCol = gpuX(expertGPU(tok.expert));
    const tokenIdx = tokens.filter(t => t.src === tok.src).indexOf(tok);
    const srcX = srcCol + 35 + tokenIdx * 55;
    const srcTY = tokenStartY + 40;

    const dstIdx = tokens.filter(t => expertGPU(t.expert) === expertGPU(tok.expert)).indexOf(tok);
    const dstX = dstCol + 25 + dstIdx * 45;
    const dstTY = expertY + 50;

    if (phase === 'src') return { x: srcX, y: srcTY };
    if (phase === 'dst') return { x: dstX, y: dstTY };
    return { x: srcX, y: srcTY };
  }

  function drawTokenCircle(x, y, tok, scale, showRoute) {
    const r = 16 * scale;
    // Glow for remote tokens
    if (showRoute && expertGPU(tok.expert) !== tok.src) {
      ctx.beginPath();
      ctx.arc(x, y, r + 4, 0, Math.PI * 2);
      ctx.fillStyle = gpuColors[expertGPU(tok.expert)] + '40';
      ctx.fill();
    }
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = gpuColors[tok.src];
    ctx.fill();
    ctx.strokeStyle = '#fff3';
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.round(10*scale)}px monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(tok.label, x, y - 2);
    // Show expert target
    if (showRoute) {
      ctx.font = `${Math.round(8*scale)}px monospace`;
      ctx.fillStyle = '#fff9';
      ctx.fillText(`→E${tok.expert}`, x, y + 10);
    }
  }

  function drawCurvedArrow(x1, y1, x2, y2, progress, color) {
    const cp1x = x1, cp1y = (y1 + y2) / 2;
    const cp2x = x2, cp2y = (y1 + y2) / 2;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.6;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, lerp(x1, x2, progress), lerp(y1, y2, progress));
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.lineWidth = 1;
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    const p = progress;

    // Phase title
    ctx.fillStyle = '#eee';
    ctx.font = 'bold 15px sans-serif';
    ctx.textAlign = 'center';
    let title = '';
    if (p < 0.12) title = '① 初始状态: 每 GPU 持有 2 个 token';
    else if (p < 0.25) title = '② Router: 决定每个 token 发往哪个 expert';
    else if (p < 0.50) title = '③ All-to-All Dispatch: token 发送到目标 expert 所在 GPU';
    else if (p < 0.70) title = '④ Expert 本地计算 (每 GPU 只算自己的 expert)';
    else if (p < 0.90) title = '⑤ All-to-All Combine: 结果返回原 GPU';
    else title = '⑥ 完成: weighted sum 输出';
    ctx.fillText(title, W/2, 30);

    // Draw GPU columns
    for (let g = 0; g < N; g++) {
      const topHL = p < 0.50 || p >= 0.90;
      const botHL = p >= 0.25 && p < 0.90;
      drawGPUColumn(g, topHL, botHL);
    }

    // Draw tokens based on phase
    tokens.forEach(tok => {
      const src = tokenPos(tok, 'src');
      const dst = tokenPos(tok, 'dst');

      if (p < 0.12) {
        drawTokenCircle(src.x, src.y, tok, 1, false);
      } else if (p < 0.25) {
        // Show routing info
        drawTokenCircle(src.x, src.y, tok, 1, true);
      } else if (p < 0.50) {
        // Flying to destination
        const t = ease((p - 0.25) / 0.25);
        const cx = lerp(src.x, dst.x, t);
        const cy = lerp(src.y, dst.y, t);
        drawTokenCircle(cx, cy, tok, 1, false);
        // Trail
        if (expertGPU(tok.expert) !== tok.src) {
          ctx.strokeStyle = gpuColors[tok.src] + '30';
          ctx.lineWidth = 2;
          ctx.setLineDash([3, 5]);
          ctx.beginPath();
          ctx.moveTo(src.x, src.y);
          ctx.lineTo(cx, cy);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.lineWidth = 1;
        }
      } else if (p < 0.70) {
        // Computing — gentle bounce
        const t = (p - 0.50) / 0.20;
        const bounce = 1 + 0.08 * Math.sin(t * Math.PI * 6);
        drawTokenCircle(dst.x, dst.y, tok, bounce, false);
      } else if (p < 0.90) {
        // Flying back
        const t = ease((p - 0.70) / 0.20);
        const cx = lerp(dst.x, src.x, t);
        const cy = lerp(dst.y, src.y, t);
        drawTokenCircle(cx, cy, tok, 1, false);
      } else {
        // Back home
        drawTokenCircle(src.x, src.y, tok, 1, false);
      }
    });

    // Communication label
    if (p >= 0.25 && p < 0.50) {
      ctx.fillStyle = '#ff6b6b';
      ctx.font = 'bold 12px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('All-to-All (dispatch)', W/2, (tokenStartY + expertY) / 2 + 30);
      // Show which tokens are remote
      ctx.font = '10px monospace';
      ctx.fillStyle = '#888';
      ctx.fillText('彩色光环 = 需要跨 GPU 通信', W/2, (tokenStartY + expertY) / 2 + 48);
    }
    if (p >= 0.70 && p < 0.90) {
      ctx.fillStyle = '#667eea';
      ctx.font = 'bold 12px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('All-to-All (combine)', W/2, (tokenStartY + expertY) / 2 + 30);
    }

    // Stats at bottom
    const statsY = H - 30;
    ctx.fillStyle = '#666';
    ctx.font = '11px monospace';
    ctx.textAlign = 'center';
    const localCount = tokens.filter(t => expertGPU(t.expert) === t.src).length;
    const remoteCount = tokens.length - localCount;
    ctx.fillText(`8 tokens | ${localCount} local (无通信) | ${remoteCount} remote (需 All-to-All) | 8 experts across 4 GPUs`, W/2, statsY);
  }

  function animate(ts) {
    if (!startTime) startTime = ts;
    progress = Math.min((ts - startTime) / duration, 1);
    render();
    if (progress < 1) animId = requestAnimationFrame(animate);
  }

  function play() { startTime = null; if (animId) cancelAnimationFrame(animId); animId = requestAnimationFrame(animate); }
  function reset() { if (animId) cancelAnimationFrame(animId); animId = null; progress = 0; render(); }

  progress = 0; render();
  return { play, reset };
})();
</script>

<script>
(function () {
  function reportHeight() { parent.postMessage({ type: 'tc-anim-height', height: document.documentElement.scrollHeight }, '*'); }
  window.addEventListener('load', reportHeight);
  if (window.ResizeObserver) { new ResizeObserver(reportHeight).observe(document.body); } else { setInterval(reportHeight, 500); }
})();
</script>
</body>
</html>
