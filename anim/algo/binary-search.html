<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二分查找动画</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: transparent;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  line-height: 1.7;
  padding: 4px;
}
h2 { color: #76b900; font-size: 1.3em; margin: 20px 0 12px; }
code {
  background: #1a1a3a;
  padding: 2px 6px;
  border-radius: 3px;
  font-family: 'Fira Code', 'Consolas', monospace;
  font-size: 0.9em;
  color: #00d4aa;
}
.anim-container {
  background: #0a0a1a;
  border: 1px solid #333;
  border-radius: 8px;
  padding: 20px;
  margin: 20px 0;
}
.array-display {
  display: flex;
  justify-content: center;
  gap: 4px;
  margin: 20px 0;
  flex-wrap: wrap;
}
.array-cell {
  width: 50px;
  height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid #444;
  border-radius: 6px;
  font-weight: bold;
  font-size: 1.1em;
  transition: all 0.3s ease;
  position: relative;
}
.array-cell.in-range { background: #1a2a1a; border-color: #76b900; }
.array-cell.mid-cell { background: #2a2a0a; border-color: #ffd700; color: #ffd700; }
.array-cell.found { background: #0a2a2a; border-color: #00d4aa; color: #00d4aa; }
.array-cell.out-range { opacity: 0.3; }
.pointer-row {
  display: flex;
  justify-content: center;
  gap: 4px;
  margin-top: 5px;
}
.pointer-cell {
  width: 50px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75em;
  font-weight: bold;
}
.ptr-left { color: #76b900; }
.ptr-right { color: #ff6b6b; }
.ptr-mid { color: #ffd700; }
.anim-controls {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-top: 15px;
}
.btn {
  background: #76b900;
  color: #0f0f23;
  border: none;
  padding: 8px 20px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
  font-size: 0.9em;
  transition: opacity 0.2s;
}
.btn:hover { opacity: 0.85; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-secondary { background: #00d4aa; }
.anim-log {
  margin-top: 12px;
  padding: 10px;
  background: #0f0f23;
  border-radius: 6px;
  font-size: 0.85em;
  min-height: 30px;
  color: #aaa;
}
.cliff-marker {
  position: absolute;
  top: -18px;
  font-size: 0.7em;
  color: #ff6b6b;
}
@media (max-width: 600px) {
  .array-cell { width: 38px; height: 38px; font-size: 0.9em; }
  .pointer-cell { width: 38px; font-size: 0.65em; }
}
</style>
</head>
<body>

<h2>动画演示：查找第一个 &gt;= 7</h2>
<p>数组 <code>[1, 3, 5, 7, 9, 11, 13, 15]</code>，使用模板查找第一个 &gt;= 7 的元素。</p>

<div class="anim-container" id="anim1">
  <div class="array-display" id="anim1-array"></div>
  <div class="pointer-row" id="anim1-ptrs"></div>
  <div class="anim-controls">
    <button class="btn" id="anim1-step">下一步</button>
    <button class="btn btn-secondary" id="anim1-reset">重置</button>
  </div>
  <div class="anim-log" id="anim1-log">点击"下一步"开始演示</div>
</div>

<h2>动画演示：旋转数组找最小值</h2>
<p>数组 <code>[4, 5, 6, 7, 0, 1, 2]</code>，存在一个"断崖"。比较 <code>nums[mid]</code> 和 <code>nums[right]</code> 来判断最小值在哪半边。</p>

<div class="anim-container" id="anim2">
  <div class="array-display" id="anim2-array"></div>
  <div class="pointer-row" id="anim2-ptrs"></div>
  <div class="anim-controls">
    <button class="btn" id="anim2-step">下一步</button>
    <button class="btn btn-secondary" id="anim2-reset">重置</button>
  </div>
  <div class="anim-log" id="anim2-log">点击"下一步"开始演示</div>
</div>

<script>
// === Animation 1: Binary search for first >= 7 ===
(function() {
  const nums = [1, 3, 5, 7, 9, 11, 13, 15];
  const target = 7;
  let left, right, mid, step, done;

  function reset() {
    left = 0; right = nums.length - 1; mid = -1; step = 0; done = false;
    render();
    document.getElementById('anim1-log').textContent = '点击"下一步"开始演示';
    document.getElementById('anim1-step').disabled = false;
  }

  function render() {
    const arrEl = document.getElementById('anim1-array');
    const ptrEl = document.getElementById('anim1-ptrs');
    arrEl.innerHTML = '';
    ptrEl.innerHTML = '';
    nums.forEach((nu, i) => {
      const cell = document.createElement('div');
      cell.className = 'array-cell';
      if (done && i === left) cell.classList.add('found');
      else if (i >= left && i <= right) cell.classList.add('in-range');
      else cell.classList.add('out-range');
      if (i === mid && !done) cell.classList.add('mid-cell');
      cell.textContent = nu;
      arrEl.appendChild(cell);

      const ptr = document.createElement('div');
      ptr.className = 'pointer-cell';
      let labels = [];
      if (i === left) labels.push('<span class="ptr-left">L</span>');
      if (i === right) labels.push('<span class="ptr-right">R</span>');
      if (i === mid && !done) labels.push('<span class="ptr-mid">M</span>');
      ptr.innerHTML = labels.join(' ');
      ptrEl.appendChild(ptr);
    });
  }

  function advance() {
    if (done) return;
    if (left >= right) {
      done = true;
      mid = -1;
      render();
      document.getElementById('anim1-log').textContent =
        `结束！left == right == ${left}，nums[${left}] = ${nums[left]} 就是第一个 >= ${target} 的元素。`;
      document.getElementById('anim1-step').disabled = true;
      return;
    }
    mid = Math.floor((left + right) / 2);
    const cond = nums[mid] >= target;
    let msg = `mid = ${mid}, nums[${mid}] = ${nums[mid]}`;
    if (cond) {
      msg += ` >= ${target} ✓ → right = mid = ${mid}`;
      right = mid;
    } else {
      msg += ` < ${target} ✗ → left = mid + 1 = ${mid + 1}`;
      left = mid + 1;
    }
    render();
    document.getElementById('anim1-log').textContent = msg;
    if (left >= right) {
      setTimeout(advance, 100);
    }
  }

  document.getElementById('anim1-step').addEventListener('click', advance);
  document.getElementById('anim1-reset').addEventListener('click', reset);
  reset();
})();

// === Animation 2: Rotated array find minimum ===
(function() {
  const nums = [4, 5, 6, 7, 0, 1, 2];
  let left, right, mid, done;

  function reset() {
    left = 0; right = nums.length - 1; mid = -1; done = false;
    render();
    document.getElementById('anim2-log').textContent = '点击"下一步"开始演示。注意 7→0 处的断崖！';
    document.getElementById('anim2-step').disabled = false;
  }

  function render() {
    const arrEl = document.getElementById('anim2-array');
    const ptrEl = document.getElementById('anim2-ptrs');
    arrEl.innerHTML = '';
    ptrEl.innerHTML = '';
    nums.forEach((nu, i) => {
      const cell = document.createElement('div');
      cell.className = 'array-cell';
      if (done && i === left) cell.classList.add('found');
      else if (i >= left && i <= right) cell.classList.add('in-range');
      else cell.classList.add('out-range');
      if (i === mid && !done) cell.classList.add('mid-cell');
      cell.textContent = nu;
      // cliff marker
      if (i === 3) {
        const cliff = document.createElement('span');
        cliff.className = 'cliff-marker';
        cliff.textContent = '断崖↓';
        cell.appendChild(cliff);
      }
      arrEl.appendChild(cell);

      const ptr = document.createElement('div');
      ptr.className = 'pointer-cell';
      let labels = [];
      if (i === left) labels.push('<span class="ptr-left">L</span>');
      if (i === right) labels.push('<span class="ptr-right">R</span>');
      if (i === mid && !done) labels.push('<span class="ptr-mid">M</span>');
      ptr.innerHTML = labels.join(' ');
      ptrEl.appendChild(ptr);
    });
  }

  function advance() {
    if (done) return;
    if (left >= right) {
      done = true;
      mid = -1;
      render();
      document.getElementById('anim2-log').textContent =
        `结束！left == right == ${left}，nums[${left}] = ${nums[left]} 就是最小值。`;
      document.getElementById('anim2-step').disabled = true;
      return;
    }
    mid = Math.floor((left + right) / 2);
    const cond = nums[mid] <= nums[right];
    let msg = `mid = ${mid}, nums[${mid}] = ${nums[mid]}, nums[right] = nums[${right}] = ${nums[right]}`;
    if (cond) {
      msg += ` → nums[mid] <= nums[right]，最小值在左半边（含 mid）→ right = ${mid}`;
      right = mid;
    } else {
      msg += ` → nums[mid] > nums[right]，断崖在右边 → left = ${mid + 1}`;
      left = mid + 1;
    }
    render();
    document.getElementById('anim2-log').textContent = msg;
    if (left >= right) {
      setTimeout(advance, 100);
    }
  }

  document.getElementById('anim2-step').addEventListener('click', advance);
  document.getElementById('anim2-reset').addEventListener('click', reset);
  reset();
})();
</script>

<script>
(function () {
  function reportHeight() { parent.postMessage({ type: 'tc-anim-height', height: document.documentElement.scrollHeight }, '*'); }
  window.addEventListener('load', reportHeight);
  if (window.ResizeObserver) { new ResizeObserver(reportHeight).observe(document.body); } else { setInterval(reportHeight, 500); }
})();
</script>
</body>
</html>
