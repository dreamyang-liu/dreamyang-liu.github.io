<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FP8 E4M3 Precision Visualization</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: transparent;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  line-height: 1.6;
  padding: 4px;
}
.interactive-container { background: #1a1a2e; border-radius: 12px; border: 1px solid #444; padding: 24px; margin: 0; position: relative; overflow: hidden; }
.interactive-container::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #00d4aa, #0088ff); }
.interactive-title { font-size: 1.1rem; color: #00d4aa; margin-bottom: 15px; font-weight: 600; }
.fp8-display { display: flex; gap: 4px; justify-content: center; margin: 15px 0; flex-wrap: wrap; }
.fp8-bit { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 4px; font-weight: bold; font-size: 0.9rem; transition: all 0.3s; }
.fp8-sign { background: #ff4444; color: #fff; }
.fp8-exp { background: #0088ff; color: #fff; }
.fp8-mantissa { background: #00d4aa; color: #000; }
.fp8-controls { display: flex; gap: 10px; align-items: center; justify-content: center; margin: 15px 0; flex-wrap: wrap; }
.fp8-controls input { background: #16213e; border: 1px solid #444; border-radius: 6px; padding: 6px 12px; color: #e0e0e0; width: 120px; }
.fp8-controls button { background: linear-gradient(135deg, #00d4aa, #0088ff); border: none; border-radius: 6px; padding: 8px 16px; color: #fff; cursor: pointer; font-weight: 600; }
.fp8-controls button:hover { opacity: 0.9; }
.fp8-result { text-align: center; margin-top: 10px; font-size: 0.9rem; color: #aaa; }
</style>
</head>
<body>

<div class="interactive-container">
<div class="interactive-title">Interactive: FP8 E4M3 Precision Visualization</div>
<p style="font-size:0.85rem; color:#888; margin-bottom:10px;">输入一个浮点数，查看它如何被编码为 FP8 E4M3 格式</p>
<div class="fp8-controls">
  <input type="number" id="fp8Input" value="3.14" step="0.01" placeholder="输入浮点数">
  <button onclick="convertToFP8()">Convert to FP8</button>
</div>
<div class="fp8-display" id="fp8Bits">
  <div class="fp8-bit fp8-sign">0</div>
  <div class="fp8-bit fp8-exp">1</div>
  <div class="fp8-bit fp8-exp">0</div>
  <div class="fp8-bit fp8-exp">0</div>
  <div class="fp8-bit fp8-exp">0</div>
  <div class="fp8-bit fp8-mantissa">1</div>
  <div class="fp8-bit fp8-mantissa">0</div>
  <div class="fp8-bit fp8-mantissa">0</div>
</div>
<div style="display:flex; gap:20px; justify-content:center; font-size:0.75rem; color:#888; margin-top:5px;">
  <span><span style="color:#ff4444;">■</span> Sign (1 bit)</span>
  <span><span style="color:#0088ff;">■</span> Exponent (4 bits)</span>
  <span><span style="color:#00d4aa;">■</span> Mantissa (3 bits)</span>
</div>
<div class="fp8-result" id="fp8Result">
  原始值: 3.14 → FP8 表示: 3.0 | 量化误差: 0.14 (4.46%)
</div>
<div style="margin-top:15px; padding:12px; background:#0f0f23; border-radius:8px; border:1px solid #333;">
  <p style="font-size:0.85rem; color:#aaa;"><strong>Dynamic Scaling 示例：</strong></p>
  <div style="display:flex; gap:10px; margin-top:8px; align-items:center; flex-wrap:wrap; justify-content:center;">
    <span style="font-size:0.8rem; color:#888;">Tensor max:</span>
    <input type="number" id="tensorMax" value="120.5" step="0.1" style="background:#16213e; border:1px solid #444; border-radius:4px; padding:4px 8px; color:#e0e0e0; width:80px;">
    <span style="font-size:0.8rem; color:#888;">→ Scale factor:</span>
    <span id="scaleFactor" style="color:#00d4aa; font-weight:600;">0.2688</span>
    <span style="font-size:0.8rem; color:#888;">(max_fp8=448)</span>
  </div>
</div>
</div>

<script>
// ==================== FP8 Visualization ====================
function convertToFP8() {
    const value = parseFloat(document.getElementById('fp8Input').value);
    if (isNaN(value)) return;

    // FP8 E4M3 encoding simulation
    const sign = value < 0 ? 1 : 0;
    const absVal = Math.abs(value);

    let fp8Val, bits;
    if (absVal === 0) {
        fp8Val = 0;
        bits = [0, 0, 0, 0, 0, 0, 0, 0];
    } else if (absVal > 448) {
        fp8Val = 448;
        bits = [sign, 1, 1, 1, 1, 1, 1, 0]; // max normal
    } else {
        // Find closest FP8 E4M3 value
        const exp = Math.floor(Math.log2(absVal));
        const biasedExp = Math.min(Math.max(exp + 7, 1), 15); // bias = 7
        const actualExp = biasedExp - 7;
        const mantissa = absVal / Math.pow(2, actualExp) - 1;
        const mantissaBits = Math.round(mantissa * 8); // 3 bits
        const clampedMantissa = Math.min(mantissaBits, 7);

        fp8Val = (1 + clampedMantissa / 8) * Math.pow(2, actualExp);

        bits = [sign,
            (biasedExp >> 3) & 1, (biasedExp >> 2) & 1,
            (biasedExp >> 1) & 1, biasedExp & 1,
            (clampedMantissa >> 2) & 1, (clampedMantissa >> 1) & 1,
            clampedMantissa & 1
        ];
    }

    if (sign) fp8Val = -fp8Val;

    // Update display
    const container = document.getElementById('fp8Bits');
    const bitElements = container.children;
    for (let i = 0; i < 8; i++) {
        bitElements[i].textContent = bits[i];
        bitElements[i].style.transform = 'scale(1.1)';
        setTimeout((idx) => { bitElements[idx].style.transform = 'scale(1)'; }, 300, i);
    }

    const error = Math.abs(value - fp8Val);
    const relError = value !== 0 ? (error / Math.abs(value) * 100).toFixed(2) : '0.00';
    document.getElementById('fp8Result').innerHTML =
        `原始值: ${value} → FP8 表示: ${fp8Val.toFixed(4)} | 量化误差: ${error.toFixed(6)} (${relError}%)`;

    // Update scale factor
    updateScaleFactor();
}

function updateScaleFactor() {
    const tensorMax = parseFloat(document.getElementById('tensorMax').value) || 1;
    const scale = (tensorMax / 448).toFixed(6);
    document.getElementById('scaleFactor').textContent = scale;
}
document.getElementById('tensorMax').addEventListener('input', updateScaleFactor);

window.addEventListener('DOMContentLoaded', () => {
    convertToFP8();
});
</script>

<script>
(function () {
  function reportHeight() { parent.postMessage({ type: 'tc-anim-height', height: document.documentElement.scrollHeight }, '*'); }
  window.addEventListener('load', reportHeight);
  if (window.ResizeObserver) { new ResizeObserver(reportHeight).observe(document.body); } else { setInterval(reportHeight, 500); }
})();
</script>
</body>
</html>
