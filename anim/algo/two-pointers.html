<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双指针动画</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: transparent;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  line-height: 1.7;
  padding: 4px;
}
code {
  background: #1a1a2e;
  padding: 2px 6px;
  border-radius: 3px;
  font-family: 'Fira Code', 'Consolas', monospace;
  font-size: 0.9em;
}
.animation-container {
  background: #0a0a1a;
  border-radius: 10px;
  padding: 20px;
  margin: 20px 0;
  border: 1px solid #76b900;
}
.animation-container h3 { margin-top: 0; color: #00d4aa; font-size: 1.2em; margin-bottom: 8px; }
.array-display {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin: 20px 0;
  flex-wrap: wrap;
}
.array-cell {
  width: 50px;
  height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid #444;
  border-radius: 6px;
  font-size: 1.1em;
  font-weight: bold;
  position: relative;
  transition: all 0.3s;
}
.array-cell.left-ptr { border-color: #76b900; background: rgba(118,185,0,0.15); }
.array-cell.right-ptr { border-color: #ff6b6b; background: rgba(255,107,107,0.15); }
.array-cell.both-ptr { border-color: #ffd700; background: rgba(255,215,0,0.15); }
.ptr-label {
  position: absolute;
  bottom: -22px;
  font-size: 0.7em;
  font-weight: bold;
}
.ptr-label.left { color: #76b900; }
.ptr-label.right { color: #ff6b6b; }
.status-line {
  text-align: center;
  margin: 10px 0;
  font-size: 1em;
  min-height: 24px;
}
.btn {
  background: #76b900;
  color: #0f0f23;
  border: none;
  padding: 8px 20px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.95em;
  font-weight: bold;
  margin: 5px;
  transition: background 0.2s;
}
.btn:hover { background: #8dd600; }
.btn:disabled { background: #444; color: #888; cursor: not-allowed; }
.btn-secondary { background: #00d4aa; }
.btn-secondary:hover { background: #00eebb; }
.controls { text-align: center; margin: 15px 0; }
.floyd-canvas {
  width: 100%;
  height: 320px;
  display: block;
}
</style>
</head>
<body>

<div class="animation-container">
  <h3>对撞指针动画演示</h3>
  <p>数组 <code>[1, 3, 5, 7, 9, 11]</code>，target = 12</p>
  <div class="array-display" id="collision-array"></div>
  <div class="status-line" id="collision-status">点击"下一步"开始演示</div>
  <div class="controls">
    <button class="btn" id="collision-next">下一步</button>
    <button class="btn btn-secondary" id="collision-reset">重置</button>
  </div>
</div>

<div class="animation-container">
  <h3>Floyd 环检测动画</h3>
  <p>绿色 = slow（每次 1 步），红色 = fast（每次 2 步）</p>
  <canvas class="floyd-canvas" id="floyd-canvas"></canvas>
  <div class="status-line" id="floyd-status">正在运行...</div>
  <div class="controls">
    <button class="btn" id="floyd-pause">暂停</button>
    <button class="btn btn-secondary" id="floyd-reset">重置</button>
  </div>
</div>

<script>
// === Collision pointer animation ===
const collisionNums = [1, 3, 5, 7, 9, 11];
const collisionTarget = 12;
let collisionState = { left: 0, right: 5, step: 0, done: false };

function renderCollision() {
  const container = document.getElementById('collision-array');
  container.innerHTML = '';
  collisionNums.forEach((num, i) => {
    const cell = document.createElement('div');
    cell.className = 'array-cell';
    cell.textContent = num;
    if (i === collisionState.left && i === collisionState.right) {
      cell.classList.add('both-ptr');
    } else if (i === collisionState.left) {
      cell.classList.add('left-ptr');
      const lbl = document.createElement('div');
      lbl.className = 'ptr-label left';
      lbl.textContent = 'L';
      cell.appendChild(lbl);
    } else if (i === collisionState.right) {
      cell.classList.add('right-ptr');
      const lbl = document.createElement('div');
      lbl.className = 'ptr-label right';
      lbl.textContent = 'R';
      cell.appendChild(lbl);
    }
    container.appendChild(cell);
  });
}

function collisionStep() {
  if (collisionState.done) return;
  const {left, right} = collisionState;
  if (left >= right) {
    document.getElementById('collision-status').textContent = '搜索结束，未找到';
    collisionState.done = true;
    return;
  }
  const s = collisionNums[left] + collisionNums[right];
  const status = document.getElementById('collision-status');
  if (s === collisionTarget) {
    status.innerHTML = `nums[${left}] + nums[${right}] = ${collisionNums[left]} + ${collisionNums[right]} = ${s} == ${collisionTarget} <strong style="color:#76b900">找到！</strong>`;
    collisionState.done = true;
  } else if (s < collisionTarget) {
    status.textContent = `nums[${left}] + nums[${right}] = ${collisionNums[left]} + ${collisionNums[right]} = ${s} < ${collisionTarget} → left++`;
    collisionState.left++;
  } else {
    status.textContent = `nums[${left}] + nums[${right}] = ${collisionNums[left]} + ${collisionNums[right]} = ${s} > ${collisionTarget} → right--`;
    collisionState.right--;
  }
  renderCollision();
}

function collisionReset() {
  collisionState = { left: 0, right: 5, step: 0, done: false };
  document.getElementById('collision-status').textContent = '点击"下一步"开始演示';
  renderCollision();
}

document.getElementById('collision-next').addEventListener('click', collisionStep);
document.getElementById('collision-reset').addEventListener('click', collisionReset);
renderCollision();

// === Floyd cycle detection animation ===
const floydCanvas = document.getElementById('floyd-canvas');
const ctx = floydCanvas.getContext('2d');
let floydRunning = true;
let floydAnimId = null;

// Linked list: 0->1->2->3->4->5->6->3 (cycle at node 3)
const TAIL_LEN = 3; // nodes 0,1,2 are tail
const CYCLE_LEN = 4; // nodes 3,4,5,6 form cycle
const TOTAL_NODES = TAIL_LEN + CYCLE_LEN;

let slowPos = 0, fastPos = 0, floydStep = 0, floydMet = false, floydDone = false;
let floydTimer = 0;
const FLOYD_INTERVAL = 60; // frames between steps

function getNodePosition(index, w, h) {
  const cx = w / 2, cy = h / 2;
  const radius = Math.min(w, h) * 0.3;
  if (index < TAIL_LEN) {
    // Tail nodes: line from left
    const startX = cx - radius - 60;
    const x = startX - (TAIL_LEN - 1 - index) * 55;
    return { x, y: cy };
  } else {
    // Cycle nodes: circle
    const ci = index - TAIL_LEN;
    const angle = -Math.PI / 2 + (ci / CYCLE_LEN) * 2 * Math.PI;
    return { x: cx + radius * Math.cos(angle), y: cy + radius * Math.sin(angle) };
  }
}

function resizeFloydCanvas() {
  const rect = floydCanvas.parentElement.getBoundingClientRect();
  floydCanvas.width = rect.width - 40;
  floydCanvas.height = 320;
}

function drawFloyd() {
  const w = floydCanvas.width, h = floydCanvas.height;
  ctx.clearRect(0, 0, w, h);

  // Draw edges
  ctx.strokeStyle = '#444';
  ctx.lineWidth = 2;
  for (let i = 0; i < TOTAL_NODES; i++) {
    const from = getNodePosition(i, w, h);
    const nextIdx = i < TOTAL_NODES - 1 ? i + 1 : TAIL_LEN; // last node -> cycle start
    const to = getNodePosition(nextIdx, w, h);
    ctx.beginPath();
    ctx.moveTo(from.x, from.y);
    ctx.lineTo(to.x, to.y);
    ctx.stroke();
    // Arrow
    const angle = Math.atan2(to.y - from.y, to.x - from.x);
    const ax = to.x - 18 * Math.cos(angle), ay = to.y - 18 * Math.sin(angle);
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(ax - 8 * Math.cos(angle - 0.4), ay - 8 * Math.sin(angle - 0.4));
    ctx.moveTo(ax, ay);
    ctx.lineTo(ax - 8 * Math.cos(angle + 0.4), ay - 8 * Math.sin(angle + 0.4));
    ctx.stroke();
  }

  // Draw nodes
  for (let i = 0; i < TOTAL_NODES; i++) {
    const pos = getNodePosition(i, w, h);
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 16, 0, Math.PI * 2);
    ctx.fillStyle = i === TAIL_LEN ? '#2a4a00' : '#1a1a2e';
    ctx.fill();
    ctx.strokeStyle = i === TAIL_LEN ? '#76b900' : '#555';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#e0e0e0';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(i.toString(), pos.x, pos.y);
  }

  // Draw slow pointer
  const slowNode = getNodePosition(slowPos, w, h);
  ctx.beginPath();
  ctx.arc(slowNode.x, slowNode.y - 26, 8, 0, Math.PI * 2);
  ctx.fillStyle = '#76b900';
  ctx.fill();
  ctx.fillStyle = '#76b900';
  ctx.font = 'bold 10px sans-serif';
  ctx.fillText('S', slowNode.x, slowNode.y - 26);

  // Draw fast pointer
  const fastNode = getNodePosition(fastPos, w, h);
  ctx.beginPath();
  ctx.arc(fastNode.x, fastNode.y + 26, 8, 0, Math.PI * 2);
  ctx.fillStyle = '#ff6b6b';
  ctx.fill();
  ctx.fillStyle = '#ff6b6b';
  ctx.font = 'bold 10px sans-serif';
  ctx.fillText('F', fastNode.x, fastNode.y + 26);
}

function nextNode(pos) {
  return pos < TOTAL_NODES - 1 ? pos + 1 : TAIL_LEN;
}

function floydAnimate() {
  floydTimer++;
  if (floydTimer >= FLOYD_INTERVAL && !floydDone) {
    floydTimer = 0;
    if (!floydMet) {
      slowPos = nextNode(slowPos);
      fastPos = nextNode(nextNode(fastPos));
      floydStep++;
      if (slowPos === fastPos) {
        floydMet = true;
        document.getElementById('floyd-status').innerHTML = `第 ${floydStep} 步：slow 和 fast 在节点 ${slowPos} 相遇！<strong style="color:#76b900">检测到环！</strong>`;
        floydDone = true;
      } else {
        document.getElementById('floyd-status').textContent = `第 ${floydStep} 步：slow=${slowPos}, fast=${fastPos}`;
      }
    }
  }
  drawFloyd();
  if (floydRunning) {
    floydAnimId = requestAnimationFrame(floydAnimate);
  }
}

function floydReset() {
  slowPos = 0; fastPos = 0; floydStep = 0; floydMet = false; floydDone = false; floydTimer = 0;
  document.getElementById('floyd-status').textContent = '正在运行...';
  if (!floydRunning) {
    floydRunning = true;
    document.getElementById('floyd-pause').textContent = '暂停';
    floydAnimate();
  }
}

document.getElementById('floyd-pause').addEventListener('click', function() {
  floydRunning = !floydRunning;
  this.textContent = floydRunning ? '暂停' : '继续';
  if (floydRunning) floydAnimate();
});
document.getElementById('floyd-reset').addEventListener('click', floydReset);

resizeFloydCanvas();
window.addEventListener('resize', () => { resizeFloydCanvas(); drawFloyd(); });
floydAnimate();
</script>

<script>
(function () {
  function reportHeight() { parent.postMessage({ type: 'tc-anim-height', height: document.documentElement.scrollHeight }, '*'); }
  window.addEventListener('load', reportHeight);
  if (window.ResizeObserver) { new ResizeObserver(reportHeight).observe(document.body); } else { setInterval(reportHeight, 500); }
})();
</script>
</body>
</html>
