<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>滑动窗口动画</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: transparent;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  line-height: 1.7;
  padding: 4px;
}
h2 { color: #00d4aa; margin: 20px 0 8px; font-size: 1.3em; }
h3 { color: #76b900; margin: 16px 0 8px; font-size: 1.1em; }
code { background: #1a1a2e; padding: 2px 6px; border-radius: 3px; font-family: 'Fira Code', 'Consolas', monospace; font-size: 0.9em; }
.anim-container {
  background: #12122a;
  border: 1px solid #333;
  border-radius: 10px;
  padding: 20px;
  margin: 16px 0;
}
.char-array {
  display: flex;
  gap: 4px;
  justify-content: center;
  margin: 16px 0;
  flex-wrap: wrap;
}
.char-cell {
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  border: 2px solid #444;
  border-radius: 6px;
  font-size: 1.2em;
  font-weight: bold;
  position: relative;
  transition: all 0.3s;
}
.char-cell.in-window {
  background: rgba(118, 185, 0, 0.15);
  border-color: #76b900;
}
.char-cell .idx {
  position: absolute;
  bottom: -18px;
  font-size: 0.6em;
  color: #666;
}
.pointer-label {
  position: absolute;
  top: -20px;
  font-size: 0.7em;
  font-weight: bold;
}
.pointer-left { color: #ff6b6b; }
.pointer-right { color: #76b900; }
.controls { text-align: center; margin: 12px 0; }
.btn {
  background: #76b900;
  color: #0f0f23;
  border: none;
  padding: 8px 20px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
  font-size: 0.9em;
  margin: 4px;
}
.btn:hover { background: #8fd400; }
.btn:disabled { background: #444; color: #888; cursor: not-allowed; }
.btn-secondary { background: #00d4aa; }
.btn-secondary:hover { background: #00f0c0; }
.info-panel {
  display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;
  margin: 12px 0; font-size: 0.9em;
}
.info-panel span { background: #1a1a2e; padding: 4px 10px; border-radius: 4px; border: 1px solid #333; }
.step-log { color: #999; font-size: 0.85em; min-height: 24px; text-align: center; margin-top: 8px; }
.side-by-side {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
@media (max-width: 700px) {
  .side-by-side { grid-template-columns: 1fr; }
  .char-cell { width: 36px; height: 36px; font-size: 1em; }
}
</style>
</head>
<body>

<h2>动画: 最长无重复子串</h2>
<p style="color:#999;margin-bottom:8px">字符串 "abcabcbb"，点击"下一步"推进算法</p>

<div class="anim-container" id="anim1">
  <div class="char-array" id="char-array"></div>
  <div class="info-panel">
    <span>window: <code id="window-display">{}</code></span>
    <span>ans: <strong id="ans-display">0</strong></span>
    <span>left: <span id="left-display" style="color:#ff6b6b">0</span>, right: <span id="right-display" style="color:#76b900">-</span></span>
  </div>
  <div class="step-log" id="step-log">点击"下一步"开始</div>
  <div class="controls">
    <button class="btn" id="btn-next">下一步</button>
    <button class="btn btn-secondary" id="btn-reset">重置</button>
  </div>
</div>

<h2>动画: 最长 vs 最短对比</h2>
<p style="color:#999;margin-bottom:8px">左: 最长合法窗口 (while 不合法) | 右: 最短合法窗口 (while 合法)</p>

<div class="side-by-side">
  <div class="anim-container">
    <h3 style="text-align:center;margin-bottom:10px">最长 (ans 在 while 外)</h3>
    <div class="char-array" id="longest-array"></div>
    <div class="info-panel"><span>ans: <strong id="longest-ans">0</strong></span></div>
    <div class="step-log" id="longest-log">点击开始</div>
    <div class="controls">
      <button class="btn" id="btn-longest-next">下一步</button>
      <button class="btn btn-secondary" id="btn-longest-reset">重置</button>
    </div>
  </div>
  <div class="anim-container">
    <h3 style="text-align:center;margin-bottom:10px">最短 (ans 在 while 内)</h3>
    <div class="char-array" id="shortest-array"></div>
    <div class="info-panel"><span>ans: <strong id="shortest-ans">Inf</strong></span></div>
    <div class="step-log" id="shortest-log">点击开始</div>
    <div class="controls">
      <button class="btn" id="btn-shortest-next">下一步</button>
      <button class="btn btn-secondary" id="btn-shortest-reset">重置</button>
    </div>
  </div>
</div>

<script>
// --- Animation 1: Longest substring without repeating characters ---
const STR = "abcabcbb";
let anim1State = { left: 0, right: -1, window: {}, ans: 0, steps: [], stepIdx: 0 };

function generateSteps() {
  const steps = [];
  let left = 0, window = {}, ans = 0;
  for (let right = 0; right < STR.length; right++) {
    const c = STR[right];
    window[c] = (window[c] || 0) + 1;
    steps.push({type:'expand', left, right, window:{...window}, ans, msg:`right=${right}, 加入 '${c}', window=${JSON.stringify(window)}`});
    while (hasDuplicate(window)) {
      const lc = STR[left];
      window[lc]--;
      if (window[lc] === 0) delete window[lc];
      left++;
      steps.push({type:'shrink', left, right, window:{...window}, ans, msg:`有重复! 移除 '${lc}', left=${left}`});
    }
    ans = Math.max(ans, right - left + 1);
    steps.push({type:'update', left, right, window:{...window}, ans, msg:`窗口合法, ans = max(ans, ${right}-${left}+1) = ${ans}`});
  }
  steps.push({type:'done', left, right: STR.length-1, window:{...window}, ans, msg:`完成! 最长无重复子串长度 = ${ans}`});
  return steps;
}
function hasDuplicate(w) { return Object.values(w).some(v => v > 1); }

function renderAnim1(state) {
  const container = document.getElementById('char-array');
  container.innerHTML = '';
  for (let i = 0; i < STR.length; i++) {
    const cell = document.createElement('div');
    cell.className = 'char-cell';
    if (i >= state.left && i <= state.right) cell.classList.add('in-window');
    cell.textContent = STR[i];
    if (i === state.left && state.right >= 0) {
      const lbl = document.createElement('span');
      lbl.className = 'pointer-label pointer-left';
      lbl.textContent = 'L';
      cell.appendChild(lbl);
    }
    if (i === state.right) {
      const lbl = document.createElement('span');
      lbl.className = 'pointer-label pointer-right';
      lbl.textContent = 'R';
      cell.appendChild(lbl);
    }
    const idx = document.createElement('span');
    idx.className = 'idx';
    idx.textContent = i;
    cell.appendChild(idx);
    container.appendChild(cell);
  }
  document.getElementById('window-display').textContent = JSON.stringify(state.window);
  document.getElementById('ans-display').textContent = state.ans;
  document.getElementById('left-display').textContent = state.left;
  document.getElementById('right-display').textContent = state.right >= 0 ? state.right : '-';
}

function initAnim1() {
  anim1State = { left: 0, right: -1, window: {}, ans: 0, steps: generateSteps(), stepIdx: 0 };
  renderAnim1(anim1State);
  document.getElementById('step-log').textContent = '点击"下一步"开始';
  document.getElementById('btn-next').disabled = false;
}

document.getElementById('btn-next').addEventListener('click', () => {
  if (anim1State.stepIdx >= anim1State.steps.length) return;
  const step = anim1State.steps[anim1State.stepIdx++];
  anim1State.left = step.left;
  anim1State.right = step.right;
  anim1State.window = step.window;
  anim1State.ans = step.ans;
  renderAnim1(anim1State);
  document.getElementById('step-log').textContent = step.msg;
  if (step.type === 'done') document.getElementById('btn-next').disabled = true;
});

document.getElementById('btn-reset').addEventListener('click', initAnim1);
initAnim1();

// --- Animation 2: Longest vs Shortest side by side ---
const LONGEST_STR = "abcabcbb";
let longestState = { left:0, right:-1, ans:0, steps:[], stepIdx:0 };

function genLongestSteps() {
  const steps = [];
  let left=0, w={}, ans=0;
  for (let r=0; r<LONGEST_STR.length; r++) {
    const c = LONGEST_STR[r];
    w[c]=(w[c]||0)+1;
    steps.push({left, right:r, ans, msg:`R=${r} 扩张 '${c}'`});
    while (Object.values(w).some(v=>v>1)) {
      w[LONGEST_STR[left]]--;
      if(w[LONGEST_STR[left]]===0) delete w[LONGEST_STR[left]];
      left++;
      steps.push({left, right:r, ans, msg:`不合法, L收缩到${left}`});
    }
    ans = Math.max(ans, r-left+1);
    steps.push({left, right:r, ans, msg:`while外更新 ans=${ans}`});
  }
  return steps;
}

function renderLongest(s) {
  const container = document.getElementById('longest-array');
  container.innerHTML = '';
  for (let i=0; i<LONGEST_STR.length; i++) {
    const cell = document.createElement('div');
    cell.className = 'char-cell';
    if (i>=s.left && i<=s.right) cell.classList.add('in-window');
    cell.textContent = LONGEST_STR[i];
    if (i===s.left && s.right>=0) { const l=document.createElement('span'); l.className='pointer-label pointer-left'; l.textContent='L'; cell.appendChild(l); }
    if (i===s.right) { const l=document.createElement('span'); l.className='pointer-label pointer-right'; l.textContent='R'; cell.appendChild(l); }
    container.appendChild(cell);
  }
  document.getElementById('longest-ans').textContent = s.ans;
  document.getElementById('longest-log').textContent = s.msg || '点击开始';
}

function initLongest() {
  longestState = {left:0, right:-1, ans:0, steps:genLongestSteps(), stepIdx:0, msg:''};
  renderLongest(longestState);
}
document.getElementById('btn-longest-next').addEventListener('click', () => {
  if (longestState.stepIdx >= longestState.steps.length) return;
  const step = longestState.steps[longestState.stepIdx++];
  Object.assign(longestState, step);
  renderLongest(longestState);
});
document.getElementById('btn-longest-reset').addEventListener('click', initLongest);
initLongest();

// -- Shortest side --
const SHORTEST_ARR = [2,3,1,2,4,3];
const SHORTEST_TARGET = 7;
let shortestState = { left:0, right:-1, ans:Infinity, steps:[], stepIdx:0 };

function genShortestSteps() {
  const steps = [];
  let left=0, sum=0, ans=Infinity;
  for (let r=0; r<SHORTEST_ARR.length; r++) {
    sum += SHORTEST_ARR[r];
    steps.push({left, right:r, ans, msg:`R=${r} 扩张, sum=${sum}`});
    while (sum >= SHORTEST_TARGET) {
      ans = Math.min(ans, r-left+1);
      steps.push({left, right:r, ans, msg:`while内更新 ans=${ans}`});
      sum -= SHORTEST_ARR[left];
      left++;
      steps.push({left, right:r, ans, msg:`合法, L收缩到${left}, sum=${sum}`});
    }
  }
  return steps;
}

function renderShortest(s) {
  const container = document.getElementById('shortest-array');
  container.innerHTML = '';
  for (let i=0; i<SHORTEST_ARR.length; i++) {
    const cell = document.createElement('div');
    cell.className = 'char-cell';
    if (i>=s.left && i<=s.right) cell.classList.add('in-window');
    cell.textContent = SHORTEST_ARR[i];
    if (i===s.left && s.right>=0) { const l=document.createElement('span'); l.className='pointer-label pointer-left'; l.textContent='L'; cell.appendChild(l); }
    if (i===s.right) { const l=document.createElement('span'); l.className='pointer-label pointer-right'; l.textContent='R'; cell.appendChild(l); }
    container.appendChild(cell);
  }
  document.getElementById('shortest-ans').textContent = s.ans === Infinity ? 'Inf' : s.ans;
  document.getElementById('shortest-log').textContent = s.msg || '点击开始';
}

function initShortest() {
  shortestState = {left:0, right:-1, ans:Infinity, steps:genShortestSteps(), stepIdx:0, msg:''};
  renderShortest(shortestState);
}
document.getElementById('btn-shortest-next').addEventListener('click', () => {
  if (shortestState.stepIdx >= shortestState.steps.length) return;
  const step = shortestState.steps[shortestState.stepIdx++];
  Object.assign(shortestState, step);
  renderShortest(shortestState);
});
document.getElementById('btn-shortest-reset').addEventListener('click', initShortest);
initShortest();
</script>

<script>
(function () {
  function reportHeight() { parent.postMessage({ type: 'tc-anim-height', height: document.documentElement.scrollHeight }, '*'); }
  window.addEventListener('load', reportHeight);
  if (window.ResizeObserver) { new ResizeObserver(reportHeight).observe(document.body); } else { setInterval(reportHeight, 500); }
})();
</script>
</body>
</html>
