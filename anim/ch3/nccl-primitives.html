<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NCCL 通信原语可视化</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: transparent;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  line-height: 1.6;
  padding: 4px;
}
.anim-btn {
  padding: 10px 24px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  border: none;
  border-radius: 6px;
  color: #fff;
  cursor: pointer;
  font-size: 0.95em;
  margin: 0 5px;
  transition: transform 0.2s, box-shadow 0.2s;
}
.anim-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
}
.anim-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}
</style>
</head>
<body>

<div style="background:#12121f; border:1px solid #333; border-radius:8px; padding:20px; margin:15px 0;">
  <!-- Primitive selector -->
  <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:15px;">
    <button class="anim-btn" onclick="ncclDemo.show('broadcast')" id="nccl-btn-broadcast">Broadcast</button>
    <button class="anim-btn" onclick="ncclDemo.show('reduce')" id="nccl-btn-reduce">Reduce</button>
    <button class="anim-btn" onclick="ncclDemo.show('allreduce')" id="nccl-btn-allreduce">AllReduce</button>
    <button class="anim-btn" onclick="ncclDemo.show('allgather')" id="nccl-btn-allgather">AllGather</button>
    <button class="anim-btn" onclick="ncclDemo.show('reducescatter')" id="nccl-btn-reducescatter">ReduceScatter</button>
  </div>

  <!-- GPU visualization -->
  <div style="display:flex; justify-content:center; gap:20px; flex-wrap:wrap; margin: 20px 0;">
    <div style="text-align:center;">
      <div style="font-size:0.8rem; color:#888; margin-bottom:8px; font-weight:bold;">Before (输入)</div>
      <div id="nccl-before" style="display:flex; gap:12px;"></div>
    </div>
    <div style="display:flex; align-items:center; font-size:2rem; color:#667eea; padding-top:20px;">&#8594;</div>
    <div style="text-align:center;">
      <div style="font-size:0.8rem; color:#888; margin-bottom:8px; font-weight:bold;">After (输出)</div>
      <div id="nccl-after" style="display:flex; gap:12px;"></div>
    </div>
  </div>

  <!-- Explanation -->
  <div id="nccl-explanation" style="background:#1a1a2e; border-radius:8px; padding:15px; margin-top:15px; font-size:0.85rem; color:#ccc; min-height:60px;"></div>
</div>

<script>
const ncclDemo = (() => {
  const gpuColors = ['#f44336', '#4caf50', '#2196f3', '#ff9800'];
  const gpuNames = ['GPU 0', 'GPU 1', 'GPU 2', 'GPU 3'];
  const dataLabels = ['A', 'B', 'C', 'D'];

  function makeGpuBox(gpuIdx, dataBlocks, highlight) {
    const border = highlight ? `border:2px solid ${gpuColors[gpuIdx]}` : 'border:1px solid #444';
    let blocksHtml = '';
    dataBlocks.forEach(block => {
      if (block.type === 'single') {
        blocksHtml += `<div style="width:28px;height:28px;background:${block.color};border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:0.65rem;font-weight:bold;color:#fff;">${block.label}</div>`;
      } else if (block.type === 'sum') {
        blocksHtml += `<div style="width:28px;height:28px;background:linear-gradient(135deg,${block.colors.join(',')});border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:0.6rem;font-weight:bold;color:#fff;">Σ</div>`;
      } else if (block.type === 'empty') {
        blocksHtml += `<div style="width:28px;height:28px;background:#222;border:1px dashed #444;border-radius:4px;"></div>`;
      }
    });
    return `<div style="text-align:center;">
      <div style="background:#1a1a2e;${border};border-radius:8px;padding:10px;min-width:50px;">
        <div style="font-size:0.7rem;color:${gpuColors[gpuIdx]};margin-bottom:6px;font-weight:bold;">${gpuNames[gpuIdx]}</div>
        <div style="display:flex;gap:3px;justify-content:center;flex-wrap:wrap;">${blocksHtml}</div>
      </div>
    </div>`;
  }

  const primitives = {
    broadcast: {
      before: [
        [{type:'single',color:gpuColors[0],label:'A'},{type:'single',color:gpuColors[0],label:'A'},{type:'single',color:gpuColors[0],label:'A'},{type:'single',color:gpuColors[0],label:'A'}],
        [{type:'empty'},{type:'empty'},{type:'empty'},{type:'empty'}],
        [{type:'empty'},{type:'empty'},{type:'empty'},{type:'empty'}],
        [{type:'empty'},{type:'empty'},{type:'empty'},{type:'empty'}]
      ],
      after: [
        [{type:'single',color:gpuColors[0],label:'A'},{type:'single',color:gpuColors[0],label:'A'},{type:'single',color:gpuColors[0],label:'A'},{type:'single',color:gpuColors[0],label:'A'}],
        [{type:'single',color:gpuColors[0],label:'A'},{type:'single',color:gpuColors[0],label:'A'},{type:'single',color:gpuColors[0],label:'A'},{type:'single',color:gpuColors[0],label:'A'}],
        [{type:'single',color:gpuColors[0],label:'A'},{type:'single',color:gpuColors[0],label:'A'},{type:'single',color:gpuColors[0],label:'A'},{type:'single',color:gpuColors[0],label:'A'}],
        [{type:'single',color:gpuColors[0],label:'A'},{type:'single',color:gpuColors[0],label:'A'},{type:'single',color:gpuColors[0],label:'A'},{type:'single',color:gpuColors[0],label:'A'}]
      ],
      explain: `<strong style="color:#667eea;">Broadcast</strong>: GPU 0 (root) 的数据 <strong>复制</strong>到所有其他 GPU。<br>
        <strong>用途:</strong> 分发模型参数初始值、分发 batch 数据到各 worker。<br>
        <strong>通信量 (per GPU):</strong> M × (N-1)/N ≈ M（接收方各收一份完整数据）`
    },
    reduce: {
      before: [
        [{type:'single',color:gpuColors[0],label:'A'}],
        [{type:'single',color:gpuColors[1],label:'B'}],
        [{type:'single',color:gpuColors[2],label:'C'}],
        [{type:'single',color:gpuColors[3],label:'D'}]
      ],
      after: [
        [{type:'sum',colors:gpuColors,label:'Σ'}],
        [{type:'empty'}],
        [{type:'empty'}],
        [{type:'empty'}]
      ],
      explain: `<strong style="color:#667eea;">Reduce</strong>: 所有 GPU 的数据<strong>规约 (sum) 到一个 root GPU</strong>，其他 GPU 上结果丢弃。<br>
        <strong>用途:</strong> 汇总 loss 值到 rank 0 用于 logging。<br>
        <strong>通信量 (per GPU):</strong> M × (N-1)/N。结果: root 持有 A+B+C+D`
    },
    allreduce: {
      before: [
        [{type:'single',color:gpuColors[0],label:'A'}],
        [{type:'single',color:gpuColors[1],label:'B'}],
        [{type:'single',color:gpuColors[2],label:'C'}],
        [{type:'single',color:gpuColors[3],label:'D'}]
      ],
      after: [
        [{type:'sum',colors:gpuColors,label:'Σ'}],
        [{type:'sum',colors:gpuColors,label:'Σ'}],
        [{type:'sum',colors:gpuColors,label:'Σ'}],
        [{type:'sum',colors:gpuColors,label:'Σ'}]
      ],
      explain: `<strong style="color:#667eea;">AllReduce</strong>: 所有 GPU 的数据规约, 结果<strong>每个 GPU 都有一份完整副本</strong>。= Reduce + Broadcast。<br>
        <strong>用途:</strong> DDP 同步梯度 — 每个 GPU 都需要完整的梯度求和来更新参数。<br>
        <strong>通信量 (per GPU):</strong> 2M × (N-1)/N (最常用! Ring AllReduce 可高效实现)<br>
        <strong>结果:</strong> 每个 GPU 都持有 A+B+C+D`
    },
    allgather: {
      before: [
        [{type:'single',color:gpuColors[0],label:'A'}],
        [{type:'single',color:gpuColors[1],label:'B'}],
        [{type:'single',color:gpuColors[2],label:'C'}],
        [{type:'single',color:gpuColors[3],label:'D'}]
      ],
      after: [
        [{type:'single',color:gpuColors[0],label:'A'},{type:'single',color:gpuColors[1],label:'B'},{type:'single',color:gpuColors[2],label:'C'},{type:'single',color:gpuColors[3],label:'D'}],
        [{type:'single',color:gpuColors[0],label:'A'},{type:'single',color:gpuColors[1],label:'B'},{type:'single',color:gpuColors[2],label:'C'},{type:'single',color:gpuColors[3],label:'D'}],
        [{type:'single',color:gpuColors[0],label:'A'},{type:'single',color:gpuColors[1],label:'B'},{type:'single',color:gpuColors[2],label:'C'},{type:'single',color:gpuColors[3],label:'D'}],
        [{type:'single',color:gpuColors[0],label:'A'},{type:'single',color:gpuColors[1],label:'B'},{type:'single',color:gpuColors[2],label:'C'},{type:'single',color:gpuColors[3],label:'D'}]
      ],
      explain: `<strong style="color:#667eea;">AllGather</strong>: 每个 GPU 的数据片段<strong>拼接成完整数据</strong>, 每个 GPU 都持有全部。<br>
        <strong>用途:</strong> FSDP forward 时收集分片的参数 — 每个 GPU 只存 1/N 参数, AllGather 后得到完整权重做 forward。<br>
        <strong>通信量 (per GPU):</strong> M × (N-1)/N<br>
        <strong>结果:</strong> 每个 GPU 从持有 1 个分片 → 持有所有 4 个分片 [A,B,C,D]`
    },
    reducescatter: {
      before: [
        [{type:'single',color:gpuColors[0],label:'A'},{type:'single',color:gpuColors[0],label:'A'},{type:'single',color:gpuColors[0],label:'A'},{type:'single',color:gpuColors[0],label:'A'}],
        [{type:'single',color:gpuColors[1],label:'B'},{type:'single',color:gpuColors[1],label:'B'},{type:'single',color:gpuColors[1],label:'B'},{type:'single',color:gpuColors[1],label:'B'}],
        [{type:'single',color:gpuColors[2],label:'C'},{type:'single',color:gpuColors[2],label:'C'},{type:'single',color:gpuColors[2],label:'C'},{type:'single',color:gpuColors[2],label:'C'}],
        [{type:'single',color:gpuColors[3],label:'D'},{type:'single',color:gpuColors[3],label:'D'},{type:'single',color:gpuColors[3],label:'D'},{type:'single',color:gpuColors[3],label:'D'}]
      ],
      after: [
        [{type:'sum',colors:[gpuColors[0],gpuColors[1],gpuColors[2],gpuColors[3]],label:'Σ₀'}],
        [{type:'sum',colors:[gpuColors[0],gpuColors[1],gpuColors[2],gpuColors[3]],label:'Σ₁'}],
        [{type:'sum',colors:[gpuColors[0],gpuColors[1],gpuColors[2],gpuColors[3]],label:'Σ₂'}],
        [{type:'sum',colors:[gpuColors[0],gpuColors[1],gpuColors[2],gpuColors[3]],label:'Σ₃'}]
      ],
      explain: `<strong style="color:#667eea;">ReduceScatter</strong>: 每个 GPU 的完整数据先规约, 然后结果<strong>分片分发</strong>, 每个 GPU 只保留 1/N。<br>
        <strong>用途:</strong> FSDP backward 时将梯度规约并分片 — 每个 GPU 只需保存自己负责的 1/N 梯度。<br>
        <strong>通信量 (per GPU):</strong> M × (N-1)/N<br>
        <strong>结果:</strong> GPU i 持有所有 GPU 第 i 个分片的 sum (如 GPU 0 持有 A₀+B₀+C₀+D₀)<br>
        <strong>关系:</strong> AllReduce = ReduceScatter + AllGather`
    }
  };

  function render(primitiveName) {
    const p = primitives[primitiveName];
    // Update button highlights
    document.querySelectorAll('[id^="nccl-btn-"]').forEach(btn => btn.style.opacity = '0.5');
    const activeBtn = document.getElementById('nccl-btn-' + primitiveName);
    if (activeBtn) activeBtn.style.opacity = '1';

    // Render before
    const beforeEl = document.getElementById('nccl-before');
    beforeEl.innerHTML = p.before.map((blocks, i) => makeGpuBox(i, blocks, true)).join('');

    // Render after
    const afterEl = document.getElementById('nccl-after');
    afterEl.innerHTML = p.after.map((blocks, i) => makeGpuBox(i, blocks, true)).join('');

    // Explanation
    document.getElementById('nccl-explanation').innerHTML = p.explain;
  }

  return {
    show(name) { render(name); }
  };
})();
// Initialize with Broadcast
ncclDemo.show('broadcast');
</script>

<script>
(function () {
  function reportHeight() { parent.postMessage({ type: 'tc-anim-height', height: document.documentElement.scrollHeight }, '*'); }
  window.addEventListener('load', reportHeight);
  if (window.ResizeObserver) { new ResizeObserver(reportHeight).observe(document.body); } else { setInterval(reportHeight, 500); }
})();
</script>
</body>
</html>
