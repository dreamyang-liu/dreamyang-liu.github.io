<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>通信量对比</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: transparent;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  line-height: 1.6;
  padding: 4px;
}
.wrap { background:#12121f; border:1px solid #333; border-radius:8px; padding:20px; margin:15px 0; }
.bar-chart {
  margin: 20px 0;
}
.bar-row {
  display: flex;
  align-items: center;
  margin: 10px 0;
}
.bar-label {
  width: 140px;
  font-size: 0.9em;
  color: #a78bfa;
}
.bar-track {
  flex: 1;
  height: 30px;
  background: #2d2d44;
  border-radius: 6px;
  overflow: hidden;
  position: relative;
}
.bar-fill {
  height: 100%;
  border-radius: 6px;
  transition: width 1.5s ease;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 10px;
  font-size: 0.8em;
  font-weight: bold;
  color: #fff;
  width: 0%;
}
.bar-fill.allreduce { background: linear-gradient(90deg, #667eea, #764ba2); }
.bar-fill.allgather { background: linear-gradient(90deg, #4caf50, #66bb6a); }
.bar-fill.reducescatter { background: linear-gradient(90deg, #f44336, #ef5350); }
.bar-fill.broadcast { background: linear-gradient(90deg, #ff9800, #ffb74d); }
</style>
</head>
<body>

<div class="wrap">
  <div class="bar-chart" id="commBarChart">
    <div class="bar-row">
      <div class="bar-label">AllReduce</div>
      <div class="bar-track">
        <div class="bar-fill allreduce" data-width="100" style="width: 0%;">1.5 GB</div>
      </div>
    </div>
    <div class="bar-row">
      <div class="bar-label">AllGather</div>
      <div class="bar-track">
        <div class="bar-fill allgather" data-width="50" style="width: 0%;">0.75 GB</div>
      </div>
    </div>
    <div class="bar-row">
      <div class="bar-label">ReduceScatter</div>
      <div class="bar-track">
        <div class="bar-fill reducescatter" data-width="50" style="width: 0%;">0.75 GB</div>
      </div>
    </div>
    <div class="bar-row">
      <div class="bar-label">Broadcast</div>
      <div class="bar-track">
        <div class="bar-fill broadcast" data-width="50" style="width: 0%;">0.75 GB</div>
      </div>
    </div>
  </div>
  <p style="color: #888; font-size: 0.85em; text-align: center;">* AllReduce 通信量 = 2M(N-1)/N; 其他 = M(N-1)/N。N=4, M=1GB。</p>
</div>

<script>
function animateCommBars() {
  const bars = document.querySelectorAll('#commBarChart .bar-fill');
  bars.forEach(bar => {
    const width = bar.getAttribute('data-width');
    bar.style.width = width + '%';
  });
}
// Standalone trigger: animate after load (replaces page IntersectionObserver)
window.addEventListener('load', () => { setTimeout(animateCommBars, 300); });
</script>

<script>
(function () {
  function reportHeight() { parent.postMessage({ type: 'tc-anim-height', height: document.documentElement.scrollHeight }, '*'); }
  window.addEventListener('load', reportHeight);
  if (window.ResizeObserver) { new ResizeObserver(reportHeight).observe(document.body); } else { setInterval(reportHeight, 500); }
})();
</script>
</body>
</html>
