<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交互式 GPU 架构图</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: transparent;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  line-height: 1.6;
  padding: 4px;
}
.gpu-arch-container { position: relative; width: 100%; min-height: 500px; background: #12122a; border-radius: 12px; border: 1px solid #333; padding: 20px; overflow: hidden; }
.gpu-chip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 20px; }
.sm-unit { background: linear-gradient(135deg, #1e3a5f, #2a1a4e); border: 1px solid #444; border-radius: 8px; padding: 12px; cursor: pointer; transition: all 0.3s ease; text-align: center; position: relative; }
.sm-unit:hover { border-color: #00d2ff; box-shadow: 0 0 15px rgba(0,210,255,0.3); transform: scale(1.05); }
.sm-unit.active { border-color: #7b2ff7; box-shadow: 0 0 20px rgba(123,47,247,0.5); }
.sm-unit .sm-label { font-size: 0.8rem; color: #00d2ff; font-weight: bold; }
.sm-detail-panel { position: absolute; top: 0; right: 0; width: 45%; height: 100%; background: #1a1a2e; border-left: 1px solid #444; padding: 20px; transform: translateX(100%); transition: transform 0.4s ease; z-index: 10; overflow-y: auto; }
.sm-detail-panel.open { transform: translateX(0); }
.sm-detail-panel h4 { color: #7b2ff7; margin-bottom: 12px; }
.warp-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; margin: 10px 0; }
.thread-dot { width: 12px; height: 12px; background: #00d2ff; border-radius: 2px; animation: threadPulse 1.5s ease-in-out infinite; }
.thread-dot:nth-child(odd) { animation-delay: 0.3s; }
@keyframes threadPulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
.close-panel { position: absolute; top: 10px; right: 10px; background: none; border: 1px solid #666; color: #ccc; padding: 4px 10px; border-radius: 4px; cursor: pointer; }
.close-panel:hover { border-color: #00d2ff; color: #00d2ff; }
@media (max-width: 768px) {
  .gpu-chip { grid-template-columns: repeat(2, 1fr); }
  .sm-detail-panel { width: 70%; }
}
</style>
</head>
<body>

<div class="gpu-arch-container" id="gpuArch">
  <div class="gpu-chip" id="gpuChip">
    <!-- SM units generated by JS -->
  </div>
  <div class="sm-detail-panel" id="smDetailPanel">
    <button class="close-panel" onclick="closeSmPanel()">✕</button>
    <h4 id="smDetailTitle">SM 0 内部结构</h4>
    <div style="margin-top:12px;">
      <p style="color:#aaa;font-size:0.85rem;margin-bottom:8px;"><strong style="color:#00d2ff;">CUDA Cores:</strong> 128 个 FP32 单元</p>
      <p style="color:#aaa;font-size:0.85rem;margin-bottom:8px;"><strong style="color:#7b2ff7;">Tensor Cores:</strong> 4 个（4x4 矩阵运算）</p>
      <p style="color:#aaa;font-size:0.85rem;margin-bottom:12px;"><strong style="color:#f9ca24;">Shared Memory:</strong> 可配置 48KB/64KB/100KB</p>
      <p style="color:#ccc;font-size:0.85rem;margin-bottom:8px;">每个 SM 可同时管理多个 Warp：</p>
      <div id="warpDisplay"></div>
      <p style="color:#888;font-size:0.75rem;margin-top:12px;">每行 = 1 个 Warp (32 threads)，颜色脉动表示线程正在执行</p>
    </div>
  </div>
</div>

<script>
// ========================
// GPU Architecture Interactive
// ========================
const gpuChip = document.getElementById('gpuChip');
const smCount = 16; // Simplified representation
for (let i = 0; i < smCount; i++) {
  const sm = document.createElement('div');
  sm.className = 'sm-unit';
  sm.innerHTML = `<div class="sm-label">SM ${i}</div><div style="font-size:0.65rem;color:#888;margin-top:4px;">128 CUDA Cores<br>4 Tensor Cores</div>`;
  sm.onclick = () => openSmPanel(i);
  gpuChip.appendChild(sm);
}

function openSmPanel(idx) {
  document.querySelectorAll('.sm-unit').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.sm-unit')[idx].classList.add('active');

  const panel = document.getElementById('smDetailPanel');
  document.getElementById('smDetailTitle').textContent = `SM ${idx} 内部结构`;

  // Generate warp display
  const warpDisplay = document.getElementById('warpDisplay');
  warpDisplay.innerHTML = '';
  const warpCount = 4; // Show 4 warps
  for (let w = 0; w < warpCount; w++) {
    const warpLabel = document.createElement('div');
    warpLabel.style.cssText = 'font-size:0.75rem;color:#7b2ff7;margin-top:8px;margin-bottom:4px;';
    warpLabel.textContent = `Warp ${w} (32 threads):`;
    warpDisplay.appendChild(warpLabel);

    const grid = document.createElement('div');
    grid.className = 'warp-grid';
    for (let t = 0; t < 32; t++) {
      const dot = document.createElement('div');
      dot.className = 'thread-dot';
      dot.style.animationDelay = `${(t * 0.05)}s`;
      grid.appendChild(dot);
    }
    warpDisplay.appendChild(grid);
  }

  panel.classList.add('open');
}

function closeSmPanel() {
  document.getElementById('smDetailPanel').classList.remove('open');
  document.querySelectorAll('.sm-unit').forEach(s => s.classList.remove('active'));
}
</script>

<script>
(function () {
  function reportHeight() { parent.postMessage({ type: 'tc-anim-height', height: document.documentElement.scrollHeight }, '*'); }
  window.addEventListener('load', reportHeight);
  if (window.ResizeObserver) { new ResizeObserver(reportHeight).observe(document.body); } else { setInterval(reportHeight, 500); }
})();
</script>
</body>
</html>
