<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>位操作可视化</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: transparent;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  line-height: 1.6;
  padding: 4px;
}
.animation-container { background: #0a0a1a; border-radius: 12px; padding: 20px; margin: 0; border: 1px solid #333; position: relative; overflow: hidden; }
.btn { background: linear-gradient(135deg, #76b900, #00d4aa); color: #000; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.9rem; transition: transform 0.2s, opacity 0.2s; }
.btn:hover { transform: scale(1.05); opacity: 0.9; }
.btn:active { transform: scale(0.95); }
.btn-secondary { background: #333; color: #e0e0e0; border: 1px solid #555; }
.btn-secondary:hover { background: #444; }
.controls { display: flex; gap: 10px; margin: 15px 0; flex-wrap: wrap; align-items: center; }
.step-info { color: #76b900; font-size: 0.9rem; margin: 10px 0; min-height: 24px; }

.bit-row { display: flex; gap: 4px; margin: 8px 0; align-items: center; font-family: 'SF Mono', 'Fira Code', monospace; }
.bit-cell { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: #1a1a2e; border: 1px solid #444; border-radius: 4px; font-size: 1rem; transition: all 0.4s ease; }
.bit-cell.on { background: #76b900; color: #000; font-weight: bold; }
.bit-cell.off { background: #1a1a2e; color: #555; }
.bit-cell.highlight { background: #00d4aa; color: #000; font-weight: bold; animation: pulse 0.6s ease; }
.bit-cell.removed { background: #ff4444; color: #fff; animation: fadeOut 0.6s ease; }
.bit-label { width: 120px; color: #888; font-size: 0.85rem; text-align: right; padding-right: 12px; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.2); } }
@keyframes fadeOut { 0% { opacity: 1; } 100% { opacity: 0.3; } }

@media (max-width: 600px) {
  .bit-cell { width: 28px; height: 28px; font-size: 0.8rem; }
  .bit-label { width: 80px; font-size: 0.75rem; }
  .controls { flex-direction: column; align-items: stretch; }
}
</style>
</head>
<body>

<div class="animation-container">
<div class="controls">
  <button class="btn" onclick="selectDemo('clear')">n & (n-1) 清最低位1</button>
  <button class="btn btn-secondary" onclick="selectDemo('lowbit')">n & -n 取最低位1</button>
</div>
<div class="controls">
  <button class="btn btn-secondary" id="btn-prev" onclick="prevStep()">← 上一步</button>
  <button class="btn" id="btn-next" onclick="nextStep()">下一步 →</button>
  <button class="btn btn-secondary" id="btn-auto" onclick="autoPlay()">▶ 自动播放</button>
  <button class="btn btn-secondary" onclick="resetDemo()">↺ 重置</button>
  <span class="step-info" id="step-counter" style="margin:0;"></span>
</div>
<div id="bit-display">
  <div class="bit-row">
    <span class="bit-label">n = 13</span>
    <div id="bits-n" style="display:flex; gap:4px;"></div>
    <span style="margin-left:12px; color:#888;" id="decimal-n">= 13</span>
  </div>
  <div class="bit-row" id="row-operand" style="display:none;">
    <span class="bit-label" id="label-operand">n-1 = 12</span>
    <div id="bits-operand" style="display:flex; gap:4px;"></div>
    <span style="margin-left:12px; color:#888;" id="decimal-operand">= 12</span>
  </div>
  <div class="bit-row" id="row-result" style="display:none;">
    <span class="bit-label" id="label-result">结果</span>
    <div id="bits-result" style="display:flex; gap:4px;"></div>
    <span style="margin-left:12px; color:#888;" id="decimal-result">= ?</span>
  </div>
</div>
<div class="step-info" id="bit-step-info">点击按钮开始演示</div>
</div>

<script>
// Bit animation
const NUM = 13;
const BITS = 8;

function toBits(n) {
  return Array.from({length: BITS}, (_, i) => (n >> (BITS - 1 - i)) & 1);
}

function renderBits(containerId, bits, highlights = [], classes = []) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  bits.forEach((b, i) => {
    const cell = document.createElement('div');
    cell.className = 'bit-cell ' + (b ? 'on' : 'off');
    if (highlights.includes(i)) cell.className += ' ' + (classes[highlights.indexOf(i)] || 'highlight');
    cell.textContent = b;
    container.appendChild(cell);
  });
}

// --- Step-driven demos ---
// Each demo has N phases. Step 0 renders phase 1 (n highlighted),
// step 1 adds the operand row, step 2 adds the result row.
const N = 3; // phases per demo

const bitsN = toBits(NUM);
const demos = {
  clear: (function () {
    const operand = NUM - 1;           // 12
    const result = NUM & operand;      // 12
    return {
      bitsOp: toBits(operand),
      bitsRes: toBits(result),
      operandLabel: 'n-1 = 12',
      operandDec: '= 12',
      resultLabel: 'n&(n-1)',
      resultDec: '= 12',
      steps: [
        function () {
          renderBits('bits-n', bitsN, [4, 5, 7], ['highlight', 'highlight', 'highlight']);
        },
        function () {
          // bit 7 (LSB) was 1->0, bit 6 was 0->1
          renderBits('bits-operand', demos.clear.bitsOp, [6, 7], ['highlight', 'highlight']);
        },
        function () {
          renderBits('bits-n', bitsN, [7], ['removed']);
          renderBits('bits-result', demos.clear.bitsRes, [4, 5], ['highlight', 'highlight']);
        }
      ],
      descs: [
        'Step 1: n = 13，二进制为 00001101',
        'Step 2: n-1 = 12。最低位的1（第0位）变0，更低位全变1',
        'Step 3: AND 操作 — 最低位的1被清掉了！13 (3个1) -> 12 (2个1)'
      ]
    };
  })(),
  lowbit: (function () {
    const neg = (~NUM + 1) & 0xFF;     // -n in 8-bit two's complement = 243
    const result = NUM & neg;          // 1
    return {
      bitsOp: toBits(neg),
      bitsRes: toBits(result),
      operandLabel: '-n (补码)',
      operandDec: '= ~n+1',
      resultLabel: 'n&(-n)',
      resultDec: '= 1',
      steps: [
        function () {
          renderBits('bits-n', bitsN, [4, 5, 7], ['highlight', 'highlight', 'highlight']);
        },
        function () {
          renderBits('bits-operand', demos.lowbit.bitsOp, [7], ['highlight']);
        },
        function () {
          renderBits('bits-result', demos.lowbit.bitsRes, [7], ['highlight']);
        }
      ],
      descs: [
        'Step 1: n = 13，二进制为 00001101',
        'Step 2: -n = ~n + 1。取反再加1，最低位的1保持，更高位全反转',
        'Step 3: AND 操作 — 只留下最低位的1！lowbit(13) = 1'
      ]
    };
  })()
};

// Independent step state per demo
const stepState = { clear: 0, lowbit: 0 };
let currentType = null; // null = nothing selected yet
let autoTimer = null;

function stopAuto() {
  if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
}

function updateControls() {
  const prev = document.getElementById('btn-prev');
  const next = document.getElementById('btn-next');
  const auto = document.getElementById('btn-auto');
  const counter = document.getElementById('step-counter');
  if (!currentType) {
    prev.disabled = true;
    next.disabled = false;
    auto.disabled = false;
    prev.style.opacity = 0.4;
    next.style.opacity = 1;
    auto.style.opacity = 1;
    counter.textContent = '';
    return;
  }
  const step = stepState[currentType];
  const atStart = step <= 0;
  const atEnd = step >= N - 1;
  prev.disabled = atStart;
  next.disabled = atEnd;
  auto.disabled = atEnd;
  prev.style.opacity = atStart ? 0.4 : 1;
  next.style.opacity = atEnd ? 0.4 : 1;
  auto.style.opacity = atEnd ? 0.4 : 1;
  counter.textContent = 'Step ' + step + ' / ' + (N - 1);
}

// Render the settled still frame for currentType at its current step.
function renderFrame() {
  // Base layout: always start from a clean n row, hide operand/result.
  renderBits('bits-n', bitsN);
  document.getElementById('decimal-n').textContent = '= 13';
  document.getElementById('row-operand').style.display = 'none';
  document.getElementById('row-result').style.display = 'none';

  if (!currentType) {
    document.getElementById('bit-step-info').textContent = '点击上方按钮选择一种位操作演示';
    updateControls();
    return;
  }

  const demo = demos[currentType];
  const step = stepState[currentType];

  // Reveal rows appropriate to the step, then apply cumulative still frame.
  if (step >= 1) {
    document.getElementById('row-operand').style.display = 'flex';
    document.getElementById('label-operand').textContent = demo.operandLabel;
    document.getElementById('decimal-operand').textContent = demo.operandDec;
    renderBits('bits-operand', demo.bitsOp);
  }
  if (step >= 2) {
    document.getElementById('row-result').style.display = 'flex';
    document.getElementById('label-result').textContent = demo.resultLabel;
    document.getElementById('decimal-result').textContent = demo.resultDec;
    renderBits('bits-result', demo.bitsRes);
  }

  // Apply per-phase highlight overlays up to and including current step.
  for (let i = 0; i <= step; i++) demo.steps[i]();

  document.getElementById('bit-step-info').textContent = demo.descs[step];
  updateControls();
}

function selectDemo(type) {
  stopAuto();
  currentType = type;
  stepState[type] = 0;
  renderFrame();
}

function nextStep() {
  if (!currentType) { selectDemo('clear'); return; }
  if (stepState[currentType] < N - 1) {
    stepState[currentType]++;
    renderFrame();
  }
}

function prevStep() {
  if (!currentType) return;
  if (stepState[currentType] > 0) {
    stepState[currentType]--;
    renderFrame();
  }
}

function autoPlay() {
  if (!currentType) selectDemo('clear');
  stopAuto();
  function walk() {
    if (!currentType || stepState[currentType] >= N - 1) { stopAuto(); return; }
    stepState[currentType]++;
    renderFrame();
    if (stepState[currentType] < N - 1) {
      autoTimer = setTimeout(walk, 1500);
    } else {
      stopAuto();
    }
  }
  walk();
}

function resetDemo() {
  stopAuto();
  currentType = null;
  stepState.clear = 0;
  stepState.lowbit = 0;
  renderFrame();
}

// Initialize
resetDemo();

// 自动把高度汇报给父页面
(function () {
  function reportHeight() { parent.postMessage({ type: 'tc-anim-height', height: document.documentElement.scrollHeight }, '*'); }
  window.addEventListener('load', reportHeight);
  if (window.ResizeObserver) { new ResizeObserver(reportHeight).observe(document.body); } else { setInterval(reportHeight, 500); }
})();
</script>
</body>
</html>
