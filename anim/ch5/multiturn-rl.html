<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-turn RL Loop</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: transparent;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  line-height: 1.6;
  padding: 4px;
}
.card { background: #1a1a2e; border-radius: 12px; border: 1px solid #333; padding: 24px; margin: 8px 0; }
h3 { font-size: 1.4em; color: #ff9800; margin: 0 0 15px; }
.multiturn-container { position: relative; width: 100%; height: 350px; background: #12122a; border-radius: 12px; border: 1px solid #333; margin: 20px 0; overflow: hidden; }
.mt-agent { position: absolute; left: 10%; top: 40%; width: 100px; height: 60px; background: linear-gradient(135deg, #ff4444, #ff6666); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.8em; }
.mt-env { position: absolute; right: 10%; top: 40%; width: 100px; height: 60px; background: linear-gradient(135deg, #4488ff, #66aaff); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.8em; }
.mt-tool { position: absolute; left: 45%; top: 10%; width: 90px; height: 50px; background: linear-gradient(135deg, #50fa7b, #2ecc71); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.75em; color: #333; }
.mt-reward { position: absolute; left: 45%; bottom: 10%; width: 90px; height: 50px; background: linear-gradient(135deg, #ff9800, #ffcc80); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.75em; color: #333; }
.mt-message { position: absolute; padding: 4px 8px; background: #2a2a4e; border-radius: 6px; font-size: 0.7em; opacity: 0; white-space: nowrap; }
.btn { display: inline-block; padding: 8px 20px; background: linear-gradient(135deg, #ff4444, #ff9800); border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; font-size: 0.9em; margin: 5px; transition: opacity 0.2s; }
.btn:hover { opacity: 0.85; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-secondary { background: linear-gradient(135deg, #4488ff, #66aaff); }
.controls { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.step-info { color: #ff9800; font-size: 0.9em; margin: 10px 0 0; min-height: 22px; }
.step-info .counter { color: #888; font-weight: normal; margin-left: 8px; }
</style>
</head>
<body>

<div class="card">
<h3>交互式：Multi-turn RL Loop</h3>
<div class="multiturn-container" id="multiturn-anim">
<div class="mt-agent">Agent<br>(Policy)</div>
<div class="mt-env">Environment<br>(User/API)</div>
<div class="mt-tool">Tool<br>Executor</div>
<div class="mt-reward">Reward<br>Signal</div>
</div>
<div class="controls">
  <button class="btn btn-secondary" id="btn-multiturn-prev" onclick="prev()">← 上一步</button>
  <button class="btn btn-secondary" id="btn-multiturn-next" onclick="next()">下一步 →</button>
  <button class="btn btn-secondary" id="btn-multiturn-reset" onclick="reset()">↺ 重置</button>
  <button class="btn" id="btn-multiturn-auto" onclick="auto()">▶ 自动播放</button>
</div>
<div class="step-info" id="multiturn-step-info"></div>
<div id="multiturn-log" style="background:#12122a; border-radius:8px; padding:10px; margin-top:10px; max-height:120px; overflow-y:auto; font-size:0.8em; font-family:monospace; color:#aaa;"></div>
</div>

<script>
// === Multi-turn RL Animation (manual step-through) ===
var prev, next, reset, auto;
(function() {
    const container = document.getElementById('multiturn-anim');
    const log = document.getElementById('multiturn-log');
    const stepInfo = document.getElementById('multiturn-step-info');
    const prevBtn = document.getElementById('btn-multiturn-prev');
    const nextBtn = document.getElementById('btn-multiturn-next');
    const autoBtn = document.getElementById('btn-multiturn-auto');

    const steps = [
        { from: 'agent', to: 'env', text: 'Query: "2+3=?"' },
        { from: 'env', to: 'agent', text: 'Response needed' },
        { from: 'agent', to: 'tool', text: 'tool_call: calc(2+3)' },
        { from: 'tool', to: 'agent', text: 'result: 5' },
        { from: 'agent', to: 'env', text: 'Answer: 5' },
        { from: 'env', to: 'reward', text: 'Evaluate...' },
        { from: 'reward', to: 'agent', text: 'reward: +1.0' },
    ];
    const N = steps.length; // 7

    let step = 0;          // current discrete step (0..N-1)
    let messages = [];     // rendered message DOM nodes
    let autoTimer = null;

    function getPos(name) {
        const el = container.querySelector('.mt-' + name);
        if (!el) return { x: 50, y: 50 };
        return {
            x: el.offsetLeft + el.offsetWidth / 2,
            y: el.offsetTop + el.offsetHeight / 2
        };
    }

    // Render a settled still frame: messages 0..step shown at their
    // destination nodes, the latest one highlighted; log 0..step.
    function render() {
        // clear prior frame
        messages.forEach(m => m.remove());
        messages = [];
        log.innerHTML = '';

        for (let i = 0; i <= step; i++) {
            const s = steps[i];
            const toPos = getPos(s.to);
            const msg = document.createElement('div');
            msg.className = 'mt-message';
            msg.textContent = s.text;
            msg.style.left = toPos.x + 'px';
            msg.style.top = toPos.y + 'px';
            // latest message fully visible, earlier ones faded
            msg.style.opacity = (i === step) ? '1' : '0.35';
            msg.style.transition = 'none';
            container.appendChild(msg);
            messages.push(msg);

            const logEntry = document.createElement('div');
            logEntry.textContent = `[Turn] ${s.from} → ${s.to}: ${s.text}`;
            logEntry.style.color = s.from === 'reward' ? '#50fa7b' : '#aaa';
            log.appendChild(logEntry);
        }
        log.scrollTop = log.scrollHeight;

        const cur = steps[step];
        stepInfo.innerHTML = `${cur.from} → ${cur.to}: ${cur.text}` +
            `<span class="counter">Step ${step} / ${N - 1}</span>`;

        updateButtons();
    }

    function updateButtons() {
        prevBtn.disabled = (step <= 0);
        nextBtn.disabled = (step >= N - 1);
        autoBtn.disabled = (step >= N - 1);
    }

    function stopAuto() {
        if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
    }

    prev = function() {
        stopAuto();
        if (step > 0) { step--; render(); }
    };

    next = function() {
        stopAuto();
        if (step < N - 1) { step++; render(); }
    };

    reset = function() {
        stopAuto();
        step = 0;
        render();
    };

    auto = function() {
        stopAuto();
        function tick() {
            if (step >= N - 1) { autoTimer = null; return; }
            step++;
            render();
            if (step < N - 1) {
                autoTimer = setTimeout(tick, 1200);
            } else {
                autoTimer = null;
            }
        }
        tick();
    };

    // initialize at first step
    render();
})();

// === 自动把高度汇报给父页面（让 iframe 自适应高度）===
(function () {
  function reportHeight() {
    var h = document.documentElement.scrollHeight;
    parent.postMessage({ type: 'tc-anim-height', height: h }, '*');
  }
  window.addEventListener('load', reportHeight);
  if (window.ResizeObserver) {
    new ResizeObserver(reportHeight).observe(document.body);
  } else {
    setInterval(reportHeight, 500);
  }
})();
</script>
</body>
</html>
