<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪心算法动画</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: transparent;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  line-height: 1.8;
  padding: 4px;
}
h3 { font-size: 1.2rem; color: #00d4aa; margin: 1.2rem 0 0.8rem; }
.animation-container { background: #0a0a1a; border-radius: 12px; padding: 20px; margin: 0.8rem 0; border: 1px solid #333; position: relative; overflow: hidden; }
.btn { background: linear-gradient(135deg, #76b900, #00d4aa); color: #000; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.9rem; transition: transform 0.2s, opacity 0.2s; }
.btn:hover { transform: scale(1.05); opacity: 0.9; }
.btn:active { transform: scale(0.95); }
.btn-secondary { background: #333; color: #e0e0e0; border: 1px solid #555; }
.btn-secondary:hover { background: #444; }
.controls { display: flex; gap: 10px; margin: 15px 0; flex-wrap: wrap; align-items: center; }
.step-info { color: #76b900; font-size: 0.9rem; margin: 10px 0; min-height: 24px; }

/* Timeline for interval animation */
.timeline { position: relative; height: 280px; margin: 20px 0; }
.timeline-axis { position: absolute; bottom: 30px; left: 40px; right: 20px; height: 2px; background: #444; }
.timeline-label { position: absolute; bottom: 5px; font-size: 0.7rem; color: #888; transform: translateX(-50%); }
.interval-bar { position: absolute; height: 24px; border-radius: 4px; transition: all 0.5s ease; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: bold; }
.interval-bar.pending { background: #333; border: 1px solid #555; color: #aaa; }
.interval-bar.selected { background: rgba(118,185,0,0.8); border: 1px solid #76b900; color: #000; }
.interval-bar.rejected { background: rgba(255,80,80,0.2); border: 1px solid rgba(255,80,80,0.4); color: #f55; }
.interval-bar.current { background: rgba(0,212,170,0.4); border: 2px solid #00d4aa; color: #fff; }

/* Course schedule animation */
.course-container { min-height: 200px; }
.course-row { display: flex; align-items: center; gap: 10px; margin: 6px 0; padding: 8px 12px; border-radius: 8px; transition: all 0.4s ease; font-size: 0.85rem; }
.course-row.in-heap { background: rgba(118,185,0,0.15); border: 1px solid #76b900; }
.course-row.rejected { background: rgba(255,80,80,0.1); border: 1px solid rgba(255,80,80,0.3); opacity: 0.5; }
.course-row.current { background: rgba(0,212,170,0.2); border: 2px solid #00d4aa; }
.course-row.pending { background: #1a1a2e; border: 1px solid #333; }
.heap-display { background: #1a1a2e; border: 1px solid #76b900; border-radius: 8px; padding: 12px; margin: 10px 0; }
.heap-item { display: inline-block; background: #76b900; color: #000; padding: 4px 10px; border-radius: 4px; margin: 3px; font-weight: bold; font-size: 0.85rem; }
.heap-item.popped { background: #f55; color: #fff; text-decoration: line-through; }

@media (max-width: 600px) {
  .timeline { height: 320px; }
}
</style>
</head>
<body>

<h3>区间调度动画</h3>
<div class="animation-container">
  <div class="controls">
    <button class="btn" id="interval-start">开始演示</button>
    <button class="btn btn-secondary" id="interval-step">下一步</button>
    <button class="btn btn-secondary" id="interval-reset">重置</button>
  </div>
  <div class="step-info" id="interval-info">点击"开始演示"查看贪心选择过程</div>
  <div class="timeline" id="interval-timeline"></div>
</div>

<h3>反悔贪心动画（课程表 III）</h3>
<div class="animation-container">
  <div class="controls">
    <button class="btn" id="course-start">开始演示</button>
    <button class="btn btn-secondary" id="course-step">下一步</button>
    <button class="btn btn-secondary" id="course-reset">重置</button>
  </div>
  <div class="step-info" id="course-info">点击"开始演示"查看反悔贪心过程</div>
  <div class="heap-display">
    <strong>最大堆：</strong><span id="heap-content">空</span>
    <span style="margin-left:20px;">总耗时：<span id="total-time">0</span></span>
  </div>
  <div class="course-container" id="course-list"></div>
</div>

<script>
// === Interval Scheduling Animation ===
const intervals = [
  {s:1, e:4, label:'A'}, {s:3, e:5, label:'B'}, {s:0, e:6, label:'C'},
  {s:5, e:7, label:'D'}, {s:3, e:9, label:'E'}, {s:5, e:9, label:'F'},
  {s:6, e:10, label:'G'}, {s:8, e:11, label:'H'}, {s:8, e:12, label:'I'},
  {s:2, e:14, label:'J'}, {s:12, e:16, label:'K'}
];
// Sort by end time
intervals.sort((a,b) => a.e - b.e);

let intStep = -1;
let intSelected = [];
let intLastEnd = -1;
let intAutoPlay = null;

function renderIntervals() {
  const container = document.getElementById('interval-timeline');
  const maxTime = 16;
  const axisLeft = 40, axisRight = 20;
  container.innerHTML = '';

  // Axis
  const axis = document.createElement('div');
  axis.className = 'timeline-axis';
  container.appendChild(axis);

  // Time labels
  for (let t = 0; t <= maxTime; t += 2) {
    const lbl = document.createElement('div');
    lbl.className = 'timeline-label';
    lbl.textContent = t;
    lbl.style.left = `${axisLeft + (container.offsetWidth - axisLeft - axisRight) * t / maxTime}px`;
    container.appendChild(lbl);
  }

  const w = container.offsetWidth - axisLeft - axisRight;
  intervals.forEach((iv, i) => {
    const bar = document.createElement('div');
    bar.className = 'interval-bar';
    const left = axisLeft + w * iv.s / maxTime;
    const right = axisLeft + w * iv.e / maxTime;
    bar.style.left = left + 'px';
    bar.style.width = (right - left) + 'px';
    bar.style.top = (10 + i * 22) + 'px';
    bar.textContent = `${iv.label}[${iv.s},${iv.e}]`;

    if (i < intStep) {
      bar.classList.add(intSelected.includes(i) ? 'selected' : 'rejected');
    } else if (i === intStep) {
      bar.classList.add('current');
    } else {
      bar.classList.add('pending');
    }
    container.appendChild(bar);
  });
}

function intervalNextStep() {
  if (intStep >= intervals.length) {
    document.getElementById('interval-info').textContent =
      `完成！选了 ${intSelected.length} 个不重叠区间: ${intSelected.map(i=>intervals[i].label).join(', ')}`;
    if (intAutoPlay) { clearInterval(intAutoPlay); intAutoPlay = null; }
    return;
  }
  intStep++;
  if (intStep >= intervals.length) {
    document.getElementById('interval-info').textContent =
      `完成！选了 ${intSelected.length} 个不重叠区间: ${intSelected.map(i=>intervals[i].label).join(', ')}`;
    if (intAutoPlay) { clearInterval(intAutoPlay); intAutoPlay = null; }
    renderIntervals();
    return;
  }
  const iv = intervals[intStep];
  if (iv.s >= intLastEnd) {
    intSelected.push(intStep);
    intLastEnd = iv.e;
    document.getElementById('interval-info').textContent =
      `选择 ${iv.label}[${iv.s},${iv.e}]：起点${iv.s} >= 上次结束${intLastEnd === iv.e ? '(无)' : intLastEnd}，不重叠 ✓`;
    if (intSelected.length === 1) {
      document.getElementById('interval-info').textContent =
        `选择 ${iv.label}[${iv.s},${iv.e}]：第一个区间，直接选 ✓`;
    }
  } else {
    document.getElementById('interval-info').textContent =
      `跳过 ${iv.label}[${iv.s},${iv.e}]：起点${iv.s} < 上次结束${intLastEnd}，重叠 ✗`;
  }
  renderIntervals();
}

function intervalReset() {
  intStep = -1; intSelected = []; intLastEnd = -1;
  if (intAutoPlay) { clearInterval(intAutoPlay); intAutoPlay = null; }
  document.getElementById('interval-info').textContent = '点击"开始演示"查看贪心选择过程';
  renderIntervals();
}

document.getElementById('interval-start').addEventListener('click', () => {
  intervalReset();
  intAutoPlay = setInterval(intervalNextStep, 1200);
});
document.getElementById('interval-step').addEventListener('click', intervalNextStep);
document.getElementById('interval-reset').addEventListener('click', intervalReset);

// Initial render
setTimeout(renderIntervals, 100);
window.addEventListener('resize', renderIntervals);

// === Course Schedule III Animation ===
const courses = [
  {dur: 5, ddl: 5}, {dur: 4, ddl: 6}, {dur: 2, ddl: 7},
  {dur: 3, ddl: 9}, {dur: 5, ddl: 14}
];
// Already sorted by deadline

let courseStep = -1;
let courseHeap = []; // max-heap stored as negative values
let courseTotal = 0;
let courseStates = []; // 'pending', 'in-heap', 'rejected'
let courseAutoPlay = null;
let courseLog = '';

function heapPush(arr, val) {
  arr.push(val);
  let i = arr.length - 1;
  while (i > 0) {
    const parent = Math.floor((i-1)/2);
    if (arr[parent] < arr[i]) { [arr[parent], arr[i]] = [arr[i], arr[parent]]; i = parent; }
    else break;
  }
}
function heapPop(arr) {
  const top = arr[0];
  arr[0] = arr[arr.length-1];
  arr.pop();
  let i = 0;
  while (true) {
    let largest = i, l = 2*i+1, r = 2*i+2;
    if (l < arr.length && arr[l] > arr[largest]) largest = l;
    if (r < arr.length && arr[r] > arr[largest]) largest = r;
    if (largest !== i) { [arr[i], arr[largest]] = [arr[largest], arr[i]]; i = largest; }
    else break;
  }
  return top;
}

function renderCourses() {
  const container = document.getElementById('course-list');
  container.innerHTML = '';
  courses.forEach((c, i) => {
    const row = document.createElement('div');
    row.className = 'course-row ' + (courseStates[i] || 'pending');
    row.innerHTML = `<span style="min-width:60px;">课程${i+1}</span>
      <span>耗时: <strong>${c.dur}</strong></span>
      <span>截止: <strong>${c.ddl}</strong></span>
      <span style="margin-left:auto; font-size:0.8rem; color:#888;">${
        courseStates[i] === 'in-heap' ? '✓ 已选' :
        courseStates[i] === 'rejected' ? '✗ 被反悔踢出' : '等待'
      }</span>`;
    container.appendChild(row);
  });

  // Heap display
  const heapContent = document.getElementById('heap-content');
  if (courseHeap.length === 0) {
    heapContent.textContent = '空';
  } else {
    heapContent.innerHTML = courseHeap.map(v => `<span class="heap-item">${v}</span>`).join('');
  }
  document.getElementById('total-time').textContent = courseTotal;
}

function courseNextStep() {
  if (courseStep >= courses.length - 1) {
    document.getElementById('course-info').textContent =
      `完成！最多能上 ${courseHeap.length} 门课`;
    if (courseAutoPlay) { clearInterval(courseAutoPlay); courseAutoPlay = null; }
    return;
  }
  courseStep++;
  const c = courses[courseStep];
  courseTotal += c.dur;
  heapPush(courseHeap, c.dur);
  courseStates[courseStep] = 'in-heap';

  if (courseTotal > c.ddl) {
    const popped = heapPop(courseHeap);
    courseTotal -= popped;
    // Find which course was popped (the one with that duration that's in-heap)
    for (let i = 0; i <= courseStep; i++) {
      if (courseStates[i] === 'in-heap' && courses[i].dur === popped) {
        courseStates[i] = 'rejected';
        break;
      }
    }
    document.getElementById('course-info').textContent =
      `加入课程${courseStep+1}(耗时${c.dur})后总时间${courseTotal+popped}>${c.ddl}，反悔踢出耗时${popped}的课，总时间变为${courseTotal}`;
  } else {
    document.getElementById('course-info').textContent =
      `加入课程${courseStep+1}(耗时${c.dur})，总时间${courseTotal} ≤ 截止${c.ddl} ✓`;
  }
  renderCourses();
}

function courseReset() {
  courseStep = -1; courseHeap = []; courseTotal = 0;
  courseStates = courses.map(() => 'pending');
  if (courseAutoPlay) { clearInterval(courseAutoPlay); courseAutoPlay = null; }
  document.getElementById('course-info').textContent = '点击"开始演示"查看反悔贪心过程';
  renderCourses();
}

document.getElementById('course-start').addEventListener('click', () => {
  courseReset();
  courseAutoPlay = setInterval(courseNextStep, 1800);
});
document.getElementById('course-step').addEventListener('click', courseNextStep);
document.getElementById('course-reset').addEventListener('click', courseReset);

courseStates = courses.map(() => 'pending');
setTimeout(renderCourses, 100);

// ========== 自动把高度汇报给父页面 ==========
(function () {
  function reportHeight() { parent.postMessage({ type: 'tc-anim-height', height: document.documentElement.scrollHeight }, '*'); }
  window.addEventListener('load', reportHeight);
  if (window.ResizeObserver) { new ResizeObserver(reportHeight).observe(document.body); } else { setInterval(reportHeight, 500); }
})();
</script>
</body>
</html>
