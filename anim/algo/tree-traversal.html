<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三种遍历对比</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: transparent;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  line-height: 1.8;
  padding: 4px;
}
.animation-container { background: #0a0a1a; border-radius: 12px; padding: 20px; margin: 1.5rem 0; border: 1px solid #333; }
.btn { background: linear-gradient(135deg, #76b900, #00d4aa); color: #000; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.9rem; transition: transform 0.2s, opacity 0.2s; }
.btn:hover { transform: scale(1.05); opacity: 0.9; }
.btn:active { transform: scale(0.95); }
.btn-secondary { background: #333; color: #e0e0e0; border: 1px solid #555; }
.btn-secondary:hover { background: #444; }
.btn-active { box-shadow: 0 0 0 2px #76b900; }
.controls { display: flex; gap: 10px; margin: 15px 0; flex-wrap: wrap; align-items: center; }
.step-info { color: #76b900; font-size: 0.95rem; margin: 10px 0; min-height: 24px; }
.tree-canvas { width: 100%; height: 320px; display: block; }
.order-display { font-family: monospace; font-size: 1.1rem; color: #76b900; margin: 10px 0; min-height: 30px; letter-spacing: 2px; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.btn:disabled:hover { transform: none; opacity: 0.4; }
.step-counter { font-family: monospace; color: #888; font-size: 0.9rem; margin-left: auto; }
@media (max-width: 600px) {
  .tree-canvas { height: 260px; }
}
</style>
</head>
<body>

<div class="animation-container">
<p style="margin-bottom:10px; color:#888;">同一棵7节点完全二叉树，选择遍历方式观察节点访问顺序</p>

<div class="controls">
<button class="btn" id="btnPre" onclick="startTraversal('pre')">前序遍历</button>
<button class="btn" id="btnIn" onclick="startTraversal('in')">中序遍历</button>
<button class="btn" id="btnPost" onclick="startTraversal('post')">后序遍历</button>
</div>

<canvas class="tree-canvas" id="treeCanvas"></canvas>

<div class="order-display" id="orderDisplay"></div>
<div class="step-info" id="stepInfo">选择一种遍历方式开始动画</div>

<div class="controls">
<button class="btn btn-secondary" id="btnPrev" onclick="prev()">← 上一步</button>
<button class="btn" id="btnNext" onclick="next()">下一步 →</button>
<button class="btn" id="btnAuto" onclick="auto()">▶ 自动播放</button>
<button class="btn btn-secondary" id="btnReset" onclick="reset()">↺ 重置</button>
<span class="step-counter" id="stepCounter">Step 0 / 6</span>
</div>
</div>

<script>
// Tree structure: 7-node complete binary tree
// Indices 0-6, values displayed as 1-7
//        1(0)
//       / \
//     2(1)  3(2)
//    / \   / \
//  4(3) 5(4) 6(5) 7(6)

const tree = [1, 2, 3, 4, 5, 6, 7];
const canvas = document.getElementById('treeCanvas');
const ctx = canvas.getContext('2d');

let nodeStates = new Array(7).fill(0); // 0=normal, 1=visiting, 2=visited
let animationOrder = [];   // sequence of node indices in visit order
let animStep = 0;          // discrete step 0..N-1; -1 means nothing selected yet
let animTimer = null;      // auto-play timer
let currentType = null;    // 'pre' | 'in' | 'post'
const N = 7;               // number of node visits per traversal
const TRAVERSAL_NAMES = { pre: '前序 (根左右)', in: '中序 (左根右)', post: '后序 (左右根)' };

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * window.devicePixelRatio;
  canvas.height = rect.height * window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
}

function getNodePos(idx) {
  const w = canvas.getBoundingClientRect().width;
  const h = canvas.getBoundingClientRect().height;
  const level = Math.floor(Math.log2(idx + 1));
  const posInLevel = idx - (Math.pow(2, level) - 1);
  const nodesInLevel = Math.pow(2, level);
  const x = w * (posInLevel + 0.5) / nodesInLevel;
  const y = 50 + level * 80;
  return { x, y };
}

function drawTree() {
  const w = canvas.getBoundingClientRect().width;
  const h = canvas.getBoundingClientRect().height;
  ctx.clearRect(0, 0, w, h);

  // Draw edges
  for (let i = 0; i < 7; i++) {
    const left = 2 * i + 1;
    const right = 2 * i + 2;
    const pos = getNodePos(i);
    if (left < 7) {
      const lpos = getNodePos(left);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
      ctx.lineTo(lpos.x, lpos.y);
      ctx.strokeStyle = '#444';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    if (right < 7) {
      const rpos = getNodePos(right);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
      ctx.lineTo(rpos.x, rpos.y);
      ctx.strokeStyle = '#444';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  // Draw nodes
  for (let i = 0; i < 7; i++) {
    const pos = getNodePos(i);
    const r = 24;
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, r, 0, Math.PI * 2);

    if (nodeStates[i] === 2) {
      ctx.fillStyle = '#00d4aa';
      ctx.fill();
      ctx.strokeStyle = '#00d4aa';
    } else if (nodeStates[i] === 1) {
      ctx.fillStyle = '#76b900';
      ctx.fill();
      ctx.strokeStyle = '#76b900';
    } else {
      ctx.fillStyle = '#1a1a2e';
      ctx.fill();
      ctx.strokeStyle = '#555';
    }
    ctx.lineWidth = 2;
    ctx.stroke();

    // Node value
    ctx.fillStyle = nodeStates[i] > 0 ? '#000' : '#e0e0e0';
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(tree[i], pos.x, pos.y);
  }
}

function preorder(i, result) {
  if (i >= 7) return;
  result.push(i);
  preorder(2*i+1, result);
  preorder(2*i+2, result);
}

function inorder(i, result) {
  if (i >= 7) return;
  inorder(2*i+1, result);
  result.push(i);
  inorder(2*i+2, result);
}

function postorder(i, result) {
  if (i >= 7) return;
  postorder(2*i+1, result);
  postorder(2*i+2, result);
  result.push(i);
}

// Build the visit sequence for the chosen traversal and reset to step 0.
function startTraversal(type) {
  stopAuto();
  currentType = type;

  // Update traversal-order button styles
  document.getElementById('btnPre').classList.remove('btn-active');
  document.getElementById('btnIn').classList.remove('btn-active');
  document.getElementById('btnPost').classList.remove('btn-active');
  document.getElementById('btn' + (type === 'pre' ? 'Pre' : type === 'in' ? 'In' : 'Post')).classList.add('btn-active');

  animationOrder = [];
  if (type === 'pre') preorder(0, animationOrder);
  else if (type === 'in') inorder(0, animationOrder);
  else postorder(0, animationOrder);

  animStep = 0; // start at the first visited node
  render();
}

// Render a settled still frame for the current step.
function render() {
  // No traversal chosen yet: blank tree.
  if (currentType === null) {
    nodeStates = new Array(N).fill(0);
    drawTree();
    document.getElementById('orderDisplay').textContent = '';
    document.getElementById('stepInfo').textContent = '选择一种遍历方式开始动画';
    document.getElementById('stepCounter').textContent = 'Step 0 / ' + (N - 1);
    updateButtons();
    return;
  }

  // Node states: visited up to step-1, current = visiting.
  nodeStates = new Array(N).fill(0);
  for (let i = 0; i < animStep; i++) nodeStates[animationOrder[i]] = 2;
  nodeStates[animationOrder[animStep]] = 1;
  drawTree();

  // Order display: values visited up to and including current.
  let seq = [];
  for (let i = 0; i <= animStep; i++) seq.push(tree[animationOrder[i]]);
  document.getElementById('orderDisplay').textContent = seq.join(' → ');

  const name = TRAVERSAL_NAMES[currentType];
  const curVal = tree[animationOrder[animStep]];
  if (animStep === animationOrder.length - 1) {
    document.getElementById('stepInfo').textContent = `${name}：访问节点 ${curVal}，遍历完成！`;
  } else {
    document.getElementById('stepInfo').textContent = `${name}：访问节点 ${curVal}`;
  }
  document.getElementById('stepCounter').textContent = 'Step ' + animStep + ' / ' + (N - 1);
  updateButtons();
}

function updateButtons() {
  const atStart = (currentType === null) || animStep <= 0;
  const atEnd = (currentType === null) || animStep >= animationOrder.length - 1;
  document.getElementById('btnPrev').disabled = atStart;
  document.getElementById('btnNext').disabled = atEnd;
  document.getElementById('btnAuto').disabled = atEnd;
}

function prev() {
  if (currentType === null) return;
  stopAuto();
  if (animStep > 0) { animStep--; render(); }
}

function next() {
  if (currentType === null) startTraversal('pre');
  else if (animStep < animationOrder.length - 1) { animStep++; render(); }
}

function auto() {
  if (currentType === null) startTraversal('pre');
  if (animTimer) return;
  if (animStep >= animationOrder.length - 1) return;
  document.getElementById('btnAuto').textContent = '⏸ 播放中';
  animTimer = setInterval(() => {
    if (animStep >= animationOrder.length - 1) { stopAuto(); return; }
    animStep++;
    render();
  }, 700);
}

function stopAuto() {
  if (animTimer) { clearInterval(animTimer); animTimer = null; }
  const b = document.getElementById('btnAuto');
  if (b) b.textContent = '▶ 自动播放';
}

function reset() {
  stopAuto();
  currentType = null;
  animationOrder = [];
  animStep = 0;
  document.getElementById('btnPre').classList.remove('btn-active');
  document.getElementById('btnIn').classList.remove('btn-active');
  document.getElementById('btnPost').classList.remove('btn-active');
  render();
}

// Init
window.addEventListener('load', () => {
  resizeCanvas();
  render();
});
window.addEventListener('resize', () => {
  resizeCanvas();
  drawTree();
});
</script>

<script>
(function () {
  function reportHeight() { parent.postMessage({ type: 'tc-anim-height', height: document.documentElement.scrollHeight }, '*'); }
  window.addEventListener('load', reportHeight);
  if (window.ResizeObserver) { new ResizeObserver(reportHeight).observe(document.body); } else { setInterval(reportHeight, 500); }
})();
</script>
</body>
</html>
