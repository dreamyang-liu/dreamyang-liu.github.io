<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>回溯决策树</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: transparent;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  line-height: 1.7;
  padding: 4px;
}
code { background: #1a1a2e; padding: 2px 6px; border-radius: 3px; font-family: 'Fira Code', monospace; font-size: 0.9em; color: #76b900; }
h4 { color: #00d4aa; margin-bottom: 8px; text-align: center; }
.anim-container {
  background: #1a1a2e;
  border-radius: 8px;
  padding: 16px;
  margin: 16px 0;
  border: 1px solid #333;
}
.anim-controls { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.anim-controls button {
  background: #76b900;
  color: #0f0f23;
  border: none;
  padding: 8px 16px;
  border-radius: 4px;
  cursor: pointer;
  font-weight: bold;
  font-size: 0.9em;
}
.anim-controls button:hover { background: #8ed600; }
.anim-controls button.secondary { background: #00d4aa; }
.anim-controls button.secondary:hover { background: #00eebb; }

.tree-svg { width: 100%; height: 360px; }
.tree-node { cursor: pointer; }
.tree-node circle { fill: #1a1a2e; stroke: #76b900; stroke-width: 2; }
.tree-node.active circle { fill: #76b900; stroke: #76b900; }
.tree-node.done circle { fill: #333; stroke: #555; }
.tree-node.result circle { fill: #00d4aa; stroke: #00d4aa; }
.tree-node text { fill: #e0e0e0; font-size: 11px; text-anchor: middle; }
.tree-node.active text { fill: #0f0f23; }
.tree-edge { stroke: #555; stroke-width: 1.5; fill: none; }
.tree-edge.active { stroke: #76b900; stroke-width: 2.5; }

.compare-container { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 640px) { .compare-container { grid-template-columns: 1fr; } }
.compare-panel { background: #0f0f23; border: 1px solid #333; border-radius: 6px; padding: 12px; }

.status-info { font-size: 0.85em; color: #888; margin-top: 4px; }
</style>
</head>
<body>

<h4 style="text-align:left;color:#00d4aa;margin:8px 0;">子集决策树（数组 [1, 2, 3]）</h4>
<div class="anim-container">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:4px;">
    <span>当前 path: <code id="current-path">[]</code></span>
    <span>结果: <code id="current-results">[]</code></span>
  </div>
  <svg id="subset-tree" class="tree-svg" viewBox="0 0 700 340"></svg>
  <div class="anim-controls">
    <button onclick="subsetNext()">下一步</button>
    <button class="secondary" onclick="subsetReset()">重置</button>
    <span class="status-info" id="subset-status">点击"下一步"开始</span>
  </div>
</div>

<h4 style="text-align:left;color:#00d4aa;margin:8px 0;">排列 vs 组合（[1, 2, 3]）</h4>
<div class="anim-container">
<div class="compare-container">
  <div class="compare-panel">
    <h4>排列 P(3,2)</h4>
    <svg id="perm-tree" class="tree-svg" viewBox="0 0 340 280" style="height:280px;"></svg>
  </div>
  <div class="compare-panel">
    <h4>组合 C(3,2)</h4>
    <svg id="comb-tree" class="tree-svg" viewBox="0 0 340 280" style="height:280px;"></svg>
  </div>
</div>
<div class="anim-controls">
  <button onclick="compareNext()">下一步</button>
  <button class="secondary" onclick="compareReset()">重置</button>
  <span class="status-info" id="compare-status">点击"下一步"开始</span>
</div>
</div>

<script>
// === Animation 1: Subset decision tree ===
// Tree structure for subsets of [1,2,3] using pick/not-pick model
const subsetSteps = [
  { action: 'visit', node: 0, path: [], desc: '根节点，开始决策' },
  { action: 'visit', node: 1, path: [], desc: '考虑元素1：选1' },
  { action: 'visit', node: 3, path: [1], desc: '考虑元素2：选2' },
  { action: 'visit', node: 7, path: [1,2], desc: '考虑元素3：选3' },
  { action: 'result', node: 7, path: [1,2,3], desc: '收集结果 [1,2,3]' },
  { action: 'back', node: 7, path: [1,2], desc: '回溯：撤销选3' },
  { action: 'visit', node: 8, path: [1,2], desc: '考虑元素3：不选3' },
  { action: 'result', node: 8, path: [1,2], desc: '收集结果 [1,2]' },
  { action: 'back', node: 8, path: [1,2], desc: '回溯' },
  { action: 'back', node: 3, path: [1], desc: '回溯：撤销选2' },
  { action: 'visit', node: 4, path: [1], desc: '考虑元素2：不选2' },
  { action: 'visit', node: 9, path: [1], desc: '考虑元素3：选3' },
  { action: 'result', node: 9, path: [1,3], desc: '收集结果 [1,3]' },
  { action: 'back', node: 9, path: [1], desc: '回溯：撤销选3' },
  { action: 'visit', node: 10, path: [1], desc: '考虑元素3：不选3' },
  { action: 'result', node: 10, path: [1], desc: '收集结果 [1]' },
  { action: 'back', node: 10, path: [1], desc: '回溯' },
  { action: 'back', node: 4, path: [1], desc: '回溯' },
  { action: 'back', node: 1, path: [], desc: '回溯：撤销选1' },
  { action: 'visit', node: 2, path: [], desc: '考虑元素1：不选1' },
  { action: 'visit', node: 5, path: [], desc: '考虑元素2：选2' },
  { action: 'visit', node: 11, path: [2], desc: '考虑元素3：选3' },
  { action: 'result', node: 11, path: [2,3], desc: '收集结果 [2,3]' },
  { action: 'back', node: 11, path: [2], desc: '回溯：撤销选3' },
  { action: 'visit', node: 12, path: [2], desc: '考虑元素3：不选3' },
  { action: 'result', node: 12, path: [2], desc: '收集结果 [2]' },
  { action: 'back', node: 12, path: [2], desc: '回溯' },
  { action: 'back', node: 5, path: [], desc: '回溯：撤销选2' },
  { action: 'visit', node: 6, path: [], desc: '考虑元素2：不选2' },
  { action: 'visit', node: 13, path: [], desc: '考虑元素3：选3' },
  { action: 'result', node: 13, path: [3], desc: '收集结果 [3]' },
  { action: 'back', node: 13, path: [], desc: '回溯：撤销选3' },
  { action: 'visit', node: 14, path: [], desc: '考虑元素3：不选3' },
  { action: 'result', node: 14, path: [], desc: '收集结果 []' },
  { action: 'back', node: 14, path: [], desc: '回溯' },
  { action: 'back', node: 6, path: [], desc: '回溯' },
  { action: 'back', node: 2, path: [], desc: '完成！' },
];

// Node positions for subset tree
const stNodes = [
  {id:0, x:350, y:20, label:'根'},
  {id:1, x:180, y:80, label:'选1'},  {id:2, x:520, y:80, label:'不选1'},
  {id:3, x:100, y:150, label:'选2'}, {id:4, x:260, y:150, label:'不选2'},
  {id:5, x:440, y:150, label:'选2'}, {id:6, x:600, y:150, label:'不选2'},
  {id:7, x:60, y:230, label:'选3'},  {id:8, x:140, y:230, label:'不选3'},
  {id:9, x:220, y:230, label:'选3'}, {id:10, x:300, y:230, label:'不选3'},
  {id:11, x:400, y:230, label:'选3'},{id:12, x:480, y:230, label:'不选3'},
  {id:13, x:560, y:230, label:'选3'},{id:14, x:640, y:230, label:'不选3'},
];
const stEdges = [
  [0,1],[0,2],[1,3],[1,4],[2,5],[2,6],
  [3,7],[3,8],[4,9],[4,10],[5,11],[5,12],[6,13],[6,14]
];

let subsetStep = -1;
let subsetResults = [];
let nodeStates = {}; // 'active','done','result'

function drawSubsetTree() {
  const svg = document.getElementById('subset-tree');
  let html = '';
  // Edges
  stEdges.forEach(([a,b]) => {
    const na = stNodes[a], nb = stNodes[b];
    const cls = (nodeStates[a] === 'active' || nodeStates[b] === 'active') ? 'active' : '';
    html += `<line class="tree-edge ${cls}" x1="${na.x}" y1="${na.y+12}" x2="${nb.x}" y2="${nb.y-12}"/>`;
  });
  // Nodes
  stNodes.forEach(n => {
    const st = nodeStates[n.id] || '';
    html += `<g class="tree-node ${st}"><circle cx="${n.x}" cy="${n.y}" r="12"/><text x="${n.x}" y="${n.y+4}">${n.label}</text></g>`;
  });
  svg.innerHTML = html;
}

function subsetNext() {
  subsetStep++;
  if (subsetStep >= subsetSteps.length) { subsetStep = subsetSteps.length - 1; return; }
  const s = subsetSteps[subsetStep];
  if (s.action === 'visit') { nodeStates[s.node] = 'active'; }
  else if (s.action === 'back') { nodeStates[s.node] = 'done'; }
  else if (s.action === 'result') { nodeStates[s.node] = 'result'; subsetResults.push('[' + s.path.join(',') + ']'); }
  document.getElementById('current-path').textContent = '[' + s.path.join(', ') + ']';
  document.getElementById('current-results').textContent = subsetResults.join(', ') || '[]';
  document.getElementById('subset-status').textContent = s.desc;
  drawSubsetTree();
}
function subsetReset() {
  subsetStep = -1; subsetResults = []; nodeStates = {};
  document.getElementById('current-path').textContent = '[]';
  document.getElementById('current-results').textContent = '[]';
  document.getElementById('subset-status').textContent = '点击"下一步"开始';
  drawSubsetTree();
}
drawSubsetTree();

// === Animation 2: Permutation vs Combination comparison ===
// Permutation tree for P(3,2): pick 2 from [1,2,3], order matters
const permNodes = [
  {id:0, x:170, y:20, label:'根'},
  {id:1, x:60, y:90, label:'1'},  {id:2, x:170, y:90, label:'2'}, {id:3, x:280, y:90, label:'3'},
  {id:4, x:20, y:170, label:'12'},{id:5, x:60, y:170, label:'13'},
  {id:6, x:140, y:170, label:'21'},{id:7, x:195, y:170, label:'23'},
  {id:8, x:255, y:170, label:'31'},{id:9, x:305, y:170, label:'32'},
];
const permEdges = [[0,1],[0,2],[0,3],[1,4],[1,5],[2,6],[2,7],[3,8],[3,9]];

// Combination tree for C(3,2): pick 2 from [1,2,3], order doesn't matter
const combNodes = [
  {id:0, x:170, y:20, label:'根'},
  {id:1, x:60, y:90, label:'1'},  {id:2, x:170, y:90, label:'2'}, {id:3, x:280, y:90, label:'3'},
  {id:4, x:30, y:170, label:'12'},{id:5, x:90, y:170, label:'13'},
  {id:6, x:170, y:170, label:'23'},
];
const combEdges = [[0,1],[0,2],[0,3],[1,4],[1,5],[2,6]];

const compareSteps = [
  { perm: [0], comb: [0], desc: '根节点：选第一个元素' },
  { perm: [0,1,2,3], comb: [0,1,2,3], desc: '第一层：都可选1/2/3' },
  { perm: [0,1,4,5,2,6,7,3,8,9], comb: [0,1,4,5,2,6], desc: '第二层：排列每个都可选剩余所有；组合只能选后面的' },
];
let compareStep = -1;
let permActive = [], combActive = [];

function drawCompareTree(svgId, nodes, edges, activeIds) {
  const svg = document.getElementById(svgId);
  let html = '';
  edges.forEach(([a,b]) => {
    const na = nodes[a], nb = nodes[b];
    const cls = (activeIds.includes(a) && activeIds.includes(b)) ? 'active' : '';
    html += `<line class="tree-edge ${cls}" x1="${na.x}" y1="${na.y+12}" x2="${nb.x}" y2="${nb.y-12}"/>`;
  });
  nodes.forEach(n => {
    const st = activeIds.includes(n.id) ? 'active' : '';
    html += `<g class="tree-node ${st}"><circle cx="${n.x}" cy="${n.y}" r="14"/><text x="${n.x}" y="${n.y+4}">${n.label}</text></g>`;
  });
  svg.innerHTML = html;
}

function compareNext() {
  compareStep++;
  if (compareStep >= compareSteps.length) { compareStep = compareSteps.length - 1; return; }
  const s = compareSteps[compareStep];
  permActive = s.perm;
  combActive = s.comb;
  document.getElementById('compare-status').textContent = s.desc;
  drawCompareTree('perm-tree', permNodes, permEdges, permActive);
  drawCompareTree('comb-tree', combNodes, combEdges, combActive);
}
function compareReset() {
  compareStep = -1; permActive = []; combActive = [];
  document.getElementById('compare-status').textContent = '点击"下一步"开始';
  drawCompareTree('perm-tree', permNodes, permEdges, []);
  drawCompareTree('comb-tree', combNodes, combEdges, []);
}
drawCompareTree('perm-tree', permNodes, permEdges, []);
drawCompareTree('comb-tree', combNodes, combEdges, []);
</script>

<script>
(function () {
  function reportHeight() { parent.postMessage({ type: 'tc-anim-height', height: document.documentElement.scrollHeight }, '*'); }
  window.addEventListener('load', reportHeight);
  if (window.ResizeObserver) { new ResizeObserver(reportHeight).observe(document.body); } else { setInterval(reportHeight, 500); }
})();
</script>
</body>
</html>
