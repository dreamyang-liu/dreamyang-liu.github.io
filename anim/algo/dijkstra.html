<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dijkstra 动画</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: transparent; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; line-height: 1.6; padding: 4px; }
.btn { background: linear-gradient(135deg, #76b900, #00d4aa); color: #000; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.9rem; transition: transform 0.2s, opacity 0.2s; }
.btn:hover { transform: scale(1.05); opacity: 0.9; }
.btn:active { transform: scale(0.95); }
.btn-secondary { background: #333; color: #e0e0e0; border: 1px solid #555; }
.btn-secondary:hover { background: #444; }
.controls { display: flex; gap: 10px; margin: 15px 0; flex-wrap: wrap; align-items: center; }
.animation-container { background: #0a0a1a; border-radius: 12px; padding: 20px; margin: 0.5rem 0; border: 1px solid #333; position: relative; overflow: hidden; }
.step-info { color: #76b900; font-size: 0.9rem; margin: 10px 0; min-height: 24px; }
svg text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
.dist-table { width: 100%; border-collapse: collapse; margin: 10px 0; }
.dist-table th, .dist-table td { padding: 8px 12px; border: 1px solid #333; text-align: center; font-family: monospace; }
.dist-table th { background: #1a1a2e; color: #76b900; }
.dist-table td { background: #0a0a1a; }
.dist-table td.updated { background: #76b900; color: #000; font-weight: bold; transition: background 0.3s; }
</style>
</head>
<body>

<div class="animation-container" id="anim-container">
  <svg id="graph-svg" width="100%" height="280" viewBox="0 0 500 280"></svg>
  <table class="dist-table" id="dist-table">
    <thead><tr><th>节点</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th></tr></thead>
    <tbody><tr><td>dist</td><td id="d0">0</td><td id="d1">inf</td><td id="d2">inf</td><td id="d3">inf</td><td id="d4">inf</td></tr></tbody>
  </table>
  <div class="step-info" id="step-info">点击"下一步"开始 Dijkstra 演示（从节点 0 出发）</div>
  <div class="controls">
    <button class="btn" id="btn-next">下一步</button>
    <button class="btn btn-secondary" id="btn-reset">重置</button>
  </div>
</div>

<script>
// --- Graph Animation ---
const nodes = [
  {id:0, x:80, y:140},
  {id:1, x:200, y:50},
  {id:2, x:200, y:230},
  {id:3, x:350, y:100},
  {id:4, x:420, y:220}
];
const edges = [
  {u:0,v:1,w:4}, {u:0,v:2,w:2},
  {u:1,v:3,w:5}, {u:2,v:1,w:1},
  {u:2,v:3,w:8}, {u:2,v:4,w:10},
  {u:3,v:4,w:2}
];

const svg = document.getElementById('graph-svg');
function drawGraph() {
  let html = '';
  // edges
  edges.forEach((e,i) => {
    const s = nodes[e.u], t = nodes[e.v];
    const mx = (s.x+t.x)/2, my = (s.y+t.y)/2;
    html += `<line id="edge-${i}" x1="${s.x}" y1="${s.y}" x2="${t.x}" y2="${t.y}" stroke="#444" stroke-width="2"/>`;
    html += `<text x="${mx}" y="${my-8}" fill="#aaa" font-size="12" text-anchor="middle">${e.w}</text>`;
  });
  // nodes
  nodes.forEach(n => {
    html += `<circle id="node-${n.id}" cx="${n.x}" cy="${n.y}" r="22" fill="#333" stroke="#666" stroke-width="2"/>`;
    html += `<text x="${n.x}" y="${n.y+5}" fill="#e0e0e0" font-size="14" text-anchor="middle" font-weight="bold">${n.id}</text>`;
  });
  svg.innerHTML = html;
}
drawGraph();

// Dijkstra steps
function computeSteps() {
  const dist = [0, Infinity, Infinity, Infinity, Infinity];
  const confirmed = [false,false,false,false,false];
  const steps = [];
  const g = [[],[],[],[],[]];
  edges.forEach(e => g[e.u].push({v:e.v, w:e.w}));

  // priority queue simulation
  const pq = [{d:0, u:0}];
  steps.push({type:'init', msg:'初始化：dist[0]=0，其余为 inf。优先队列 = [(0,0)]'});

  while(pq.length) {
    pq.sort((a,b)=>a.d-b.d);
    const {d, u} = pq.shift();
    if(d > dist[u]) continue;
    steps.push({type:'pop', node:u, dist:[...dist], msg:`弹出节点 ${u}（距离=${d}），标记为已确定`});
    confirmed[u] = true;
    const relaxed = [];
    for(const {v, w} of g[u]) {
      const nd = d + w;
      if(nd < dist[v]) {
        dist[v] = nd;
        pq.push({d:nd, u:v});
        relaxed.push({v, nd, old: dist[v] === nd ? 'inf' : dist[v]});
      }
    }
    if(relaxed.length) {
      steps.push({type:'relax', from:u, targets:relaxed, dist:[...dist], confirmed:[...confirmed],
        msg:`从节点 ${u} 松弛：${relaxed.map(r=>`dist[${r.v}]=${r.nd}`).join(', ')}`});
    }
  }
  steps.push({type:'done', dist:[...dist], msg:'完成！所有节点最短距离已确定。'});
  return steps;
}

const steps = computeSteps();
let currentStep = 0;
const distCells = [document.getElementById('d0'),document.getElementById('d1'),document.getElementById('d2'),document.getElementById('d3'),document.getElementById('d4')];
const stepInfo = document.getElementById('step-info');

function colorNode(id, color) {
  const el = document.getElementById('node-'+id);
  if(el) el.setAttribute('fill', color);
}
function resetVis() {
  currentStep = 0;
  nodes.forEach(n => colorNode(n.id, '#333'));
  distCells.forEach((c,i) => { c.textContent = i===0?'0':'inf'; c.className=''; });
  stepInfo.textContent = '点击"下一步"开始 Dijkstra 演示（从节点 0 出发）';
}
function applyStep(step) {
  if(step.type==='init') {
    stepInfo.textContent = step.msg;
  } else if(step.type==='pop') {
    colorNode(step.node, '#f0c800'); // yellow = processing
    setTimeout(()=>colorNode(step.node, '#76b900'), 400); // green = confirmed
    stepInfo.textContent = step.msg;
    step.dist.forEach((d,i) => { distCells[i].textContent = d===Infinity?'inf':d; });
  } else if(step.type==='relax') {
    step.dist.forEach((d,i) => {
      distCells[i].textContent = d===Infinity?'inf':d;
      distCells[i].className = '';
    });
    step.targets.forEach(t => { distCells[t.v].className='updated'; });
    stepInfo.textContent = step.msg;
    // color relaxed nodes
    step.targets.forEach(t => { if(!step.confirmed[t.v]) colorNode(t.v, '#f0c800'); });
    setTimeout(()=>{ step.targets.forEach(t => { if(!step.confirmed[t.v]) colorNode(t.v, '#555'); }); }, 500);
  } else if(step.type==='done') {
    step.dist.forEach((d,i) => { distCells[i].textContent = d; distCells[i].className='updated'; });
    nodes.forEach(n => colorNode(n.id, '#76b900'));
    stepInfo.textContent = step.msg;
  }
}

document.getElementById('btn-next').addEventListener('click', () => {
  if(currentStep < steps.length) { applyStep(steps[currentStep]); currentStep++; }
});
document.getElementById('btn-reset').addEventListener('click', resetVis);
</script>

<script>
(function () {
  function reportHeight() { parent.postMessage({ type: 'tc-anim-height', height: document.documentElement.scrollHeight }, '*'); }
  window.addEventListener('load', reportHeight);
  if (window.ResizeObserver) { new ResizeObserver(reportHeight).observe(document.body); } else { setInterval(reportHeight, 500); }
})();
</script>
</body>
</html>
