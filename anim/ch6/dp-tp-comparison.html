<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DP Attention vs TP Attention</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: transparent;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  line-height: 1.6;
  padding: 4px;
}
h4 { font-size: 1.1rem; color: #7eb8da; margin: 18px 0 8px; }
.interactive-container { background: #1a1a2e; border-radius: 12px; border: 1px solid #444; padding: 24px; margin: 0; position: relative; overflow: hidden; }
.interactive-container::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #00d4aa, #0088ff); }
.interactive-title { font-size: 1.1rem; color: #00d4aa; margin-bottom: 15px; font-weight: 600; }
.comparison-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 15px; }
.comparison-panel { background: #0f0f23; border-radius: 8px; padding: 16px; border: 1px solid #333; }
.comparison-panel h4 { text-align: center; margin-bottom: 10px; }
.bar-chart { margin: 10px 0; }
.bar-row { display: flex; align-items: center; margin: 8px 0; }
.bar-label { width: 80px; font-size: 0.8rem; color: #aaa; }
.bar-track { flex: 1; height: 20px; background: #16213e; border-radius: 4px; overflow: hidden; position: relative; }
.bar-fill { height: 100%; border-radius: 4px; transition: width 1.5s ease; width: 0; }
.bar-fill.cyan { background: linear-gradient(90deg, #00d4aa, #00b89c); }
.bar-fill.blue { background: linear-gradient(90deg, #0088ff, #0066cc); }
.bar-fill.orange { background: linear-gradient(90deg, #ff8c00, #ff6600); }
.bar-value { position: absolute; right: 8px; top: 2px; font-size: 0.7rem; color: #fff; }
@media (max-width: 768px) { .comparison-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="interactive-container">
<div class="interactive-title">Interactive: DP Attention vs TP Attention 对比</div>
<p style="font-size:0.85rem; color:#888; margin-bottom:10px;">调整参数观察内存和通信开销的变化</p>
<div style="display:flex; gap:15px; margin-bottom:15px; flex-wrap:wrap; justify-content:center;">
  <label style="font-size:0.85rem; color:#aaa;">
    Num Heads: <select id="numHeads" onchange="updateComparison()" style="background:#16213e; border:1px solid #444; border-radius:4px; padding:4px 8px; color:#e0e0e0;">
      <option value="32">32</option>
      <option value="64" selected>64</option>
      <option value="128">128</option>
    </select>
  </label>
  <label style="font-size:0.85rem; color:#aaa;">
    TP Degree: <select id="tpDegree" onchange="updateComparison()" style="background:#16213e; border:1px solid #444; border-radius:4px; padding:4px 8px; color:#e0e0e0;">
      <option value="2">2</option>
      <option value="4" selected>4</option>
      <option value="8">8</option>
    </select>
  </label>
  <label style="font-size:0.85rem; color:#aaa;">
    Seq Length: <select id="seqLen" onchange="updateComparison()" style="background:#16213e; border:1px solid #444; border-radius:4px; padding:4px 8px; color:#e0e0e0;">
      <option value="2048">2K</option>
      <option value="8192" selected>8K</option>
      <option value="32768">32K</option>
    </select>
  </label>
</div>
<div class="comparison-grid">
  <div class="comparison-panel">
    <h4 style="color:#0088ff;">TP Attention (传统)</h4>
    <div class="bar-chart">
      <div class="bar-row"><span class="bar-label">KV Cache</span><div class="bar-track"><div class="bar-fill blue" id="tp-kv" style="width:0%"></div><span class="bar-value" id="tp-kv-val"></span></div></div>
      <div class="bar-row"><span class="bar-label">Comm</span><div class="bar-track"><div class="bar-fill orange" id="tp-comm" style="width:0%"></div><span class="bar-value" id="tp-comm-val"></span></div></div>
      <div class="bar-row"><span class="bar-label">Compute</span><div class="bar-track"><div class="bar-fill blue" id="tp-compute" style="width:0%"></div><span class="bar-value" id="tp-compute-val"></span></div></div>
    </div>
    <p style="font-size:0.8rem; color:#888; margin-top:8px;">每个 GPU 持有完整 KV cache 副本<br>All-reduce after attention + MLP</p>
  </div>
  <div class="comparison-panel">
    <h4 style="color:#00d4aa;">DP Attention (优化)</h4>
    <div class="bar-chart">
      <div class="bar-row"><span class="bar-label">KV Cache</span><div class="bar-track"><div class="bar-fill cyan" id="dp-kv" style="width:0%"></div><span class="bar-value" id="dp-kv-val"></span></div></div>
      <div class="bar-row"><span class="bar-label">Comm</span><div class="bar-track"><div class="bar-fill orange" id="dp-comm" style="width:0%"></div><span class="bar-value" id="dp-comm-val"></span></div></div>
      <div class="bar-row"><span class="bar-label">Compute</span><div class="bar-track"><div class="bar-fill cyan" id="dp-compute" style="width:0%"></div><span class="bar-value" id="dp-compute-val"></span></div></div>
    </div>
    <p style="font-size:0.8rem; color:#888; margin-top:8px;">每个 GPU 只维护本地 KV cache<br>All-to-All between attention & MLP</p>
  </div>
</div>
<div id="comparison-summary" style="text-align:center; margin-top:15px; font-size:0.9rem; color:#00d4aa;"></div>
</div>

<script>
// ==================== DP vs TP Comparison ====================
function updateComparison() {
    const numHeads = parseInt(document.getElementById('numHeads').value);
    const tpDegree = parseInt(document.getElementById('tpDegree').value);
    const seqLen = parseInt(document.getElementById('seqLen').value);

    // Simulated metrics (normalized)
    const kvHeads = Math.max(8, numHeads / 8); // GQA
    const batchSize = 64;

    // TP: full KV cache per GPU (all batch, heads split but GQA min)
    const tpKV = kvHeads * 128 * seqLen * batchSize * 2; // bytes
    // DP: local batch only
    const dpKV = kvHeads * 128 * seqLen * (batchSize / tpDegree) * 2;

    const maxKV = tpKV;
    const tpKVpct = 100;
    const dpKVpct = (dpKV / maxKV) * 100;

    // Communication: TP needs all-reduce, DP needs all-to-all
    const tpComm = numHeads * 128 * batchSize * 2; // all-reduce volume
    const dpComm = numHeads * 128 * batchSize * 2 * 0.7; // all-to-all (slightly less)
    const maxComm = Math.max(tpComm, dpComm);

    // Compute is similar
    const compute = 85;

    // Update bars with animation
    setTimeout(() => {
        document.getElementById('tp-kv').style.width = tpKVpct + '%';
        document.getElementById('dp-kv').style.width = dpKVpct + '%';
        document.getElementById('tp-comm').style.width = (tpComm / maxComm * 80) + '%';
        document.getElementById('dp-comm').style.width = (dpComm / maxComm * 80) + '%';
        document.getElementById('tp-compute').style.width = compute + '%';
        document.getElementById('dp-compute').style.width = (compute + 3) + '%';

        const tpKVgb = (tpKV / 1e9).toFixed(1);
        const dpKVgb = (dpKV / 1e9).toFixed(1);
        document.getElementById('tp-kv-val').textContent = tpKVgb + 'GB';
        document.getElementById('dp-kv-val').textContent = dpKVgb + 'GB';
        document.getElementById('tp-comm-val').textContent = 'AR';
        document.getElementById('dp-comm-val').textContent = 'A2A';
        document.getElementById('tp-compute-val').textContent = '~same';
        document.getElementById('dp-compute-val').textContent = '~same';
    }, 50);

    const saving = ((1 - dpKV / tpKV) * 100).toFixed(1);
    document.getElementById('comparison-summary').textContent =
        `KV Cache 节省: ${saving}% (DP degree = ${tpDegree})`;
}

window.addEventListener('DOMContentLoaded', () => {
    updateComparison();
});
</script>

<script>
(function () {
  function reportHeight() { parent.postMessage({ type: 'tc-anim-height', height: document.documentElement.scrollHeight }, '*'); }
  window.addEventListener('load', reportHeight);
  if (window.ResizeObserver) { new ResizeObserver(reportHeight).observe(document.body); } else { setInterval(reportHeight, 500); }
})();
</script>
</body>
</html>
