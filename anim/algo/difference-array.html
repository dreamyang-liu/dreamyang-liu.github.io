<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>差分数组动画</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: transparent;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  line-height: 1.8;
  padding: 4px;
}
code { background: #0a0a1a; padding: 2px 6px; border-radius: 4px; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.9em; color: #00d4aa; }
.animation-container { background: #0a0a1a; border-radius: 12px; padding: 20px; margin: 8px 0; border: 1px solid #333; }
.btn { background: linear-gradient(135deg, #76b900, #00d4aa); color: #000; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.9rem; transition: transform 0.2s, opacity 0.2s; }
.btn:hover { transform: scale(1.05); opacity: 0.9; }
.btn:active { transform: scale(0.95); }
.btn-secondary { background: #333; color: #e0e0e0; border: 1px solid #555; }
.btn-secondary:hover { background: #444; }
.controls { display: flex; gap: 10px; margin: 15px 0; flex-wrap: wrap; align-items: center; }
.step-info { color: #76b900; font-size: 0.95rem; margin: 10px 0; min-height: 24px; }
.array-row { display: flex; gap: 4px; margin: 10px 0; flex-wrap: wrap; }
.array-cell { width: 60px; height: 50px; display: flex; align-items: center; justify-content: center; background: #1a1a2e; border: 2px solid #444; border-radius: 6px; font-size: 1rem; font-family: monospace; font-weight: bold; transition: all 0.4s ease; }
.array-cell.positive { border-color: #76b900; color: #76b900; }
.array-cell.negative { border-color: #ff6b6b; color: #ff6b6b; }
.array-cell.highlight { background: #76b900; color: #000; border-color: #76b900; }
.array-cell.result { background: #00d4aa; color: #000; border-color: #00d4aa; }
.array-label { font-size: 0.8rem; color: #888; text-align: center; width: 60px; }
.label-row { display: flex; gap: 4px; margin-bottom: 4px; }
@media (max-width: 600px) {
  .array-cell { width: 44px; height: 40px; font-size: 0.85rem; }
  .array-label { width: 44px; font-size: 0.7rem; }
}
</style>
</head>
<body>

<div class="animation-container">
<p style="margin-bottom:10px; color:#888;">数组长度8，执行3次区间加操作: <code>[1,4]+3</code>, <code>[2,6]+2</code>, <code>[5,7]+1</code></p>

<div>
<p style="font-size:0.85rem; color:#888; margin-bottom:4px;">索引:</p>
<div class="label-row" id="indexRow"></div>
</div>

<div style="margin-top:12px;">
<p style="font-size:0.85rem; color:#888; margin-bottom:4px;">原始数组 (初始全0):</p>
<div class="array-row" id="originalArray"></div>
</div>

<div style="margin-top:12px;">
<p style="font-size:0.85rem; color:#888; margin-bottom:4px;">差分数组 diff[]:</p>
<div class="array-row" id="diffArray"></div>
</div>

<div style="margin-top:12px;">
<p style="font-size:0.85rem; color:#888; margin-bottom:4px;">前缀和还原结果:</p>
<div class="array-row" id="resultArray"></div>
</div>

<div class="step-info" id="stepInfo">点击"下一步"开始演示</div>

<div class="controls">
<button class="btn" id="nextBtn" onclick="nextStep()">下一步</button>
<button class="btn btn-secondary" onclick="resetAnimation()">重置</button>
</div>
</div>

<script>
const N = 8;
const operations = [
  { l: 1, r: 4, c: 3, desc: '操作1: [1,4] += 3' },
  { l: 2, r: 6, c: 2, desc: '操作2: [2,6] += 2' },
  { l: 5, r: 7, c: 1, desc: '操作3: [5,7] += 1' }
];

let diff = new Array(N + 1).fill(0);
let currentStep = 0;
// Steps: 0=init, 1=op1-left, 2=op1-right, 3=op2-left, 4=op2-right, 5=op3-left, 6=op3-right, 7=prefix-sum
const totalSteps = 8;

function initArrays() {
  const indexRow = document.getElementById('indexRow');
  const origArr = document.getElementById('originalArray');
  const diffArr = document.getElementById('diffArray');
  const resArr = document.getElementById('resultArray');

  indexRow.innerHTML = '';
  origArr.innerHTML = '';
  diffArr.innerHTML = '';
  resArr.innerHTML = '';

  for (let i = 0; i < N; i++) {
    indexRow.innerHTML += `<div class="array-label">${i}</div>`;
    origArr.innerHTML += `<div class="array-cell" id="orig-${i}">0</div>`;
    diffArr.innerHTML += `<div class="array-cell" id="diff-${i}">0</div>`;
    resArr.innerHTML += `<div class="array-cell" id="res-${i}">-</div>`;
  }
}

function updateDiffDisplay() {
  for (let i = 0; i < N; i++) {
    const cell = document.getElementById(`diff-${i}`);
    cell.textContent = diff[i];
    cell.className = 'array-cell';
    if (diff[i] > 0) cell.className += ' positive';
    else if (diff[i] < 0) cell.className += ' negative';
  }
}

function nextStep() {
  if (currentStep >= totalSteps) return;

  // Clear previous highlights
  for (let i = 0; i < N; i++) {
    document.getElementById(`diff-${i}`).classList.remove('highlight');
  }

  if (currentStep === 0) {
    document.getElementById('stepInfo').textContent = '初始状态：差分数组全0';
    currentStep++;
  } else if (currentStep <= 6) {
    const opIdx = Math.floor((currentStep - 1) / 2);
    const isLeft = (currentStep - 1) % 2 === 0;
    const op = operations[opIdx];

    if (isLeft) {
      diff[op.l] += op.c;
      document.getElementById(`diff-${op.l}`).classList.add('highlight');
      document.getElementById('stepInfo').textContent = `${op.desc} → diff[${op.l}] += ${op.c}`;
    } else {
      if (op.r + 1 < N) {
        diff[op.r + 1] -= op.c;
        document.getElementById(`diff-${op.r + 1}`).classList.add('highlight');
        document.getElementById('stepInfo').textContent = `${op.desc} → diff[${op.r + 1}] -= ${op.c}`;
      } else {
        document.getElementById('stepInfo').textContent = `${op.desc} → r+1=${op.r+1} 超出范围，跳过`;
      }
    }
    updateDiffDisplay();
    currentStep++;
  } else if (currentStep === 7) {
    // Prefix sum
    let sum = 0;
    for (let i = 0; i < N; i++) {
      sum += diff[i];
      const cell = document.getElementById(`res-${i}`);
      cell.textContent = sum;
      cell.className = 'array-cell result';
    }
    document.getElementById('stepInfo').textContent = '前缀和还原完成！result[i] = Σ diff[0..i]';
    document.getElementById('nextBtn').textContent = '完成';
    currentStep++;
  }
}

function resetAnimation() {
  diff = new Array(N + 1).fill(0);
  currentStep = 0;
  initArrays();
  document.getElementById('stepInfo').textContent = '点击"下一步"开始演示';
  document.getElementById('nextBtn').textContent = '下一步';
}

initArrays();

// ========== 自动把高度汇报给父页面 ==========
(function () {
  function reportHeight() { parent.postMessage({ type: 'tc-anim-height', height: document.documentElement.scrollHeight }, '*'); }
  window.addEventListener('load', reportHeight);
  if (window.ResizeObserver) { new ResizeObserver(reportHeight).observe(document.body); } else { setInterval(reportHeight, 500); }
})();
</script>
</body>
</html>
